name: Keep Supabase alive

on:
  schedule:
    # Tiap hari jam 03:00 UTC — jauh lebih cepat dari batas auto-pause 7 hari Supabase free tier.
    # (Catatan: "*/N" di field tanggal bulan itu BUKAN "tiap N hari", tapi tanggal kelipatan N —
    # bisa nyaris kelewat jendela 7 hari kalau selisih antar tanggal jatuh > 7. Jadi dibikin harian saja.)
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tulis heartbeat ke database Supabase
        run: |
          # PATCH (bukan cuma SELECT) ke tabel keepalive — update baris beneran kena RLS yang
          # mengizinkan anon update, jadi tercatat sebagai aktivitas database asli, bukan cuma
          # hit API yang mungkin diabaikan oleh detektor auto-pause Supabase.
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            "https://vfffkwayrjepacmbasmo.supabase.co/rest/v1/keepalive?id=eq.1" \
            -H "apikey: sb_publishable_hfSq3vLE6u05YHJMREJXOw_aNPDX2KO" \
            -H "Authorization: Bearer sb_publishable_hfSq3vLE6u05YHJMREJXOw_aNPDX2KO" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"pinged_at":"now()"}')
          echo "Status: $code"
          cat /tmp/resp.json || true
          if [ "$code" -ge 300 ]; then exit 1; fi
