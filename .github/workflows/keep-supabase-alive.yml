name: Keep Supabase alive

on:
  schedule:
    # 3x sehari. Supabase minta "beberapa request ke database tiap hari", jadi 1 ping/hari terlalu sedikit.
    - cron: '7 1 * * *'
    - cron: '7 9 * * *'
    - cron: '7 17 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Banyak request baca + tulis ke database Supabase
        run: |
          base="https://vfffkwayrjepacmbasmo.supabase.co/rest/v1/keepalive?id=eq.1"
          key="sb_publishable_hfSq3vLE6u05YHJMREJXOw_aNPDX2KO"
          fail=0
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "$base" \
              -H "apikey: $key" -H "Authorization: Bearer $key" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d '{"pinged_at":"now()"}')
            echo "PATCH $i: $code"; [ "$code" -ge 300 ] && fail=1
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base&select=pinged_at" \
              -H "apikey: $key" -H "Authorization: Bearer $key")
            echo "GET $i: $code"; [ "$code" -ge 300 ] && fail=1
            sleep 2
          done
          exit $fail
