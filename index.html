routes.bank=function(){const tx=bankTx(bkF.acc||null).filter(t=>!bkF.m||ym(t.date)===bkF.m);const months=[...new Set(bankTx(null).map(t=>ym(t.date)))].sort().reverse();let bal=bkF.acc?bankBal(bkF.acc,bkF.m?ym(iso(addMonths(D(bkF.m+'-01'),-1)))+'-31':'0000'):S.banks.reduce((s,b)=>s+b.opening,0)+(bkF.m?bankTx(null).filter(t=>ym(t.date)<bkF.m).reduce((s,t)=>s+t.in-t.out,0):0);const open=bal;
 return`<div class="top"><div><h1>Buku Bank</h1><p>Saldo dan mutasi kas & bank dari transaksi sistem: kas masuk (penerimaan) dan kas keluar (pembayaran komisi). Modul biaya/AP menyusul di sistem cost control.</p></div><div class="flex"><a class="btn" href="#report/cashproj">Proyeksi kas</a><button class="btn" onclick="editBanks()">Saldo awal</button></div></div>

 ${filterBar([`<select onchange="bkF.acc=this.value;nav()"><option value="">Rekening: semua</option>${S.banks.map(b=>`<option value="${b.id}" ${bkF.acc===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`,`<select onchange="bkF.m=this.value;nav()"><option value="">Bulan: semua</option>${months.map(m=>`<option value="${m}" ${bkF.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,`<span class="sp"></span><button class="btn s" onclick="exportTable(document.querySelector('table.bank'),'buku-bank.csv')">Ekspor CSV</button>`])}
 <div class="card flush"><div class="tw"><table class="bank"><thead><tr><th>Tanggal</th><th>Rekening</th><th>No. bukti</th><th>Keterangan</th><th class="num">Masuk</th><th class="num">Keluar</th><th class="num">Saldo</th></tr></thead><tbody><tr><td colspan="6" class="muted">Saldo awal${bkF.m?' '+mlong(bkF.m):''}</td><td class="num">${fmt(open)}</td></tr>${tx.map(t=>{bal+=t.in-t.out;return`<tr class="row" onclick="go('${t.href}')"><td>${dstr(t.date)}</td><td>${t.acc}</td><td class="mono">${esc(t.no)}</td><td>${esc(t.ket)}</td><td class="num">${t.in?fmt(t.in):''}</td><td class="num">${t.out?fmt(t.out):''}</td><td class="num" style="font-weight:500">${fmt(bal)}</td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${fmt(tx.reduce((s,t)=>s+t.in,0))}</td><td class="num">${fmt(tx.reduce((s,t)=>s+t.out,0))}</td><td class="num">${fmt(bal)}</td></tr></tfoot></table></div></div>`};
function editBanks(){modal(`<h2>Saldo awal rekening</h2>${S.banks.map(b=>`<div class="grid g2"><div class="field"><label class="f">${esc(b.name)}</label><input type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(b.opening)}" onchange="S.banks.find(x=>x.id==='${b.id}').opening=num(this.value);save()"></div><div class="field"><label class="f">Per tanggal</label><input type="date" value="${b.openingDate}" onchange="S.banks.find(x=>x.id==='${b.id}').openingDate=this.value;save()"></div></div>`).join('')}<div class="mfoot"><button class="btn g" onclick="closeModal();nav()">Selesai</button></div>`)}

/* ---------- MODUL KOMISI: pembayaran & aturan ---------- */
function commAlloc(sellerId){const vs=S.invoices.filter(v=>v.status==='issued'&&v.comm.on&&v.comm.approved&&v.seller===sellerId).sort((a,b)=>a.date.localeCompare(b.date));const out={};vs.forEach(v=>out[v.id]={amt:calc(v).comm.amount,paid:0});let pool=0;S.commPayments.filter(p=>p.seller===sellerId&&p.status!=='void').forEach(p=>{if(p.alloc&&p.alloc.length)p.alloc.forEach(a=>{if(out[a.inv])out[a.inv].paid+=a.amt});else pool+=p.amount});vs.forEach(v=>{const o=out[v.id];const use=Math.min(Math.max(0,o.amt-o.paid),pool);o.paid+=use;pool-=use});Object.values(out).forEach(o=>o.st=o.paid>=o.amt?'paid':o.paid>0?'partial':'unpaid');return out}
routes.commpays=function(){const ps=S.commPayments.slice().sort((a,b)=>b.date.localeCompare(a.date));const act=ps.filter(p=>p.status!=='void');return`<div class="top"><div><h1>Pembayaran Komisi</h1><p>Riwayat pembayaran komisi ke penjual · ${act.length} aktif · ${ps.length-act.length} dibatalkan</p></div><div class="flex"><a class="btn" href="#commissions">Monitoring</a><button class="btn g" onclick="payCommStart()">+ Bayar komisi</button></div></div>${(()=>{const bad=commRows().filter(r=>r.v.comm.approved&&r.rem>0&&!commSellerOk(r.v));return bad.length?`<div class="note r mb">⚠ <b>${bad.length} faktur</b> komisinya sudah disetujui (${fmt(bad.reduce((a,r)=>a+r.rem,0))}) tetapi <b>penerima komisinya belum valid</b>, jadi tidak bisa dibayar: ${bad.map(r=>`<a href="#invoice/${r.v.id}">${esc(r.v.no||'draft')}</a>`).join(', ')}. Buka fakturnya → tab Komisi → pilih penerima komisi.</div>`:''})()}<div class="grid g3 mb"><div class="card kpi"><p class="lbl">Dibayar bulan ini</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('Pembayaran komisi ${mlong(ym(iso(TODAY)))}',S.commPayments.filter(p=>p.status!=='void'&&ym(p.date)==='${ym(iso(TODAY))}').map(p=>({no:p.ref||'Komisi',who:se(p.seller).name,date:p.date,amt:p.amount,href:'commpays'})))">${fmtS(act.filter(p=>ym(p.date)===ym(iso(TODAY))).reduce((s,p)=>s+p.amount,0))}</a></div></div><div class="card kpi"><p class="lbl">Total dibayar</p><div class="v">${fmtS(act.reduce((s,p)=>s+p.amount,0))}</div></div><div class="card kpi"><p class="lbl">Piutang komisi penjual</p><div class="v" style="color:var(--red)"><a href="#commissions" style="color:inherit">${fmtS(commRows().reduce((s,r)=>s+r.rem,0))}</a></div><div class="d">belum dibayar</div></div></div><div class="card flush"><div class="tw"><table><thead><tr><th>Tanggal</th><th>Penjual</th><th>Bank</th><th>Referensi</th><th>Alokasi ke faktur</th><th class="num">Nominal</th><th>Status</th><th></th></tr></thead><tbody>${ps.length?ps.map(p=>`<tr style="${p.status==='void'?'opacity:.55':''}"><td>${dstr(p.date)}</td><td>${se(p.seller).name}</td><td>${esc(p.bank||'Rekening PT')}</td><td>${esc(p.ref||'')}</td><td style="white-space:normal">${p.alloc&&p.alloc.length?p.alloc.map(a=>`<a href="#invoice/${a.inv}" class="mono">${(S.invoices.find(v=>v.id===a.inv)||{}).no||'?'}</a> ${fmtS(a.amt)}`).join(' · '):'<span class="muted">otomatis (FIFO)</span>'}</td><td class="num">${fmt(p.amount)}</td><td>${p.status==='void'?`<span class="st r" title="${esc(p.voidReason||'')}">Dibatalkan · ${esc(p.voidReason||'')}</span>`:'<span class="st g">Dibayar</span>'}</td><td class="right">${can('pay')?(p.status!=='void'?`<button class="btn q s" onclick="editCommPay('${p.id}')">Edit</button><button class="btn q s d" onclick="voidCommPay('${p.id}')">Batalkan</button>`:`<button class="btn q s" onclick="unvoidCommPay('${p.id}')">Aktifkan kembali</button>`)+`<button class="btn q s d" onclick="delCommPay('${p.id}')">Hapus</button>`:''}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada pembayaran</td></tr>'}</tbody></table></div></div>`};
routes.commrules=function(){if(!can('settings'))return'<div class="empty">Hanya Master yang bisa mengubah aturan komisi.</div>';return`<div class="top"><div><h1>Aturan Komisi</h1><p>BD untuk faktur pertama pelanggan, AM untuk faktur lanjutan. Aturan terbaru yang cocok dipakai; per faktur tetap bisa % / Rp custom.</p></div></div>${commRulesHtml()}`};

let pmS='';
const PPH_ST={none:['n','Faktur tanpa PPh'],unpaid:['n','Belum dibayar klien'],'bupot-missing':['a','Dipotong klien · bupot belum ada'],'bupot-ok':['g','Dipotong klien · bupot lengkap'],full:['a','Klien bayar penuh · PPh tidak dipotong & tidak disetor'],'self-open':['a','Klien bayar penuh · setor sendiri sebagian'],'self-done':['g','Klien bayar penuh · sudah disetor sendiri'],woff:['n','Dibebankan (bupot tidak datang)']};
const PPH_SETOR_DAY={pph23:10,pph_final:15};
function pphSetorDue(payDate,type){const d=D(payDate);return iso(new Date(d.getFullYear(),d.getMonth()+1,PPH_SETOR_DAY[type]||15))}
function pphInfo(v){const c=calc(v);const rate=(tx(v.pph||'none')||{}).rate||0;const expected=Math.round(c.total*rate);const withheld=c.rc.reduce((s,l)=>s+(+l.pph||0),0);const woff=c.rc.reduce((s,l)=>s+(l.writeoff?(+l.writeoff.pph||0):0),0);const lunas=c.total>0&&c.rem<=0;const selfDue=lunas?Math.max(0,expected-withheld-woff):0;const setor=(v.pphSetor||[]).reduce((s,x)=>s+(+x.amount||0),0);const out=Math.max(0,selfDue-setor);const pl=c.rc.filter(l=>(+l.pph||0)>0);const nMissing=pl.filter(l=>!(l.bukti||'').trim()).length;const lastPay=c.rc.reduce((m,l)=>l.date>m?l.date:m,'');const due=selfDue>0&&lastPay?pphSetorDue(lastPay,v.pph):'';let st;if(!rate)st='none';else if(selfDue>0)st=out<=0?'self-done':setor>0?'self-open':'full';else if(withheld>0)st=nMissing?'bupot-missing':'bupot-ok';else if(woff>0)st='woff';else st='unpaid';return{rate,expected,withheld,woff,lunas,selfDue,setor,out,nBupot:pl.length,nMissing,lastPay,due,late:st==='self-open'&&!!due&&due<iso(TODAY),st}}
function pajakTab(v){const i=pphInfo(v);const sl=PPH_ST[i.st];return`<div class="grid g3 mb"><div class="card kpi"><p class="lbl">Estimasi PPh (${tx(v.pph).label})</p><div class="v">${fmt(i.expected)}</div><div class="d"><span class="st ${sl[0]}">${sl[1]}</span></div></div><div class="card kpi"><p class="lbl">Dipotong klien</p><div class="v">${fmt(i.withheld)}</div><div class="d">${i.nBupot?'bupot '+(i.nBupot-i.nMissing)+'/'+i.nBupot+' diterima':'belum ada potongan'}${i.woff?' · dibebankan '+fmt(i.woff):''}</div></div><div class="card kpi"><p class="lbl">PPh tidak dipotong klien</p><div class="v" style="color:${i.out>0?'var(--amber)':'inherit'}">${fmt(i.selfDue)}</div><div class="d">disetor sendiri ${fmt(i.setor)} · belum disetor ${fmt(i.out)}${i.due?' · tenggat '+dstr(i.due)+(i.late?' · LEWAT':''):''}</div></div></div>${i.selfDue>0&&v.pph==='pph_final'?`<div class="note a">PPh Final tidak disetor per faktur. Faktur ini masuk perhitungan bulan <b>${mlong(ym(v.date))}</b> (omzet semua faktur bulan itu disetor sekali, tgl 15 bulan berikutnya). Catat setoran & pelaporan di <a href="#taxmon">Monitoring Pajak Bulanan</a>.</div>`:''}${i.selfDue>0&&v.pph!=='pph_final'?`<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:8px"><h3 style="margin:0">Setor PPh sendiri ke DJP <span class="small muted" style="font-weight:400">(opsional — isi kalau Anda menyetor)</span></h3>${can('pay')?`<button class="btn g s" onclick="pphSetorModal('${v.id}')">+ Catat setor</button>`:''}</div><div class="tw"><table><thead><tr><th>Tanggal</th><th>NTPN / bukti setor</th><th>Bank</th><th class="num">Nominal</th><th></th></tr></thead><tbody>${(v.pphSetor||[]).length?(v.pphSetor||[]).map(x=>`<tr><td>${dstr(x.date)}</td><td class="mono">${esc(x.ref||'—')}</td><td>${esc((S.banks.find(b=>b.id===x.bankId)||{}).name||'Rekening PT')}</td><td class="num">${fmt(x.amount)}</td><td class="right">${can('pay')?`<button class="btn q s" onclick="pphSetorModal('${v.id}','${x.id}')">Edit</button><button class="btn q s d" onclick="pphSetorDel('${v.id}','${x.id}')">Hapus</button>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada setoran</td></tr>'}</tbody></table></div>`:(i.selfDue>0?'':`<p class="small muted">${i.withheld>0?'PPh dipotong klien dan disetor klien; pantau bukti potong di Laporan → Rekap PPh.':i.lunas?'PPh sudah dipotong atau tidak ada selisih untuk faktur ini.':'Belum lunas — status PPh ditentukan setelah klien membayar. Kalau klien membayar penuh tanpa memotong, selisih PPh dicatat di sini.'}</p>`)}`}

async function bSubmit(){const b=bClean(dD);b.amount=(b.items||[]).reduce((t,x)=>t+bItemAmt(x),0);const err=bValidate(b);if(err){toast(err);return}if(b.kind==='CA'&&bOpenCA(me.id).some(x=>x.id!==b.id)){toast('Masih ada Cash Advance yang belum selesai settlement — selesaikan dulu sebelum mengajukan CA baru');return}const pc=person(me.id);if(isStaff()&&(!pc||!Array.isArray(pc.chain))){toast('Jenjang approval Anda belum diatur — minta Master/Finance mengatur di Pengaturan → Pengaju & approval');return}const chain=pc&&Array.isArray(pc.chain)?pc.chain.slice():[];if(b.id==='new')b.id=b.uid;b.chain=chain;b.appr1=chain[0]||null;b.div=(pc||{}).div||'';b.status=chain.length?'appr1':'fin';if(!b.no)b.no=await bNo(b.kind);const again=(b.hist||[]).some(h=>h.a.startsWith('Diajukan'));bHist(b,again?'Diajukan ulang':'Diajukan',chain.length?'jenjang: '+chain.map(uName).join(' → ')+' → Finance':'langsung ke Finance');if(!await bPut(b))return;logIt('budget',b.id,(again?'Diajukan ulang ':'Diajukan ')+b.no+' '+fmt(b.amount));notify(chain.length?[chain[0]]:finUsers(),`${b.no} · ${me.name} mengajukan ${bKind(b)} ${fmt(b.amount)} — perlu approval Anda`,'br/'+b.id);toast(b.no+' diajukan '+(chain.length?'ke '+uName(chain[0]):'ke Finance'));finishDoc(location.hash.replace('#',''),'budget')}
async function bAct(id,fn,msg,toUsers,note){const src=(S.budgets||[]).find(x=>x.id===id);if(!src)return;const b=JSON.parse(JSON.stringify(src));const r=fn(b);if(r===false)return;bHist(b,msg,note);if(!await bPut(b))return;logIt('budget',b.id,b.no+' · '+msg+(note?' · '+note:''));const tg=typeof toUsers==='function'?toUsers(b):toUsers;notify(tg,`${b.no} · ${msg}${note?' — '+note:''} (${me.name})`,'br/'+b.id);dD=null;closeModal();nav();toast(b.no+' · '+msg)}
function bApprove(id){const b=S.budgets.find(x=>x.id===id);if(!b)return;const ch=b.chain||[];const i=ch.indexOf(me.id);const nx=i>=0&&i<ch.length-1?ch[i+1]:null;const st=b.status==='st_appr1';if(nx)return bAct(id,x=>{x.appr1=nx},(st?'Settlement disetujui ':'Disetujui ')+me.name+' · lanjut ke '+uName(nx),x=>[x.by,nx]);return bAct(id,x=>{x.status=st?'st_fin':'fin';x.appr1=null},(st?'Settlement disetujui ':'Disetujui ')+me.name+' · lanjut ke Finance',x=>[x.by,...finUsers()])}
function bReject(id){const b=S.budgets.find(x=>x.id===id);if(!b)return;const why=prompt('Alasan menolak '+b.no+' (wajib):','');if(why===null)return;if(!why.trim()){toast('Alasan penolakan wajib diisi — pengajuan tidak jadi ditolak');return}const st=b.status.startsWith('st_')?'ca_open':'rejected';bAct(id,x=>{x.status=st;x.rejectNote=why},st==='ca_open'?'Settlement dikembalikan untuk diperbaiki':'Ditolak',x=>[x.by],why)}

function bPayModal(id,mode){const b=S.budgets.find(x=>x.id===id);if(!b)return;window._mf=[];window._mfId=b.id;const d=bDiff(b);const title=mode==='diff'?(d>0?'Bayar kekurangan · '+b.no:'Catat pengembalian kelebihan · '+b.no):'Bayar · '+b.no;const amt=mode==='diff'?Math.abs(d):+b.amount;modal(`<h2>${title}</h2><p class="small muted" style="margin:0 0 12px">${mode==='diff'?(d>0?`Realisasi ${fmt(bReal(b))} lebih besar dari CA ${fmt(b.amount)}. Finance mentransfer kekurangan ke ${esc(b.byName)}.`:`Realisasi ${fmt(bReal(b))} lebih kecil dari CA ${fmt(b.amount)}. ${esc(b.byName)} harus mentransfer balik kelebihannya; catat di sini setelah uang masuk.`):`${bKind(b)} ke ${esc(b.payee.name)} · ${esc(b.payee.bank)} ${esc(b.payee.acc)} a.n. ${esc(b.payee.accName||b.payee.name)}`}</p><div class="grid g2"><div class="field"><label class="f">Nominal</label><input value="${fmt(amt)}" disabled></div><div class="field"><label class="f">Tanggal ${mode==='diff'&&d<0?'uang masuk':'transfer'}</label><input type="date" id="bpDate" value="${iso(TODAY)}"></div><div class="field"><label class="f">Rekening ${mode==='diff'&&d<0?'penerima':'sumber'}</label>${bBankSel('bpBank')}</div><div class="field"><label class="f">No. referensi / bukti</label><input id="bpRef" placeholder="mis. no. transaksi bank"></div></div><div class="field"><label class="f">Bukti transfer (opsional)</label><div id="mfList">${bFilesHtml([],false)}</div><label class="btn s mt8" style="cursor:pointer">+ Unggah bukti<input type="file" multiple style="display:none" onchange="bUpload(this,'modal')"></label></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="bPaySave('${id}','${mode||''}')">Simpan</button></div>`)}
function bPaySave(id,mode){const date=document.getElementById('bpDate').value,bank=document.getElementById('bpBank').value,ref=document.getElementById('bpRef').value.trim();if(!date){toast('Tanggal transfer wajib diisi');return}if(plock(date))return;const files=(window._mf||[]).slice();if(mode==='diff'){const b0=S.budgets.find(x=>x.id===id);const d=bDiff(b0);bAct(id,x=>{x.diff={amt:d,date,bank,ref,files,by:me.name};x.status='done'},d>0?'Kekurangan '+fmt(d)+' dibayar · selesai':'Pengembalian kelebihan '+fmt(-d)+' diterima · selesai',x=>[x.by]);return}bAct(id,x=>{x.pay={date,bank,ref,files,by:me.name};x.status=x.kind==='CA'?'ca_open':'done'},'Dibayar',x=>[x.by],(S.banks.find(k=>k.id===bank)||{}).name||bank)}

 let body;if(f.view==='line'){body=`<table class="bva">${head('Faktur · Klien · Service').replace('<th>Faktur · Klien · Service</th>','<th>Faktur</th><th>Klien</th><th>Service</th>')}<tbody>${rows.length?rows.sort((a,b)=>b.v.date.localeCompare(a.v.date)).map(r=>`<tr class="row" onclick="hppOpen['${r.v.id}']=true;go('hpp')"><td class="mono">${esc(r.v.no)}</td><td>${esc(cu(r.cust).name)}</td><td>${esc(r.svc)}</td>${cells({rev:r.rev,plan:r.plan,act:r.act,miss:r.noPlan?1:0})}</tr>`).join(''):'<tr><td colspan="9" class="empty">Tidak ada data</td></tr>'}</tbody><tfoot><tr><td colspan="3">Total</td>${cells(tot)}</tr></tfoot></table>`}else{const g=f.view==='cust'?grp(r=>r.cust):grp(r=>r.svc);body=`<table class="bva">${head(f.view==='cust'?'Klien / brand':'Service')}<tbody>${g.length?g.map(o=>`<tr class="row" onclick="bvF.${f.view==='cust'?'c':'sv'}='${esc(o.key)}';bvF.view='${f.view==='cust'?'svc':'line'}';nav()"><td>${f.view==='cust'?esc(cu(o.key).name):esc(o.key)} <span class="small muted">· ${o.n} baris</span></td>${cells(o)}</tr>`).join(''):'<tr><td colspan="7" class="empty">Tidak ada data</td></tr>'}</tbody><tfoot><tr><td>Total</td>${cells(tot)}</tr></tfoot></table>`}
 return`<div class="top"><div><h1>Anggaran vs Realisasi</h1><p><b>Anggaran</b> = HPP rencana per service di faktur. <b>Realisasi</b> = pengajuan budget yang sudah final (Payment Request dibayar, Cash Advance sudah di-settle) yang merujuk ke service itu. Klik baris untuk menelusuri: klien → service → faktur.</p></div><button class="btn s" onclick="exportTable(document.querySelector('table.bva'),'anggaran-vs-realisasi.csv')">Ekspor CSV</button></div>
 <div class="grid g4 mb"><div class="card kpi"><p class="lbl">Anggaran (HPP rencana)</p><div class="v">${fmt(tot.plan)}</div><p class="small muted">${tot.miss?tot.miss+' baris belum ada HPP rencana':'semua baris sudah ada rencana'}</p></div><div class="card kpi"><p class="lbl">Realisasi</p><div class="v">${fmt(tot.act)}</div><p class="small muted">${tot.plan?Math.round(tot.act/tot.plan*100)+'% dari anggaran':'—'}</p></div><div class="card kpi"><p class="lbl">Sisa anggaran</p><div class="v" style="color:${tot.plan-tot.act<0?'var(--red)':'inherit'}">${fmt(tot.plan-tot.act)}</div><p class="small muted">${over} service melebihi anggaran</p></div><div class="card kpi"><p class="lbl">Realisasi non-project</p><div class="v">${fmt(np)}</div><p class="small muted">tidak terkait faktur/brand</p></div></div>
 <div class="tabs">${[['cust','Per klien'],['svc','Per service'],['line','Per faktur & service']].map(t=>`<button class="${f.view===t[0]?'on':''}" onclick="bvF.view='${t[0]}';nav()">${t[1]}</button>`).join('')}</div>
 ${filterBar([`<select onchange="bvF.m=this.value;nav()"><option value="">Bulan faktur: semua</option>${months.map(m=>`<option value="${m}" ${f.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,combo(custOpts(),f.c,"v=>{bvF.c=v;nav()}",'Klien: ketik untuk cari…',false,1),`<select onchange="bvF.sv=this.value;nav()"><option value="">Service: semua</option>${svcs.map(x=>`<option value="${esc(x)}" ${f.sv===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`,`<span class="sp"></span><span class="cnt">${rows.length} baris service</span>`,(f.m||f.c||f.sv)?`<button class="btn q s" onclick="bvF={view:bvF.view,m:'',c:'',sv:''};nav()">Hapus filter</button>`:''])}

/* ---------- MONITORING PAJAK BULANAN (PPh Final UMKM: setor tgl 15, lapor tgl 20 bulan berikutnya) ---------- */
let txOpen={};
function taxDeadlines(m){const d=D(m+'-01');const nx=new Date(d.getFullYear(),d.getMonth()+1,1);const y=nx.getFullYear(),mo=pad(nx.getMonth()+1);return{setor:y+'-'+mo+'-15',lapor:y+'-'+mo+'-20'}}
function taxCalc(m){const vs=S.invoices.filter(v=>v.status==='issued'&&!v.passthrough&&v.pph==='pph_final'&&ym(v.date)===m).sort((a,b)=>a.date.localeCompare(b.date));let omzet=0,exp=0,wh=0,whNo=0,due=0,legacy=0;const rows=vs.map(v=>{const i=pphInfo(v);const c=calc(v);const wSlip=c.rc.reduce((t,l)=>t+((l.bukti||'').trim()?(+l.pph||0):0),0);const wNo=Math.max(0,i.withheld-wSlip);const d=Math.max(0,i.expected-wSlip);omzet+=c.total;exp+=i.expected;wh+=Math.min(wSlip,i.expected);whNo+=Math.min(wNo,Math.max(0,i.expected-wSlip));due+=d;const lg=(v.pphSetor||[]).reduce((t,x)=>t+(+x.amount||0),0);legacy+=lg;return{v,c,i,d,lg,wSlip,wNo}});const tm=(S.taxmonthly||{})[m]||{};const paidM=(tm.setor||[]).reduce((t,x)=>t+(+x.amount||0),0);const paid=paidM+legacy;const sisa=Math.max(0,due-paid);const lebih=Math.max(0,paid-due);const dl=taxDeadlines(m);const T0=iso(TODAY);const ended=T0>m+'-31'||ym(T0)>m;let ss,sc;if(due<=0&&!vs.length){ss='Tidak ada omzet kena PPh Final';sc='n'}else if(!ended){ss='Bulan berjalan — belum ditutup';sc='n'}else if(due<=0){ss='Tidak ada yang perlu disetor';sc='g'}else if(sisa<=0){ss='Sudah disetor';sc='g'}else if(T0>dl.setor){ss='TERLAMBAT '+Math.round((TODAY-D(dl.setor))/864e5)+' hr';sc='r'}else if(Math.round((D(dl.setor)-TODAY)/864e5)<=5){ss='Segera — '+Math.round((D(dl.setor)-TODAY)/864e5)+' hr lagi';sc='a'}else{ss='Belum jatuh tempo';sc='b'}let ls,lc;if(tm.lapor&&tm.lapor.date){ls='Sudah lapor '+dstr(tm.lapor.date);lc='g'}else if(!ended||(!vs.length&&!tm.setor)){ls='—';lc='n'}else if(T0>dl.lapor){ls='BELUM LAPOR · telat '+Math.round((TODAY-D(dl.lapor))/864e5)+' hr';lc='r'}else{ls='Belum lapor';lc=Math.round((D(dl.lapor)-TODAY)/864e5)<=5?'a':'b'}return{m,vs,rows,omzet,exp,wh,whNo,due,paidM,legacy,paid,sisa,lebih,dl,tm,ended,ss,sc,ls,lc,late:sc==='r',lateL:lc==='r'}}
function taxAlertCount(){try{return taxMonths().map(taxCalc).filter(x=>x.late||x.lateL||x.sc==='a').length}catch(e){return 0}}
function taxMonths(){const ms=new Set();S.invoices.forEach(v=>{if(v.status==='issued'&&!v.passthrough&&v.pph==='pph_final')ms.add(ym(v.date))});Object.keys(S.taxmonthly||{}).forEach(m=>ms.add(m));return[...ms].sort().reverse()}
routes.taxmon=function(){if(isStaff())return'<div class="empty">Tidak ada akses.</div>';const all=taxMonths().map(taxCalc);const need=all.filter(x=>x.ended&&x.sisa>0);const late=all.filter(x=>x.late),lateL=all.filter(x=>x.lateL);
 return`<div class="top"><div><h1>Monitoring Pajak Bulanan</h1><p>PPh Final 0,5% (UMKM) dihitung dari <b>omzet faktur terbit per bulan</b> (berdasarkan tanggal faktur). Disetor paling lambat <b>tanggal 15</b> dan dilaporkan paling lambat <b>tanggal 20</b> bulan berikutnya. PPh yang dipotong klien baru dikurangkan dari yang harus disetor sendiri <b>setelah bukti potong (bupot) diterima dan diperiksa</b> — selama bupot belum ada, nilainya tampil di kolom "menunggu bupot" dan tetap dihitung harus disetor.</p></div></div>
 <div class="grid g4 mb"><div class="card kpi"><p class="lbl">Harus disetor (bulan sudah tutup)</p><div class="v" style="color:${need.length?'var(--amber)':'var(--green)'}">${fmt(need.reduce((t,x)=>t+x.sisa,0))}</div><p class="small muted">${need.length} bulan belum disetor</p></div><div class="card kpi"><p class="lbl">Setor terlambat</p><div class="v" style="color:${late.length?'var(--red)':'var(--green)'}">${late.length}</div><p class="small muted">${late.map(x=>mlabel(x.m)).join(', ')||'Tidak ada'}</p></div><div class="card kpi"><p class="lbl">Belum lapor (lewat tenggat)</p><div class="v" style="color:${lateL.length?'var(--red)':'var(--green)'}">${lateL.length}</div><p class="small muted">${lateL.map(x=>mlabel(x.m)).join(', ')||'Tidak ada'}</p></div><div class="card kpi"><p class="lbl">Dipotong klien · menunggu bupot</p><div class="v" style="color:${all.reduce((t,x)=>t+x.whNo,0)?'var(--amber)':'var(--green)'}">${fmt(all.reduce((t,x)=>t+x.whNo,0))}</div><p class="small muted">klien sudah memotong, bupot belum diterima · <a href="#report/pph">Rekap PPh & bupot</a></p></div></div>
 <div class="card flush"><div class="tw"><table class="taxm"><thead><tr><th>Bulan faktur</th><th class="num">Omzet kena PPh Final</th><th class="num">PPh 0,5%</th><th class="num">Dipotong klien · bupot ada</th><th class="num">Dipotong klien · menunggu bupot</th><th class="num">Harus disetor</th><th class="num">Sudah disetor</th><th class="num">Sisa</th><th>Tenggat setor</th><th>Status setor</th><th>Status lapor (tgl 20)</th><th></th></tr></thead><tbody>${all.length?all.map(x=>`<tr class="row" onclick="txOpen['${x.m}']=!txOpen['${x.m}'];nav()"><td><b>${mlong(x.m)}</b> <span class="small muted">${txOpen[x.m]?'▾':'▸'} ${x.vs.length} faktur</span></td><td class="num">${fmt(x.omzet)}</td><td class="num">${fmt(x.exp)}</td><td class="num">${x.wh?fmt(x.wh):'—'}</td><td class="num" style="color:${x.whNo?'var(--amber)':'inherit'}" title="Klien sudah memotong PPh, tapi bukti potong belum diterima/diperiksa — belum dikurangkan dari yang harus disetor">${x.whNo?fmt(x.whNo):'—'}</td><td class="num" style="font-weight:600">${fmt(x.due)}</td><td class="num">${x.paid?fmt(x.paid):'—'}</td><td class="num" style="color:${x.sisa>0&&x.ended?'var(--amber)':'inherit'}">${x.lebih>0?`<span title="Setoran melebihi yang harus disetor (mis. bupot datang belakangan) — jadi kredit/kompensasi">lebih setor ${fmt(x.lebih)}</span>`:fmt(x.sisa)}</td><td>${dstr(x.dl.setor)}</td><td><span class="st ${x.sc}">${x.ss}</span></td><td><span class="st ${x.lc}">${x.ls}</span></td><td class="right" style="white-space:nowrap" onclick="event.stopPropagation()">${can('pay')?`${x.sisa>0?`<button class="btn s g" onclick="txSetorModal('${x.m}')">+ Catat setor</button> `:''}${x.tm.lapor&&x.tm.lapor.date?`<button class="btn q s" onclick="txLaporModal('${x.m}')">Ubah lapor</button>`:`<button class="btn s" onclick="txLaporModal('${x.m}')">Tandai sudah lapor</button>`}`:''}</td></tr>${txOpen[x.m]?`<tr><td colspan="12" style="background:var(--sf2);padding:10px 18px 16px"><table class="dense"><thead><tr><th>Faktur</th><th>Tanggal</th><th>Pelanggan</th><th class="num">Nilai</th><th class="num">PPh 0,5%</th><th class="num">Dipotong · bupot ada</th><th class="num">Dipotong · menunggu bupot</th><th class="num">Harus disetor</th></tr></thead><tbody>${x.rows.map(r=>`<tr><td class="mono"><a href="#invoice/${r.v.id}">${esc(r.v.no||'?')}</a></td><td>${dstr(r.v.date)}</td><td>${esc(cu(r.v.cust).name)}</td><td class="num">${fmt(r.c.total)}</td><td class="num">${fmt(r.i.expected)}</td><td class="num">${r.wSlip?fmt(r.wSlip):'—'}</td><td class="num" style="color:${r.wNo?'var(--amber)':'inherit'}">${r.wNo?fmt(r.wNo)+' <a class="small" href="#report/pph">cek bupot</a>':'—'}</td><td class="num">${fmt(r.d)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Tidak ada faktur ber-PPh Final di bulan ini</td></tr>'}</tbody></table><h3 class="mt8">Setoran bulan ini</h3><table class="dense"><thead><tr><th>Tanggal</th><th>NTPN / bukti setor</th><th>Bank</th><th class="num">Nominal</th><th></th></tr></thead><tbody>${(x.tm.setor||[]).map((y,k)=>`<tr><td>${dstr(y.date)}</td><td class="mono">${esc(y.ref||'—')}</td><td>${esc((S.banks.find(b=>b.id===y.bank)||{}).name||'Rekening PT')}</td><td class="num">${fmt(y.amount)}</td><td class="right">${can('pay')?`<button class="btn q s d" onclick="txSetorDel('${x.m}',${k})">Hapus</button>`:''}</td></tr>`).join('')}${x.legacy?`<tr><td colspan="3" class="muted">Setoran per faktur (pencatatan lama)</td><td class="num">${fmt(x.legacy)}</td><td></td></tr>`:''}${!(x.tm.setor||[]).length&&!x.legacy?'<tr><td colspan="5" class="empty">Belum ada setoran</td></tr>':''}</tbody></table>${x.tm.lapor&&x.tm.lapor.date?`<p class="small mt8">Dilaporkan ${dstr(x.tm.lapor.date)}${x.tm.lapor.ref?' · bukti/BPE: '+esc(x.tm.lapor.ref):''}</p>`:''}</td></tr>`:''}`).join(''):'<tr><td colspan="12" class="empty">Belum ada faktur ber-PPh Final</td></tr>'}</tbody></table></div></div><p class="small muted mt8">Jatuh tempo mengikuti tanggal 15 dan 20 setiap bulan; kalau jatuh di hari libur, sesuaikan dengan ketentuan pajak (konfirmasi ke konsultan pajak). "Harus disetor" dihitung dari PPh Final faktur dikurangi PPh yang sudah dipotong klien; angkanya turun kalau klien kemudian membayar dengan memotong PPh.</p>`};
function txSetorModal(m){if(!can('pay')){toast('Hanya Master & Finance yang bisa mencatat setoran pajak');return}const x=taxCalc(m);modal(`<h2>Catat setor PPh Final · ${mlong(m)}</h2><p class="small muted" style="margin:0 0 12px">Harus disetor ${fmt(x.due)} · sudah disetor ${fmt(x.paid)} · sisa ${fmt(x.sisa)} · tenggat ${dstr(x.dl.setor)}</p><div class="grid g3"><div class="field"><label class="f">Tanggal setor <b>*</b></label><input type="date" id="txD" value="${iso(TODAY)}"></div><div class="field"><label class="f">Nominal <b>*</b></label><input id="txA" type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(x.sisa)}"></div><div class="field"><label class="f">Bank sumber</label><select id="txB">${S.banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div></div><div class="field"><label class="f">NTPN / bukti setor</label><input id="txR" placeholder="mis. 16 digit NTPN"></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="txSetorSave('${m}')">Simpan</button></div>`)}
function txSetorSave(m){const d=document.getElementById('txD').value;const a=Math.round(num(document.getElementById('txA').value));if(!d){toast('Tanggal setor PPh Final wajib diisi');return}if(plock(d))return;if(!(a>0)){toast('Nominal setor PPh Final harus lebih dari 0');return}const x=taxCalc(m);if(a>x.sisa+0.5&&!confirm('Nominal '+fmt(a)+' melebihi sisa yang harus disetor ('+fmt(x.sisa)+'). Tetap simpan?'))return;S.taxmonthly=S.taxmonthly||{};const tm=S.taxmonthly[m]=S.taxmonthly[m]||{};tm.setor=tm.setor||[];tm.setor.push({id:'ts'+Date.now(),date:d,amount:a,ref:document.getElementById('txR').value.trim(),bank:document.getElementById('txB').value,by:me.name});logIt('tax',m,'Setor PPh Final '+mlong(m)+' '+fmt(a)+' · '+d);save();closeModal();toast('Setoran PPh Final '+mlong(m)+' dicatat · sisa '+fmt(Math.max(0,x.sisa-a)));nav()}
function txSetorDel(m,k){const tm=(S.taxmonthly||{})[m];if(!tm||!tm.setor||!tm.setor[k])return;const y=tm.setor[k];if(plock(y.date))return;if(!confirm('Hapus catatan setor PPh Final '+mlong(m)+' '+fmt(y.amount)+' ('+dstr(y.date)+')? Sisa yang harus disetor akan naik kembali.'))return;tm.setor.splice(k,1);logIt('tax',m,'Catatan setor PPh Final dihapus: '+fmt(y.amount)+' · '+y.date);save();toast('Catatan setor dihapus');nav()}
function txLaporModal(m){if(!can('pay')){toast('Hanya Master & Finance yang bisa mencatat pelaporan pajak');return}const tm=(S.taxmonthly||{})[m]||{};const l=tm.lapor||{};modal(`<h2>Pelaporan PPh Final · ${mlong(m)}</h2><p class="small muted" style="margin:0 0 12px">Tenggat lapor ${dstr(taxDeadlines(m).lapor)}.</p><div class="grid g2"><div class="field"><label class="f">Tanggal lapor <b>*</b></label><input type="date" id="tlD" value="${l.date||iso(TODAY)}"></div><div class="field"><label class="f">No. bukti / BPE</label><input id="tlR" value="${esc(l.ref||'')}" placeholder="mis. nomor bukti penerimaan elektronik"></div></div><div class="mfoot">${l.date?`<button class="btn d" onclick="txLaporClear('${m}')">Hapus status lapor</button>`:''}<button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="txLaporSave('${m}')">Simpan</button></div>`)}
function txLaporSave(m){const d=document.getElementById('tlD').value;if(!d){toast('Tanggal lapor wajib diisi');return}S.taxmonthly=S.taxmonthly||{};const tm=S.taxmonthly[m]=S.taxmonthly[m]||{};tm.lapor={date:d,ref:document.getElementById('tlR').value.trim(),by:me.name};logIt('tax',m,'PPh Final '+mlong(m)+' dilaporkan · '+d);save();closeModal();toast('Pelaporan PPh Final '+mlong(m)+' dicatat');nav()}
function txLaporClear(m){if(!confirm('Hapus status "sudah lapor" untuk '+mlong(m)+'?'))return;const tm=(S.taxmonthly||{})[m];if(tm)delete tm.lapor;logIt('tax',m,'Status lapor PPh Final '+mlong(m)+' dihapus');save();closeModal();nav()}

/* ---------- UANG MUKA PENJUALAN (DP manual) ---------- */
let dpF={q:'',m:''};
function depAuto(){return S.receipts.filter(r=>r.status!=='void').flatMap(r=>r.lines.filter(l=>(+l.over||0)>0).map(l=>({id:'ov'+r.id+'_'+l.inv,auto:true,rid:r.id,no:r.no,date:r.date,cust:r.cust,amount:+l.over,bank:r.bank,ref:'',note:'Kelebihan bayar faktur '+((S.invoices.find(v=>v.id===l.inv)||{}).no||'?'),status:'active'})))}
routes.deposits=function(){const manual=(S.deposits||[]);const auto=depAuto();const L=manual.concat(auto).sort((a,b)=>b.date.localeCompare(a.date)||(b.no||'').localeCompare(a.no||''));const act=manual.filter(d=>d.status!=='void');const actAll=L.filter(d=>d.status!=='void');const months=[...new Set(L.map(d=>ym(d.date)))].sort().reverse();const rows=L.filter(d=>(!dpF.m||ym(d.date)===dpF.m)&&(!dpF.q||((d.no||'')+' '+cu(d.cust).name+' '+(d.ref||'')+' '+(d.note||'')).toLowerCase().includes(dpF.q)));const credTot=S.customers.reduce((t,c)=>t+(+c.credit||0),0);
 return`<div class="top"><div><h1>Uang Muka Penjualan (DP)</h1><p>Daftar semua uang muka pelanggan: <b>DP manual</b> (uang yang diterima <b>sebelum</b> ada faktur, diinput di sini) dan <b>kelebihan bayar</b> dari penerimaan (otomatis). Dipakai nanti lewat Penerimaan Penjualan → Potongan → Pakai uang muka.</p></div>${can('pay')?`<button class="btn g" onclick="depModal()">+ Terima uang muka</button>`:''}</div>

 ${filterBar([`<select onchange="dpF.m=this.value;nav()"><option value="">Bulan: semua</option>${months.map(m=>`<option value="${m}" ${dpF.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,`<input id="flt-dp-q" placeholder="Cari no. DP, pelanggan, referensi…" value="${esc(dpF.q||'')}" oninput="dpF.q=this.value.toLowerCase();nav()">`,`<span class="sp"></span><span class="cnt">${rows.length} catatan</span>`,(dpF.m||dpF.q)?`<button class="btn q s" onclick="dpF={q:'',m:''};nav()">Hapus filter</button>`:''])}

function depModal(){if(!can('pay')||RO()){toast('Hanya Master & Finance yang bisa mencatat uang muka');return}modal(`<h2>Terima uang muka (DP)</h2><p class="small muted" style="margin:0 0 12px">Uang masuk ke rekening yang dipilih dan menambah saldo uang muka pelanggan. Dipakai nanti saat membuat Penerimaan Penjualan (Potongan → Pakai uang muka).</p><div class="grid g2"><div class="field"><label class="f">Pelanggan <b>*</b></label><input id="dpC" list="dpCl" autocomplete="off" placeholder="Ketik nama pelanggan…"><datalist id="dpCl">${S.customers.map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist></div><div class="field"><label class="f">Tanggal terima <b>*</b></label><input type="date" id="dpD" value="${iso(TODAY)}"></div><div class="field"><label class="f">Nominal <b>*</b></label><input id="dpA" type="text" inputmode="numeric" oninput="fmtLive(this)" placeholder="mis. 5.000.000"></div><div class="field"><label class="f">Rekening penerima</label><select id="dpB">${S.banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label class="f">No. referensi / bukti transfer</label><input id="dpR" placeholder="mis. no. transaksi bank"></div><div class="field"><label class="f">Keterangan</label><input id="dpN" placeholder="mis. DP 30% penawaran SQ.2026.11.0003"></div></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="depSave()">Simpan</button></div>`)}
function depSave(){const nm=document.getElementById('dpC').value.trim().toLowerCase();const matches=S.customers.filter(c=>c.name.trim().toLowerCase()===nm);const c=matches[0];const d=document.getElementById('dpD').value;const a=Math.round(num(document.getElementById('dpA').value));if(!nm){toast('Pelanggan wajib diisi — ketik dan pilih nama pelanggan');return}if(!c){toast('Pelanggan "'+document.getElementById('dpC').value.trim()+'" tidak ditemukan — pilih dari daftar yang muncul saat mengetik');return}if(matches.length>1){toast('Ada '+matches.length+' pelanggan bernama sama — ganti nama salah satunya dulu');return}if(!d){toast('Tanggal terima uang muka wajib diisi');return}if(plock(d))return;if(!(a>0)){toast('Nominal uang muka wajib diisi dan harus lebih dari 0');return}const rec={id:'dp'+Date.now(),no:nextNo('dp'),date:d,cust:c.id,amount:a,bank:document.getElementById('dpB').value,ref:document.getElementById('dpR').value.trim(),note:document.getElementById('dpN').value.trim(),status:'active',by:me.name};S.deposits=S.deposits||[];S.deposits.push(rec);c.credit=(+c.credit||0)+a;logIt('deposit',rec.id,'Uang muka '+rec.no+' diterima dari '+c.name+' · '+fmt(a));save();closeModal();toast('Uang muka '+rec.no+' dicatat · saldo uang muka '+c.name+' sekarang '+fmt(c.credit));if(location.hash.startsWith('#deposit/new'))go('deposits');else nav()}
function voidDeposit(id){const d=(S.deposits||[]).find(x=>x.id===id);if(!d||d.status==='void')return;if(plock(d.date))return;const c=cu(d.cust);if((+c.credit||0)<d.amount-0.5){toast('Uang muka '+d.no+' sudah dipakai ('+fmt(d.amount-(+c.credit||0))+' dari '+fmt(d.amount)+') — batalkan dulu penerimaan yang memakainya');return}const why=prompt('Batalkan uang muka '+d.no+' ('+fmt(d.amount)+')? Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan pembatalan uang muka wajib diisi — uang muka tidak jadi dibatalkan');return}d.status='void';d.voidReason=why;d.voidBy=me.name;d.voidAt=iso(TODAY);c.credit=Math.max(0,(+c.credit||0)-d.amount);logIt('deposit',d.id,'Uang muka '+d.no+' dibatalkan · '+why);save();toast('Uang muka '+d.no+' dibatalkan');nav()}

/* ---------- ekspor tabel ke CSV (semua laporan & daftar) ---------- */
async function exportTable(tbl,fn){if(!tbl){toast('Tabel tidak ditemukan');return}const q=t=>'"'+String(t).replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"';const MO={jan:1,feb:2,mar:3,apr:4,mei:5,jun:6,jul:7,agu:8,agt:8,sep:9,okt:10,nov:11,des:12};const cv=td=>{const t=String(td.innerText).replace(/\s+/g,' ').trim();let m=t.match(/^(\d{1,2}) ([A-Za-z]{3,4})\.? (\d{4})$/);if(m&&MO[m[2].toLowerCase()])return'"'+m[3]+'-'+String(MO[m[2].toLowerCase()]).padStart(2,'0')+'-'+m[1].padStart(2,'0')+'"';m=t.match(/^(-?)\s*(?:Rp\s*)?(-?)\s*(\d{1,3}(?:\.\d{3})*|\d+)(?:,(\d+))?$/);if(m&&(/^Rp|^-Rp/.test(t)||td.classList.contains('num')||/\./.test(m[3])||m[4]))return(m[1]||m[2]?'-':'')+m[3].replace(/\./g,'')+(m[4]?'.'+m[4]:'');return q(t)};const rows=[...tbl.querySelectorAll('tr')].map(tr=>{const o=[];[...tr.children].filter(td=>getComputedStyle(td).display!=='none'&&!td.classList.contains('noexp')).forEach(td=>{o.push(cv(td));for(let k=1;k<(td.colSpan||1);k++)o.push('""')});return o.join(',')});const csv='﻿'+rows.join('\n');try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data:csv});toast('CSV disimpan');return}}catch(e){if(e&&e.code==='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}

 ${ciF.tab==='draft'?`<div class="card flush"><div class="tw"><table><thead><tr><th>Bulan</th><th>Pelanggan</th><th>Tgl proyeksi</th><th>Jatuh tempo</th><th class="num">Nilai</th><th class="num">Setelah PPh</th><th>Lemparan dari</th><th></th></tr></thead><tbody>${dr.length?dr.map(({v,c})=>{const par=S.invoices.find(x=>x.id===v.parent);return`<tr><td>${mlong(ym(v.date))}</td><td>${cu(v.cust).name}</td><td>${dstr(v.date)}</td><td>${dstr(v.due)}</td><td class="num">${fmt(c.total)}</td><td class="num" style="font-weight:500">${fmt(c.total*(1-tx(v.pph).rate))}</td><td class="mono">${par?(par.no||'proyeksi'):'manual'}</td><td class="right"><a class="btn s" href="#invoice/${v.id}">Buka / Terbitkan</a></td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Tidak ada proyeksi di rentang ini — <a href="#projwiz">susun proyeksi</a></td></tr>'}</tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${fmt(dr.reduce((s,x)=>s+x.c.total,0))}</td><td class="num">${fmt(dr.reduce((s,x)=>s+x.c.total*(1-tx(x.v.pph).rate),0))}</td><td colspan="2"></td></tr></tfoot></table></div></div>`:''}`};

function logHref(l){if(l.entity==='invoice')return'invoice/'+l.id;if(l.entity==='receipt')return'receipt/'+l.id;if(l.entity==='commission')return'commpays';if(l.entity==='projection')return'projection';return''}
routes.activity=function(){const rows=S.log.filter(l=>(!acF.who||l.who===acF.who)&&(!acF.type||l.entity===acF.type)&&(!acF.q||l.m.toLowerCase().includes(acF.q))&&(!acF.from||l.t>=acF.from)&&(!acF.to||l.t<=acF.to));const TYPES={invoice:'Faktur',receipt:'Penerimaan',commission:'Komisi',projection:'Proyeksi',session:'Sesi'};return`<div class="top"><div><h1>Log Aktivitas</h1><p>Semua aktivitas pengguna: input, ubah, batalkan, pulihkan, setujui, bayar, masuk sistem. ${S.log.length} catatan.</p></div><button class="btn s" onclick="exportTable(document.querySelector('table.actlog'),'log-aktivitas.csv')">Ekspor CSV</button></div>${filterBar([`<select onchange="acF.who=this.value;nav()"><option value="">Pengguna: semua</option>${[...new Set(S.log.map(l=>l.who))].map(w=>`<option ${acF.who===w?'selected':''}>${esc(w)}</option>`).join('')}</select>`,`<select onchange="acF.type=this.value;nav()"><option value="">Jenis: semua</option>${Object.keys(TYPES).map(k=>`<option value="${k}" ${acF.type===k?'selected':''}>${TYPES[k]}</option>`).join('')}</select>`,`<input type="date" value="${acF.from}" onchange="acF.from=this.value;nav()">`,`<input type="date" value="${acF.to}" onchange="acF.to=this.value;nav()">`,`<input id="act-q" placeholder="Cari aktivitas" value="${esc(acF.q)}" oninput="acF.q=this.value.toLowerCase();nav()">`,`<span class="sp"></span><span class="cnt">${rows.length}</span>`])}<div class="card flush"><div class="tw"><table class="actlog"><thead><tr><th>Tanggal</th><th>Jam</th><th>Pengguna</th><th>Jenis</th><th>Dokumen</th><th>Aktivitas</th></tr></thead><tbody>${rows.length?rows.map(l=>{const href=logHref(l);const v=l.entity==='invoice'?S.invoices.find(x=>x.id===l.id):null;const r=l.entity==='receipt'?S.receipts.find(x=>x.id===l.id):null;return`<tr class="${href?'row':''}" onclick="${href?`go('${href}')`:''}"><td>${dstr(l.t)}</td><td class="mono">${tjam(l)}</td><td>${esc(l.who)}</td><td>${TYPES[l.entity]||l.entity}</td><td class="mono">${v?(v.no||'proyeksi '+mlabel(ym(v.date))):r?r.no:l.entity==='commission'?se(l.id).name:l.entity==='projection'?(/^\d{4}-\d{2}$/.test(l.id)?mlong(l.id):''):'—'}</td><td style="white-space:normal">${esc(l.m)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Belum ada aktivitas</td></tr>'}</tbody></table></div></div>`};

const SUPA_URL='https://vfffkwayrjepacmbasmo.supabase.co';
const SUPA_KEY='sb_publishable_hfSq3vLE6u05YHJMREJXOw_aNPDX2KO';
const AUTH_DOMAIN='upscale.local';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const COLL={customers:'customers',sellers:'sellers',items:'items',terms:'terms',taxes:'taxes',commRules:'comm_rules',banks:'banks',views:'views',quotes:'quotes',invoices:'invoices',receipts:'receipts',creditNotes:'credit_notes',commPayments:'comm_payments',budgets:'budget_requests',deposits:'customer_deposits'};
const SETTINGS=['company','periods','seq','targets','signatures','divisions','people','taxmonthly'];
const ROLE_UP={master:'Master',finance:'Finance',accounting:'Accounting',staff:'Staff'};
let snap={},cloudReady=false,syncTimer=null,syncing=false,pendingSync=false;
function friendlyErr(e){const m=String((e&&(e.message||e.details))||e||'');if(/Failed to fetch|NetworkError|Load failed/i.test(m))return'Koneksi internet terputus — perubahan BELUM tersimpan. Periksa koneksi lalu coba lagi';if(/row-level security|violates row-level|permission denied/i.test(m))return'Anda tidak punya izin untuk menyimpan ini (peran '+((me&&me.role)||'?')+')';if(/invoices_one_active_per_cust_month|duplicate key/i.test(m))return'Pelanggan ini sudah punya faktur/proyeksi aktif di bulan yang sama — geser atau batalkan yang lama dulu';if(/JWT|expired|not authenticated/i.test(m))return'Sesi masuk berakhir — keluar lalu masuk lagi';if(/violates foreign key/i.test(m))return'Data ini masih dipakai dokumen lain, jadi tidak bisa diubah/dihapus';return m}
function cloudError(e,ctx){console.error(ctx,e);toast((ctx?ctx+': ':'')+friendlyErr(e))}

async function loadCloud(){
  const d=defaultState();
  S={company:d.company,periods:{},targets:{},seq:{inv:1,quote:1,receipt:1,cn:1,cust:1},prefs:{lang:'id',theme:'auto'},users:[],log:[]};
  Object.keys(COLL).forEach(k=>S[k]=[]);
  const qs=Object.entries(COLL).map(([k,t])=>sb.from(t).select('id,data').then(r=>{if(r.error)throw r.error;S[k]=r.data.map(x=>x.data);snap[k]={};r.data.forEach(x=>snap[k][x.id]=JSON.stringify(x.data))}));
  qs.push(sb.from('settings').select('key,data').then(r=>{if(r.error)throw r.error;r.data.forEach(x=>{S[x.key]=x.data;snap[x.key]=JSON.stringify(x.data)})}));
  qs.push(sb.from('profiles').select('*').then(r=>{if(r.error)throw r.error;S.users=r.data.map(p=>({id:p.id,name:p.name,user:p.username,role:ROLE_UP[p.role],active:p.active,prefs:p.prefs,div:p.division||''}))}));
  qs.push(sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500).then(r=>{if(r.error)throw r.error;S.log=r.data.map(l=>({t:l.t,at:l.created_at,who:l.who,entity:l.entity,id:l.doc_id,m:l.m}))}));
  qs.push(sb.from('notifications').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(100).then(r=>{S.notifs=r.error?[]:r.data}));
  await Promise.all(qs);if(!S.divisions)S.divisions=[];if(!S.people)S.people={};if(!S.taxmonthly)S.taxmonthly={};
  // pertama kali: isi master data dasar (tanpa transaksi contoh)
  if(!snap.company&&me&&me.role!=='Accounting'){S.company=d.company;S.periods={};S.seq={inv:1,quote:1,receipt:1,cn:1,cust:1};S.taxes=d.taxes;S.terms=d.terms;S.banks=d.banks.map(b=>({...b,opening:0}));S.commRules=d.commRules;await syncNow();toast('Master data awal dibuat — isi pelanggan, penjual, dan katalog di Penjualan → Data')}
  cloudReady=true;
}
function diffSync(){const ops=[];const lim=!!me&&!can('edit');for(const[k,t]of Object.entries(COLL)){if(k==='budgets')continue;if(lim&&!(k==='quotes'&&isStaff()&&staffSales()))continue;const cur=S[k]||[];const prev=snap[k]||{};const seen={};cur.forEach(doc=>{if(!doc)return;if(!doc.id&&doc.code)doc.id=doc.code;if(!doc.id)return;if(seen[doc.id])doc.id=doc.id+'_'+(++_uidN);const j=JSON.stringify(doc);seen[doc.id]=1;if(prev[doc.id]!==j)ops.push({t,up:{id:doc.id,data:doc},k,j})});Object.keys(prev).forEach(id=>{if(!seen[id])ops.push({t,del:id,k})})}
  if(!lim)SETTINGS.forEach(key=>{const j=JSON.stringify(S[key]||{});if(snap[key]!==j)ops.push({set:key,data:S[key],j})});return ops}
async function syncNow(){if(syncing){pendingSync=true;return}syncing=true;try{const ops=diffSync();const byT={};ops.filter(o=>o.up).forEach(o=>(byT[o.t]=byT[o.t]||[]).push(o));for(const t of Object.keys(byT)){const rows=byT[t].map(o=>o.up);const r=await sb.from(t).upsert(rows,{onConflict:'id'});if(r.error){cloudError(r.error,'Simpan '+t);continue}byT[t].forEach(o=>{snap[o.k]=snap[o.k]||{};snap[o.k][o.up.id]=o.j})}
  for(const o of ops.filter(o=>o.del)){const r=await sb.from(o.t).delete().eq('id',o.del);if(r.error){cloudError(r.error,'Hapus '+o.t);continue}delete snap[o.k][o.del]}
  for(const o of ops.filter(o=>o.set)){const r=await sb.from('settings').upsert({key:o.set,data:o.data},{onConflict:'key'});if(r.error){cloudError(r.error,'Simpan '+o.set);continue}snap[o.set]=o.j}
  const el=document.getElementById('syncdot');if(el)el.className='syncdot ok';}finally{syncing=false;if(pendingSync){pendingSync=false;syncNow()}}}
function save(){if(!cloudReady)return;const el=document.getElementById('syncdot');if(el)el.className='syncdot busy';clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,250)}
function logIt(entity,id,m){const t=iso(TODAY);S.log.unshift({t,at:new Date().toISOString(),who:me?me.name:'—',entity,id,m});if(cloudReady||entity==='session')sb.from('activity_log').insert({t,who:me?me.name:'—',user_id:me?me.id:null,entity,doc_id:id,m}).then(r=>{if(r.error)console.error(r.error)})}
async function doLogin(){const u=(document.getElementById('lu')||{}).value||'',p=(document.getElementById('lp')||{}).value||'';const btn=document.querySelector('.login .btn');if(btn){btn.disabled=true;btn.textContent='Memeriksa…'}const {error}=await sb.auth.signInWithPassword({email:u.trim().toLowerCase()+'@'+AUTH_DOMAIN,password:p});if(error){toast(t('Nama pengguna atau kata sandi salah'));if(btn){btn.disabled=false;btn.textContent=t('Masuk')}return}await afterAuth(true)}
async function afterAuth(freshLogin){const {data:{user}}=await sb.auth.getUser();if(!user){loggedIn=false;return nav()}const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error||!p||!p.active){toast('Akun tidak aktif');await sb.auth.signOut();loggedIn=false;return nav()}me={id:p.id,name:p.name,user:p.username,role:ROLE_UP[p.role],prefs:p.prefs,div:p.division||''};loggedIn=true;try{await loadCloud()}catch(e){cloudError(e,'Muat data');}S.prefs=p.prefs||S.prefs;updateFavicon();logIt('session',me.id,'Masuk ke sistem');startSession(p);subscribeRealtime();if(freshLogin){pages=[];lastRoute=null;try{history.replaceState(null,'','#'+((S.prefs&&S.prefs.defaultPage)||'dashboard'))}catch(e){}}nav()}
async function logout(){logIt('session',me.id,'Keluar');stopSession();await sb.auth.signOut();loggedIn=false;me=null;pages=[];lastRoute=null;cloudReady=false;snap={};if(rtChan){sb.removeChannel(rtChan);rtChan=null}try{history.replaceState(null,'','#')}catch(e){}nav()}
function setLang(x){S.prefs=S.prefs||{};S.prefs.lang=x;if(me)sb.from('profiles').update({prefs:S.prefs}).eq('id',me.id).then(()=>{});nav()}
function setTheme(x){S.prefs=S.prefs||{};S.prefs.theme=x;if(me)sb.from('profiles').update({prefs:S.prefs}).eq('id',me.id).then(()=>{});applyTheme();nav()}
function setDefaultPage(x){S.prefs=S.prefs||{};S.prefs.defaultPage=x;if(me)sb.from('profiles').update({prefs:S.prefs}).eq('id',me.id).then(()=>{});toast('Halaman awal diubah');nav()}
function companyDirty(){const b=document.getElementById('companySaveBtn'),h=document.getElementById('companySavedHint'),c=document.getElementById('companyCancelBtn');if(b)b.disabled=false;if(c)c.disabled=false;if(h)h.style.display='none'}
function cancelCompanyTab(){if(window._cmpBase)S.company=JSON.parse(window._cmpBase);nav();toast('Perubahan dibatalkan')}
function saveCompanyTab(){if(S.company.phone&&!/^\d{1,13}$/.test(String(S.company.phone).trim())){toast('Nomor telepon perusahaan hanya boleh angka (tanpa spasi, +, atau tanda -) dan maksimal 13 digit — sekarang: '+String(S.company.phone).trim().length+' karakter');return}window._cmpBase=JSON.stringify(S.company);save();const b=document.getElementById('companySaveBtn'),h=document.getElementById('companySavedHint');if(b)b.disabled=true;if(h)h.style.display='';toast('Perusahaan & template disimpan');nav()}
let mySessionId=null,mySessionAt=null,sessionChan=null,sessionTimer=null;
function newSessionId(){return(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2))}
async function startSession(p){mySessionId=newSessionId();mySessionAt=new Date();await sb.from('profiles').update({session_id:mySessionId,session_started_at:mySessionAt.toISOString()}).eq('id',p.id);
 sessionChan=sb.channel('session-'+p.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'profiles',filter:'id=eq.'+p.id},payload=>{if(payload.new&&payload.new.session_id&&payload.new.session_id!==mySessionId)forceLogout(t('Akun ini baru saja masuk di perangkat lain.'))}).subscribe();
 clearInterval(sessionTimer);sessionTimer=setInterval(async()=>{if(!loggedIn||!me)return;if(mySessionAt&&Date.now()-mySessionAt.getTime()>=6*3600*1000){forceLogout(t('Sesi berakhir setelah 6 jam — silakan masuk lagi.'));return}try{const r=await sb.from('profiles').select('session_id').eq('id',me.id).single();if(r.data&&r.data.session_id&&r.data.session_id!==mySessionId)forceLogout(t('Akun ini baru saja masuk di perangkat lain.'))}catch(e){}},60000)}
function stopSession(){if(sessionChan){sb.removeChannel(sessionChan);sessionChan=null}clearInterval(sessionTimer);sessionTimer=null;mySessionId=null;mySessionAt=null}
async function forceLogout(msg){stopSession();toast(msg);await sb.auth.signOut().catch(()=>{});loggedIn=false;me=null;pages=[];lastRoute=null;cloudReady=false;snap={};if(rtChan){sb.removeChannel(rtChan);rtChan=null}try{history.replaceState(null,'','#')}catch(e){}nav()}
let rtChan=null;function subscribeRealtime(){if(rtChan)return;rtChan=sb.channel('docs');Object.values(COLL).concat(['settings']).forEach(t=>rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},payload=>{if(syncing)return;const mine=payload.new&&payload.new.updated_by===me.id;if(mine)return;refreshFromCloud()}));rtChan.on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications',filter:'user_id=eq.'+me.id},p=>{S.notifs=S.notifs||[];if(!S.notifs.some(n=>n.id===p.new.id))S.notifs.unshift(p.new);toast('🔔 '+p.new.m);refreshBell()});rtChan.subscribe()}
let refreshTimer=null;function refreshFromCloud(){clearTimeout(refreshTimer);refreshTimer=setTimeout(async()=>{if(dD){toast('Ada perubahan dari pengguna lain — akan dimuat setelah dokumen ini ditutup');return}try{const keepPrefs=S.prefs;await loadCloud();S.prefs=keepPrefs;nav();toast('Data diperbarui dari pengguna lain')}catch(e){cloudError(e,'Muat ulang')}},600)}
// kelola akun (Master) lewat Edge Function admin-users
async function adminUsers(body){const r=await sb.functions.invoke('admin-users',{body});let d=r.data||{};if(r.error&&r.error.context&&typeof r.error.context.json==='function'){try{d=await r.error.context.json()}catch(e){}}if(r.error||d.error){toast(d.error||(r.error&&r.error.message)||'Gagal');return false}return d}
async function setUserDiv(id,div){const r=await sb.from('profiles').update({division:div||null}).eq('id',id);if(r.error){cloudError(r.error,'Ubah divisi');return}logIt('session',id,'Divisi diubah ke '+((divOf(div)||{}).name||'—'));toast('Divisi diubah');reloadUsers()}
async function reloadUsers(){const r=await sb.from('profiles').select('*');if(!r.error)S.users=r.data.map(p=>({id:p.id,name:p.name,user:p.username,role:ROLE_UP[p.role],active:p.active,prefs:p.prefs,div:p.division||''}));nav()}
document.addEventListener('click',e=>{document.querySelectorAll('details.dd[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})},true);
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)await afterAuth();else{S=defaultState();S.users=[];loggedIn=false;nav()}sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&loggedIn){loggedIn=false;nav()}})}
boot();
