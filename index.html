<style>

:root[data-theme="dark"]{--bg:#000;--sf:#1C1C1E;--sf2:#232326;--hover:#2A2A2E;--ink:#F5F5F7;--ink2:#C7C7CC;--ink3:#8E8E93;--ink4:#636366;--hair:rgba(255,255,255,.10);--hair2:rgba(255,255,255,.18);--blue:#2997FF;--blue-soft:rgba(41,151,255,.14);--green:#30D158;--amber:#FFB340;--red:#FF6961;--green-soft:rgba(48,209,88,.14);--amber-soft:rgba(255,179,64,.14);--red-soft:rgba(255,105,97,.14);--sh:none;--sh2:0 12px 40px rgba(0,0,0,.6);--bar1:#F5F5F7;--bar2:#8E8E93;--bar3:#48484A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 "Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;font-feature-settings:"tnum" 1}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;letter-spacing:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--hair2);border-radius:8px;padding:8px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:38px;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:var(--ink4)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--ink);margin:0}
input:disabled,select:disabled{color:var(--ink3);background:var(--sf2)}
label.f{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.field{margin-bottom:14px}
.btn{border:1px solid var(--hair2);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:500;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.p:hover{opacity:.88;background:var(--ink)}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.q{border-color:transparent;background:transparent;color:var(--blue)}.btn.q:hover{background:var(--blue-soft)}
.btn.d{color:var(--red)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{display:grid;grid-template-columns:172px 1fr;grid-template-rows:46px 38px 1fr;min-height:100vh}
.topbar{grid-column:1/-1;background:#1D1D1F;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px 0 10px;position:sticky;top:0;z-index:30}
.topbar .brand{padding:0;color:#fff;font-size:14px;flex:none}.topbar .brand i{background:#fff}.topbar .brand i::after{background:#1D1D1F}
.topbar .search{flex:1;min-width:120px;max-width:420px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:13px;color:rgba(255,255,255,.7)}
.topbar .search input{background:transparent;border:0;color:#fff;padding:0;font-size:13px}.topbar .search input::placeholder{color:rgba(255,255,255,.55)}.topbar .search input:focus{box-shadow:none}
.topbar .sp{flex:1}.topbar .co{flex:none;font-size:12.5px;color:rgba(255,255,255,.75);text-align:right;line-height:1.2;margin-left:6px}.topbar .co b{display:block;color:#fff;font-weight:500}
.topbar details.dd .menu{color:var(--ink)}.syncdot{width:8px;height:8px;border-radius:50%;background:#30D158;display:inline-block;margin-right:4px}.syncdot.busy{background:#FFB340;animation:blink 1s infinite}@keyframes blink{50%{opacity:.3}}.topbar .av{flex:none;color:#fff;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;font-weight:600}

.pagetabs{grid-column:2;display:flex;align-items:flex-end;gap:2px;padding:0 12px;background:var(--sf);border-bottom:1px solid var(--hair);position:sticky;top:46px;z-index:25;overflow-x:auto}
.pagetabs .pt{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}

.pagetabs .pt i{font-style:normal;color:var(--ink4);padding:0 3px;border-radius:4px;font-size:13px}.pagetabs .pt i:hover{background:var(--hover);color:var(--ink)}
.pagetabs .cnt2{margin-left:auto;font-size:12px;color:var(--ink3);padding:8px 6px;white-space:nowrap}
.rail{grid-row:2/4;background:var(--sf);border-right:1px solid var(--hair);display:flex;flex-direction:column;align-items:stretch;padding:8px 8px;gap:2px;position:sticky;top:46px;height:calc(100vh - 46px)}
.rail button{width:100%;height:36px;border:0;background:transparent;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--ink2);position:relative;font-size:13px;text-align:left;white-space:nowrap}.rail button svg{flex:none}.rail .grp{font-size:10.5px;color:var(--ink4);letter-spacing:.06em;text-transform:uppercase;padding:12px 10px 4px}
.rail button:hover{background:var(--hover);color:var(--ink)}.rail button.on{background:var(--ink);color:var(--bg)}
.rail button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button .tt{position:static;background:none;color:inherit;font-size:13px;padding:0;display:inline}
.rail button:hover .tt{display:inline}.rail .sp{flex:1}.rail .badge2{position:absolute;top:10px;right:8px;min-width:15px;height:15px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 3px}
.modpanel{position:fixed;left:172px;top:46px;width:620px;max-height:calc(100vh - 46px);background:var(--sf);border:1px solid var(--hair);border-left:0;border-radius:0 0 16px 0;box-shadow:var(--sh2);z-index:40;padding:22px 26px 26px;overflow:auto}
.modpanel h2{font-size:18px;margin-bottom:4px}.modpanel .grp{font-size:11.5px;color:var(--ink4);font-weight:500;margin:18px 0 8px}

.tile{border:1px solid var(--hair);border-radius:12px;padding:12px 10px;text-align:center;font-size:12px;color:var(--ink2);cursor:pointer;background:var(--sf);display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.25;position:relative}
.tile:hover{background:var(--hover);color:var(--ink)}.tile .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}.tile .ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile.g .ic{background:var(--green-soft);color:var(--green)}.tile.b .ic{background:var(--blue-soft);color:var(--blue)}.tile.a .ic{background:var(--amber-soft);color:var(--amber)}.tile.n .ic{background:var(--hover);color:var(--ink2)}
.tile .nb{position:absolute;top:6px;right:6px;font-size:10.5px;color:var(--red);font-weight:600}
.tile .new{position:absolute;bottom:6px;right:8px;font-size:11px;color:var(--blue);display:none}.tile:hover .new{display:block}
.subtabs{display:flex;align-items:center;gap:2px;margin:-10px 0 18px;border-bottom:1px solid var(--hair)}
.subtabs .st2{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;color:var(--ink3);cursor:pointer;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-1px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.subtabs .st2:hover{color:var(--ink);background:var(--hover)}.subtabs .st2.on{background:var(--sf);color:var(--ink);border-color:var(--hair);font-weight:500;box-shadow:var(--sh)}
.subtabs .st2 i{font-style:normal;color:var(--ink4);padding:0 2px;border-radius:4px}.subtabs .st2 i:hover{background:var(--hover);color:var(--ink)}
.subtabs .st2 svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filterbar select,.filterbar input{width:auto;padding:6px 9px;font-size:12.5px;border-radius:7px}
.filterbar .sp{flex:1}.filterbar .cnt{font-size:12.5px;color:var(--ink3)}
.vtool{position:fixed;right:18px;top:110px;display:flex;flex-direction:column;gap:6px;z-index:20;width:150px}
.vtool .btn{justify-content:flex-start;width:100%}
.vtool .l{font-size:11.5px;color:var(--ink3);padding:6px 2px;line-height:1.35}
.totbar{position:sticky;bottom:0;background:var(--sf);border-top:1px solid var(--hair);margin:16px -24px -22px;padding:12px 24px;display:flex;gap:28px;justify-content:flex-end;font-size:13px;border-radius:0 0 14px 14px}
.totbar div{text-align:right}.totbar .k{font-size:11.5px;color:var(--ink3)}.totbar .v{font-weight:500;font-variant-numeric:tabular-nums}.totbar .v.big{font-size:17px}
body.hasvtool main{padding-right:200px}
aside{display:none}
.brand{padding:4px 12px 22px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--ink);display:inline-block;position:relative}.brand i::after{content:"";position:absolute;inset:8px;border-radius:3px;background:var(--bg)}

aside .flyh{font-size:11px;color:var(--ink4);padding:4px 10px 8px;font-weight:500}aside .fi{display:flex;align-items:center;gap:6px}aside .fi>a{flex:1}aside .fi .new{flex:none;color:var(--blue);font-size:12.5px;padding:6px 10px}
.tabbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px 9px 0 0;font-size:12.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;border:1px solid transparent;border-bottom:0;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--ink);background:var(--hover)}.tab.on{background:var(--sf);color:var(--ink);border-color:var(--hair);font-weight:500;margin-bottom:-1px;box-shadow:var(--sh)}
.tab i{font-style:normal;color:var(--ink4);padding:0 2px;border-radius:4px}.tab i:hover{background:var(--hover);color:var(--ink)}
@media(max-width:880px){.tabbar{padding:8px 18px 0}aside .fly{position:static;display:block;box-shadow:none;border:0;padding:0 0 0 12px}}

main{padding:26px 36px 80px;min-width:0;max-width:1320px;grid-column:2}

.card{background:var(--sf);border:1px solid var(--hair);border-radius:14px;padding:22px 24px;box-shadow:var(--sh)}
.card.flush{padding:0;overflow:hidden}.card.flush h2{padding:20px 24px 0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g21{grid-template-columns:2fr 1fr}.g31{grid-template-columns:3fr 2fr}

 const items=[];S.invoices.filter(v=>v.status==='draft'&&D(v.date)<=TODAY).forEach(v=>items.push(['var(--amber)','Proyeksi belum diterbitkan',`${cu(v.cust).name} · ${dstr(v.date)} · ${fmt(calc(v).total)}`,'invoice/'+v.id,'Buka']));od.forEach(v=>{const f=(v.followups||[]).slice(-1)[0];items.push(['var(--red)',`${v.no} jatuh tempo`,`${cu(v.cust).name} · sejak ${dstr(v.due)} · sisa ${fmt(calc(v).rem)} · ${COLL_ST[v.collStatus||'none'][1]}${v.collNote?' · '+v.collNote.slice(0,60):''}`,'collections','Tagih'])});S.invoices.filter(v=>v.status==='issued'&&v.collStatus==='promise'&&v.promise&&v.promise<iso(TODAY)&&calc(v).rem>0).forEach(v=>items.push(['var(--amber)','Janji bayar lewat',`${v.no} · ${cu(v.cust).name}`,'collections','Tindak lanjut']));S.receipts.filter(r=>r.status!=='void').forEach(r=>r.lines.forEach(l=>{if((+l.pph||0)>0&&!(l.bukti||'').trim())items.push([bupotDeadline(r.date)<iso(TODAY)?'var(--red)':'var(--amber)','Bukti potong PPh belum diterima'+(bupotDeadline(r.date)<iso(TODAY)?' · LEWAT TENGGAT':''),`${r.no} · ${cu(r.cust).name} · PPh ${fmt(l.pph)} · tenggat ${dstr(bupotDeadline(r.date))}`,'report/pph','Tagih bukti'])}));iss.filter(v=>v.comm.on&&!v.comm.approved).forEach(v=>items.push(['var(--blue)','Komisi menunggu persetujuan',`${v.no} · ${se(v.seller).name} · ${fmt(calc(v).comm.amount)}`,'invoice/'+v.id,'Tinjau']));S.quotes.filter(q=>q.status==='accepted').forEach(q=>items.push(['var(--blue)','Penawaran diterima, belum jadi faktur',`${q.no} · ${q.cust?cu(q.cust).name:q.custName}`,'quote/'+q.id,'Ambil']));
 return`<div class="top"><div><h1>Dashboard</h1><p>${TODAY.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div><div class="flex"><a class="btn" href="#quote/new">Penawaran baru</a><a class="btn" href="#receipt/new">Penerimaan baru</a><a class="btn p" href="#invoice/new">Faktur baru</a></div></div>
 <div class="grid g4 mb"><div class="card kpi"><p class="lbl">Penjualan ${mlong(m)}</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('Faktur ${mlong(m)}',S.invoices.filter(v=>v.status==='issued'&&ym(v.date)==='${m}').map(invRow))">${fmtS(salesT)}</a></div><div class="d">${sales.length} faktur</div></div><div class="card kpi"><p class="lbl">Piutang</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('Faktur belum lunas',S.invoices.filter(v=>v.status==='issued'&&calc(v).rem>0).map(v=>({...invRow(v),amt:calc(v).rem})),'Sisa')">${fmtS(ar)}</a></div><div class="d neg">${od.length} jatuh tempo · ${fmtS(od.reduce((s,v)=>s+calc(v).rem,0))}</div></div><div class="card kpi"><p class="lbl">Kas diterima ${mlabel(m)}</p><div class="v"><a href="#receipts" style="color:inherit">${fmtS(rec)}</a></div><div class="d">${S.receipts.filter(r=>ym(r.date)===m).length} penerimaan</div></div><div class="card kpi"><p class="lbl">Proyeksi cash in ${mlabel(m)}</p><div class="v"><a href="#cashin/all" style="color:inherit">${fmtS((()=>{const e=iso(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0));return cashProj(m+'-01',e).reduce((s,p)=>s+p.amount,0)})())}</a></div><div class="d">sudah masuk ${fmtS(cashProj(m+'-01',iso(TODAY)).filter(p=>p.tier==='received').reduce((s,p)=>s+p.amount,0))} · sisa bulan ini <a href="#cashin/issued">A/R</a> + <a href="#cashin/draft">belum terbit</a></div></div></div>

 ${vtool([`<button class="btn p" onclick="saveCustomer()">Simpan</button>`,`<a class="btn" href="#customers">Tutup</a>`,!isNew?`<a class="btn" href="#invoice/new?cust=${c.id}">Faktur baru</a>`:''])}`};

routes.items=function(){return`<div class="top"><div><h1>Barang & Jasa</h1><p>Katalog paket. Saat dipakai di faktur, nama, deskripsi, dan harga tetap bisa disesuaikan.</p></div><a class="btn p" href="#item/new">Item baru</a></div><div class="card flush"><div class="tw"><table><thead><tr><th>Kode</th><th>Nama</th><th>Deskripsi standar</th><th class="num">Harga jual</th><th class="num">HPP</th><th class="num">Dipakai</th></tr></thead><tbody>${S.items.map(x=>{const used=S.invoices.filter(v=>v.status==='issued').reduce((n,v)=>n+v.lines.filter(l=>l.item===x.id).length,0);return`<tr class="row" onclick="go('item/${x.id}')"><td class="mono">${esc(x.code)}</td><td>${esc(x.name)}</td><td class="muted" style="white-space:normal;max-width:360px">${esc(x.desc).slice(0,80)}${x.desc.length>80?'…':''}</td><td class="num">${fmt(x.price)}</td><td class="num">${fmt(x.cost)}</td>${dcell(used,`drill('Faktur dengan ${esc(x.name)}',S.invoices.filter(v=>v.status==='issued'&&v.lines.some(l=>l.item==='${x.id}')).map(invRow))`)}</tr>`}).join('')}</tbody></table></div></div>`};

/* ---------- grid item (dipakai penawaran & faktur) — gaya Accurate ---------- */
function itemsGrid(lines,ro,withDefer){return`<div class="tw"><table class="grid-items"><thead><tr><th style="width:26px">#</th><th style="width:38%">Nama barang & jasa</th><th class="num" style="width:70px">Kuantitas</th><th class="num" style="width:150px">Harga satuan</th><th class="num" style="width:150px">Total harga</th><th class="num" style="width:130px;color:var(--amber)">HPP · internal</th>${withDefer?'<th style="width:170px">Pengakuan pendapatan</th>':''}<th style="width:50px"></th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td class="muted" style="padding-top:12px">${i+1}</td><td>${ro?'':`<select onchange="pickItem(${i},this.value)"><option value="">Cari / pilih barang & jasa…</option>${S.items.map(x=>`<option value="${x.id}">${esc(x.code)} · ${esc(x.name)} · ${fmtS(x.price)}</option>`).join('')}</select>`}<input class="nm" value="${esc(l.name)}" placeholder="Nama jasa" ${ro?'disabled':''} oninput="dD.lines[${i}].name=this.value"><textarea rows="2" placeholder="Catatan baris (tampil di dokumen, boleh beberapa baris)" ${ro?'disabled':''} oninput="dD.lines[${i}].desc=this.value;this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(l.desc)}</textarea></td><td><input type="number" value="${l.qty}" ${ro?'disabled':''} onchange="dD.lines[${i}].qty=+this.value;nav()"></td><td><input type="number" value="${l.price}" ${ro?'disabled':''} onchange="dD.lines[${i}].price=+this.value;nav()"></td><td class="num" style="padding-top:12px">${fmt(lineAmt(l))}</td><td><input type="number" value="${l.cost||''}" placeholder="0" ${ro?'disabled':''} onchange="dD.lines[${i}].cost=+this.value;nav()"></td>${withDefer?`<td style="padding-top:11px">${l.defer&&l.defer.m?`<span class="defer" onclick="openDefer(${i})">${l.defer.m} bln · mulai ${mlong(dmonth(l,dD))}</span>`:`<span class="defer off" onclick="openDefer(${i})">Diakui langsung · ${mlong(ym(dD.date))}</span>`}</td>`:''}<td style="padding-top:8px">${ro?'':`<button class="btn q s" onclick="dD.lines.splice(${i},1);nav()">×</button>`}</td></tr>`).join('')}</tbody></table></div>${ro?'':`<button class="btn q s mt8" onclick="dD.lines.push({item:'',name:'',desc:'',qty:1,price:0,cost:0,defer:null});nav()">+ Tambah baris</button>`}`}

// Penangguhan: bulanan saja (N bulan, mulai bulan tertentu, sama rata) — seperti Accurate
function openDefer(i){const l=dD.lines[i];const on=!!(l.defer&&l.defer.m);const cur=on?dmonth(l,dD):ym(dD.date);const base=D(ym(dD.date)+'-01');const opts=[];for(let k=-3;k<=12;k++)opts.push(ym(iso(addMonths(base,k))));if(!opts.includes(cur))opts.unshift(cur);const m0=on?l.defer.m:1;
 modal(`<h2>Pengakuan pendapatan</h2><p class="small muted" style="margin:0 0 14px">${esc(l.name)||'Baris '+(i+1)} · ${fmt(lineAmt(l))}</p><label class="flex" style="gap:10px;cursor:pointer;margin-bottom:12px"><input type="checkbox" id="dfOn" ${on?'checked':''} onchange="document.getElementById('dfBox').style.opacity=this.checked?1:.4"><span>Ditangguhkan — diakui <b>per bulan, sama rata</b></span></label><div id="dfBox" style="opacity:${on?1:.4}"><div class="grid g2"><div class="field"><label class="f">Selama</label><div class="flex" style="flex-wrap:nowrap"><input type="number" id="dfM" min="1" max="36" value="${m0}"><span class="small muted">bulan</span></div></div><div class="field"><label class="f">Mulai bulan</label><select id="dfS">${opts.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${mlong(m)}</option>`).join('')}</select></div></div><p class="small muted">Tidak ditangguhkan = seluruh nilai diakui di bulan faktur (${mlong(ym(dD.date))}). Contoh: 3 bulan mulai ${mlong(ym(dD.date))} → 1/3 tiap bulan.</p></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="dD.lines[${i}].defer=document.getElementById('dfOn').checked?{m:Math.min(36,Math.max(1,+document.getElementById('dfM').value)),s:document.getElementById('dfS').value}:null;closeModal();nav()">Terapkan</button></div>`)}

/* ---------- PENAWARAN ---------- */
routes.quotes=function(){return`<div class="top"><div><h1>Penawaran Penjualan</h1><p>${S.quotes.filter(q=>q.status==='sent').length} menunggu jawaban</p></div><a class="btn p" href="#quote/new">Penawaran baru</a></div><div class="card flush"><div class="tw"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Pelanggan</th><th>Penjual</th><th>Berlaku s/d</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>${S.quotes.map(q=>`<tr class="row" onclick="go('quote/${q.id}')"><td class="mono">${q.no}</td><td>${dstr(q.date)}</td><td>${q.cust?cu(q.cust).name:esc(q.custName)+' <span class="tag">baru</span>'}</td><td>${se(q.seller).name}</td><td>${dstr(q.valid)}</td><td class="num">${fmt(q.lines.reduce((s,l)=>s+lineAmt(l),0))}</td><td>${st(q.status)}</td></tr>`).join('')}</tbody></table></div></div>`};
routes.quote=function(id){const isNew=id==='new';if(!dD||dD.id!==id)dD=isNew?{id:'new',no:'SQ.'+TODAY.getFullYear()+'.'+pad(TODAY.getMonth()+1)+'.'+String(S.seq.quote).padStart(4,'0'),cust:S.customers[0].id,date:iso(TODAY),valid:iso(addDays(TODAY,30)),seller:S.customers[0].bd,status:'draft',notes:'',lines:[{item:'',name:'',desc:'',qty:1,price:0,cost:0}]}:JSON.parse(JSON.stringify(S.quotes.find(q=>q.id===id)));const q=dD,ro=q.status==='converted',tot=q.lines.reduce((s,l)=>s+lineAmt(l),0),cost=q.lines.reduce((s,l)=>s+(+l.qty||0)*(+l.cost||0),0);
 return`<div class="top"><div><h1>${isNew?'Penawaran baru':q.no} ${stamp(q.status)}</h1><p>Penawaran Penjualan</p></div></div><div class="card"><div class="doc-head"><div><div class="row"><label>Pelanggan <b>*</b></label><select ${ro?'disabled':''} onchange="dD.cust=this.value;dD.seller=cu(this.value).bd;nav()">${S.customers.map(c=>`<option value="${c.id}" ${c.id===q.cust?'selected':''}>${c.code} · ${esc(c.name)}</option>`).join('')}${q.custName?`<option selected>${esc(q.custName)} (baru)</option>`:''}</select></div><div class="row"><label>Penjual</label><select ${ro?'disabled':''} onchange="dD.seller=this.value">${S.sellers.map(s=>`<option value="${s.id}" ${s.id===q.seller?'selected':''}>${s.name} · ${s.type}</option>`).join('')}</select></div></div><div><div class="row"><label>Penawaran #</label><input value="${q.no}" disabled></div><div class="row"><label>Tanggal</label><input type="date" value="${q.date}" ${ro?'disabled':''} onchange="dD.date=this.value"></div><div class="row"><label>Berlaku s/d</label><input type="date" value="${q.valid}" ${ro?'disabled':''} onchange="dD.valid=this.value"></div></div></div>${itemsGrid(q.lines,ro,false)}<div class="grid g2 mt"><div><label class="f">Catatan</label><textarea rows="3" ${ro?'disabled':''} oninput="dD.notes=this.value">${esc(q.notes)}</textarea></div></div><div class="totbar"><div><div class="k">HPP · internal</div><div class="v">${fmt(cost)}</div></div><div><div class="k">Laba kotor · internal</div><div class="v">${fmt(tot-cost)} · ${tot?pct((tot-cost)/tot):'—'}</div></div><div><div class="k">Total</div><div class="v big">${fmt(tot)}</div></div></div></div>
 ${vtool([!ro?`<button class="btn p" onclick="saveQuote()">Simpan</button>`:'',q.status==='accepted'?`<button class="btn" onclick="convertQuote('${q.id}')">Proses → Faktur</button>`:'',q.status==='sent'?`<button class="btn" onclick="setQuote('${q.id}','accepted')">Diterima</button><button class="btn" onclick="setQuote('${q.id}','rejected')">Ditolak</button>`:'',q.status==='draft'?`<button class="btn" onclick="setQuote('${q.id}','sent')">Tandai terkirim</button>`:'',`<button class="btn" onclick="showPdf('Penawaran',dD)">Cetak / PDF</button>`,`<a class="btn" href="#quotes">Tutup</a>`])}`};
function saveQuote(){if(dD.id==='new'){dD.id='q'+Date.now();dD.no=nextNo('quote');S.quotes.push(dD)}else Object.assign(S.quotes.find(q=>q.id===dD.id),dD);save();toast('Penawaran disimpan');finishDoc(location.hash.replace('#',''),'quotes')}
function setQuote(id,s){if(id==='new'){saveQuote();id=location.hash.split('/')[1]}else Object.assign(S.quotes.find(q=>q.id===id),dD);S.quotes.find(q=>q.id===id).status=s;save();dD=null;toast('Status: '+STL[s][1]);nav()}
function convertQuote(id){const q=S.quotes.find(x=>x.id===id);const c=cu(q.cust);const seq=custSeq(q.cust);const v=inv('v'+Date.now(),'',q.cust,iso(TODAY),iso(addDays(TODAY,tm(c.term).days)),seq===1?c.bd:c.am,c.pph,c.via,q.lines.map(l=>({...l,defer:null})),{seq,quote:q.no});S.invoices.push(v);q.status='converted';save();dD=null;toast('Faktur dibuat dari '+q.no);go('invoice/'+v.id)}

/* ---------- FAKTUR PENJUALAN ---------- */
function nextProj(v){const m=ym(iso(addMonths(D(v.date),1)));return{m,ex:S.invoices.find(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===m&&alive(x))}}
function throwNext(id){const v=S.invoices.find(x=>x.id===id);const{m,ex}=nextProj(v);if(ex){toast(mlong(m)+' sudah ada: '+(ex.no||'proyeksi'));return}throwInvoice(v,[1]);logIt('invoice',id,'Dilempar ke proyeksi '+mlong(m));save();toast((v.no||'Proyeksi '+mlong(ym(v.date)))+' → dilempar ke '+mlong(m));nav()}
routes.invoices=function(){const f=listFilter;const all=S.invoices.filter(v=>v.status!=='draft'&&v.status!=='pcancel');const rows=all.map(v=>({v,c:calc(v)})).filter(({v,c})=>(!f.m||ym(v.date)===f.m)&&(!f.c||v.cust===f.c)&&(!f.s||c.st===f.s)&&(!f.q||(v.no||'').toLowerCase().includes(f.q)||cu(v.cust).name.toLowerCase().includes(f.q))).sort((a,b)=>b.v.date.localeCompare(a.v.date));const months=[...new Set(all.map(v=>ym(v.date)))].sort().reverse();
 return`<div class="top"><div><h1>Faktur Penjualan</h1><p>${all.filter(v=>v.status==='issued').length} faktur · ${all.filter(v=>calc(v).st==='overdue').length} jatuh tempo · <a href="#projection">${S.invoices.filter(v=>v.status==='draft').length} proyeksi belum diterbitkan</a></p></div><div class="flex"><a class="btn" href="#quotes">Ambil dari penawaran</a><a class="btn g" href="#invoice/new">+ Faktur baru</a></div></div>
 ${filterBar([`<select onchange="listFilter.m=this.value;nav()"><option value="">Tanggal: semua</option>${months.map(m=>`<option value="${m}" ${f.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,`<select onchange="listFilter.c=this.value;nav()"><option value="">Pelanggan: semua</option>${S.customers.map(c=>`<option value="${c.id}" ${f.c===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`,`<select onchange="listFilter.s=this.value;nav()"><option value="">Status: semua</option>${[['unpaid','Belum lunas'],['partial','Sebagian'],['overdue','Jatuh tempo'],['paid','Lunas'],['hold','Hold'],['cancelled','Dibatalkan']].map(o=>`<option value="${o[0]}" ${f.s===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`,`<input placeholder="Cari nomor / pelanggan" value="${esc(f.q||'')}" oninput="listFilter.q=this.value.toLowerCase();nav()">`,`<span class="sp"></span><span class="cnt">${rows.length} dari ${all.length}</span>`,(f.m||f.c||f.s||f.q)?`<button class="btn q s" onclick="listFilter={};nav()">Hapus filter</button>`:''])}
 <div class="card flush"><div class="tw"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Pelanggan</th><th>Penjual</th><th>Jatuh tempo</th><th class="num">Umur (hr)</th><th class="num">Total</th><th class="num">Sisa</th><th>Status</th><th>Proyeksi bulan depan</th></tr></thead><tbody>${rows.map(({v,c})=>{const np=nextProj(v);return`<tr class="row" onclick="go('invoice/${v.id}')"><td class="mono">${v.no}${v.custType==='baru'?' <span class="tag">baru</span>':''}</td><td>${dstr(v.date)}</td><td>${cu(v.cust).name}<span class="sub">${esc(cu(v.cust).legal||'')}</span></td><td>${se(v.seller).name}</td><td>${dstr(v.due)}</td><td class="num">${c.rem>0&&c.st!=='hold'?Math.max(0,Math.round((TODAY-D(v.due))/864e5))||'—':'—'}</td><td class="num">${fmt(c.total)}</td><td class="num">${c.rem>0?fmt(c.rem):'—'}</td><td>${st(c.st)}</td><td onclick="event.stopPropagation()">${v.status!=='issued'?'—':np.ex?`<a class="chip g" href="#invoice/${np.ex.id}" title="Buka">✓ ${np.ex.no||'Proyeksi'} · ${mlong(np.m)}</a>`:`<button class="btn s" onclick="throwNext('${v.id}')">Lempar → ${mlong(np.m)}</button>`}</td></tr>`}).join('')}</tbody></table></div></div><p class="small muted mt8">Proyeksi dibuat <b>satu bulan sekali</b>: lempar faktur bulan ini ke bulan depan; dari proyeksi bulan depan lempar lagi ke bulan berikutnya (lihat <a href="#projection">Proyeksi Faktur</a>).</p>`};
let iTab='rincian';
routes.invoice=function(arg){const[id,qs]=arg.split('?');const isNew=id==='new';if(!dD||dD.id!==id){if(isNew){const pre=new URLSearchParams(qs||'');const c=cu(pre.get('cust')||S.customers[0].id);const seq=custSeq(c.id);dD=inv('new','',c.id,iso(TODAY),iso(addDays(TODAY,tm(c.term).days)),seq===1?c.bd:c.am,c.pph,c.via,[{item:'',name:'',desc:'',qty:1,price:0,cost:0,defer:null}],{seq})}else{const src=S.invoices.find(v=>v.id===id);if(!src)return'<div class="empty">Faktur tidak ditemukan (mungkin sudah dihapus).</div>';dD=JSON.parse(JSON.stringify(src))}}
 const v=dD,c=calc(v),cst=cu(v.cust),isIssued=v.status==='issued',np=nextProj(v),nRc=c.rc.length+S.creditNotes.filter(n=>n.inv===v.id).length,nFu=(v.followups||[]).length;
 return`<div class="docbar"><div><h1>${isNew?'Faktur Penjualan baru':v.no||'Proyeksi · '+mlong(ym(v.date))} ${stamp(c.st)}</h1><div class="sub">${esc(cst.name)}${cst.legal?' · '+esc(cst.legal):''} · faktur ke-${v.seq}${v.parent?' · lemparan dari '+((S.invoices.find(x=>x.id===v.parent)||{}).no||'proyeksi'):''}${v.quote?' · dari '+v.quote:''}${v.hold?` · <span style="color:var(--amber)">${esc(v.hold)}</span>`:''}</div></div><div class="acts"><button class="btn" onclick="showPdf('Invoice',dD)">Cetak / PDF</button>${!isNew?`<details class="dd"><summary class="btn">Proses ▾</summary><div class="menu">${isIssued&&c.rem>0&&!v.hold?`<a href="#receipt/new?inv=${v.id}">Penerimaan Penjualan (bayar)</a>`:''}<button onclick="throwNext('${v.id}')" ${np.ex?'disabled':''}>Lempar ke proyeksi ${mlong(np.m)}${np.ex?' · sudah ada':''}</button>${isIssued?`<a href="#creditnote/new?inv=${v.id}">Nota Kredit (kurangi nilai)</a>`:''}<div class="sep"></div>${isIssued?(v.hold?`<button onclick="setHold('${v.id}',false)">Lanjutkan (lepas hold)</button>`:`<button onclick="setHold('${v.id}',true)">Tahan (hold)</button>`):''}${isIssued?`<button class="d" onclick="cancelInvoice('${v.id}')">Batalkan faktur${deps(v.id).n?' · ada '+deps(v.id).n+' dokumen turunan':''}</button>`:v.status==='cancelled'?`<button onclick="uncancelInvoice('${v.id}')">Aktifkan kembali faktur</button>`:`<button class="d" onclick="delDraft('${v.id}')">Batalkan proyeksi</button>`}</div></details>`:''}</div></div>
 ${v.status==='pcancel'?`<div class="note r mb">Proyeksi ini <b>dibatalkan</b> ${dstr(v.cancelAt)} oleh ${esc(v.cancelBy||'')} · ${esc(v.cancelReason||'')}. <button class="btn s" onclick="restoreDraft('${v.id}')">Pulihkan</button></div>`:''}${v.status==='cancelled'?`<div class="note r mb">Faktur ini <b>dibatalkan</b> · ${esc(v.cancelReason||'')}. Nomor tetap terpakai. Bisa diaktifkan kembali lewat Proses ▾.</div>`:''}${isIssued&&c.paid>0?`<div class="note a mb">Faktur ini sudah menerima pembayaran ${fmt(c.paid)}. Kalau total diubah menjadi lebih kecil dari yang dibayar, selisihnya otomatis menjadi <b>Lebih Bayar</b> pelanggan (uang muka). Untuk pengurangan resmi, gunakan <a href="#creditnote/new?inv=${v.id}">Nota Kredit</a>.</div>`:''}
 <div class="card"><div class="hdr"><div class="fld"><label class="f">Pelanggan <b>*</b></label><select onchange="pickCust(this.value)">${S.customers.map(x=>`<option value="${x.id}" ${x.id===v.cust?'selected':''}>${x.code} · ${esc(x.name)}${x.legal?' — '+esc(x.legal):''}</option>`).join('')}</select></div><div class="fld"><label class="f">Tgl. transaksi <b>*</b></label><input type="date" value="${v.date}" onchange="const d=Math.round((D(dD.due)-D(dD.date))/864e5);dD.date=this.value;dD.due=iso(addDays(D(this.value),d));nav()"></div><div class="fld"><label class="f">No. faktur</label><input value="${v.no||'Otomatis saat terbit'}" disabled></div>
 <div class="fld"><label class="f">Jenis pelanggan <b>*</b></label><select onchange="dD.custType=this.value;nav()"><option value="existing" ${v.custType!=='baru'?'selected':''}>Pelanggan existing</option><option value="baru" ${v.custType==='baru'?'selected':''}>Pelanggan baru</option></select><span class="small muted">Saran sistem: ${custSeq(v.cust)===1||v.seq===1?'baru (belum pernah difakturkan)':'existing (faktur ke-'+v.seq+')'} · masuk laporan Pelanggan Baru vs Existing</span></div><div class="fld"><label class="f">Syarat bayar</label><select onchange="dD.due=iso(addDays(D(dD.date),+this.value));nav()">${S.terms.map(t=>`<option value="${t.days}" ${t.days===Math.round((D(v.due)-D(v.date))/864e5)?'selected':''}>${t.name}</option>`).join('')}<option value="${Math.round((D(v.due)-D(v.date))/864e5)}" ${S.terms.some(t=>t.days===Math.round((D(v.due)-D(v.date))/864e5))?'':'selected'}>Lainnya</option></select></div><div class="fld"><label class="f">Jatuh tempo</label><input type="date" value="${v.due}" onchange="dD.due=this.value;nav()"></div></div>
 <div class="ftabs">${[['rincian','Rincian Faktur'],['info','Info Lainnya'],['tangguh','Pengakuan Pendapatan'],['komisi','Komisi'],['bayar','Pembayaran',nRc,nRc+' '+t('penerimaan tercatat')],['tagih','Penagihan',nFu,nFu+' '+t('tindak lanjut tercatat')],['riwayat','Riwayat']].map(x=>`<button class="${iTab===x[0]?'on':''}" onclick="iTab='${x[0]}';nav()">${x[1]}${x[2]?`<i title="${x[3]}">${x[2]} ${x[0]==='bayar'?t('penerimaan'):t('tindak lanjut')}</i>`:''}</button>`).join('')}</div>
 ${iTab==='rincian'?`${itemsGrid(v.lines,false,true)}<div class="foot2"><div><label class="f">Catatan / Notes & Terms (dari template, bisa diubah per faktur)</label><textarea rows="7" oninput="dD.notes=this.value">${esc(v.notes??S.company.notes)}</textarea><button class="btn q s" onclick="dD.notes=null;nav()">Kembalikan ke template</button></div><div class="tots"><div class="r"><span class="k">Sub total</span><span>${fmt(c.sub)}</span></div><div class="r"><span class="k">Add on</span><input type="number" value="${v.addon||''}" placeholder="0" onchange="dD.addon=+this.value;nav()"></div><div class="r"><span class="k">Diskon</span><input type="number" value="${v.disc||''}" placeholder="0" onchange="dD.disc=+this.value;nav()"></div><div class="r t"><span>Total</span><span>${fmt(c.total)}</span></div><div class="r"><span class="k" style="color:var(--amber)">HPP · internal</span><span>${fmt(c.cost)}</span></div><div class="r"><span class="k" style="color:var(--amber)">Laba kotor · internal</span><span>${fmt(c.gp)} · ${c.total?pct(c.margin):'—'}</span></div></div></div>`:''}

>Setujui komisi</button>`:''} <a class="btn s" href="#commissions">Buka Monitoring Komisi</a><p class="small muted mt8">Aturan: ${S.commRules.map(r=>`${r.seller} faktur ke-${r.seq} ${r.mode==='pct'?r.value+'%':fmt(r.value)}`).join(' · ')}. Diatur di Pengaturan.</p></div></div>`:''}

const COLL_ST={none:['n','Belum ditagih'],reminded:['a','Sudah diingatkan'],promise:['b','Janji bayar'],approval:['a','Menunggu approval klien'],process:['g','Dalam proses pembayaran'],dispute:['r','Sengketa / komplain'],hold:['a','Hold']};
function collStatusSel(v){const k=v.collStatus||'none';return`<div class="flex" style="gap:6px;flex-wrap:nowrap"><select style="width:auto;padding:5px 8px;font-size:12.5px" onchange="setCollStatus('${v.id}',this.value)">${Object.keys(COLL_ST).map(x=>`<option value="${x}" ${x===k?'selected':''}>${COLL_ST[x][1]}</option>`).join('')}</select>${k==='promise'?`<input type="date" value="${v.promise||''}" style="width:140px;padding:5px 8px;font-size:12.5px" onchange="setCollStatus('${v.id}','promise',this.value)">`:''}</div>`}
function setCollStatus(id,st,date){const v=S.invoices.find(x=>x.id===id);v.collStatus=st;if(date!==undefined)v.promise=date;if(st==='promise'&&!v.promise)v.promise=iso(addDays(TODAY,7));if(st!=='promise')v.promise='';v.collStatusAt=iso(TODAY);v.collStatusBy=me.name;logIt('invoice',id,'Status penagihan: '+COLL_ST[st][1]+(v.promise?' '+dstr(v.promise):''));save();if(dD&&dD.id===id){dD.collStatus=st;dD.promise=v.promise}nav()}
function collStatusTag(v){const k=v.hold?'hold':(v.collStatus||'none');const[c,t]=COLL_ST[k]||COLL_ST.none;const late=k==='promise'&&v.promise&&v.promise<iso(TODAY);return`<span class="st ${late?'r':c}">${t}${k==='promise'&&v.promise?' '+dstr(v.promise)+(late?' · lewat':''):''}</span>`}
function collNoteBox(v){return`<textarea class="cnote" rows="2" placeholder="mis. Sudah WA ke Bu Sinta, bilang menunggu approval direktur, cek lagi Kamis" onblur="setCollNote('${v.id}',this.value)">${esc(v.collNote||'')}</textarea><span class="small muted">${v.collNoteAt?'diperbarui '+dstr(v.collNoteAt)+' · '+esc(v.collNoteBy||''):'belum ada keterangan'}</span>`}
function setCollNote(id,val){const v=S.invoices.find(x=>x.id===id);if((v.collNote||'')===val)return;v.collNote=val;v.collNoteAt=iso(TODAY);v.collNoteBy=me.name;logIt('invoice',id,'Keterangan penagihan: '+val.slice(0,80));save();if(dD&&dD.id===id){dD.collNote=val;dD.collNoteAt=v.collNoteAt;dD.collNoteBy=v.collNoteBy}nav()}
function followupBox(v){const fs=(v.followups||[]).slice().reverse();return`<div class="grid g2"><div class="field"><label class="f">Status penagihan (diisi Finance)</label>${collStatusSel(v)}<span class="small muted">${v.collStatusAt?'diperbarui '+dstr(v.collStatusAt)+' · '+esc(v.collStatusBy||''):'belum diisi'}</span></div><div class="field"><label class="f">Keterangan status komunikasi (untuk reminder harian)</label>${collNoteBox(v)}</div></div><div class="grid g2"><div><h3>Catat tindak lanjut</h3><div class="grid g2"><div class="field"><label class="f">Tanggal</label><input type="date" id="fuD" value="${iso(TODAY)}"></div><div class="field"><label class="f">Lewat</label><select id="fuV"><option>WhatsApp</option><option>Email</option><option>Telepon</option><option>Meeting</option></select></div></div><div class="field"><label class="f">Hasil</label><select id="fuK" onchange="document.getElementById('fuPw').style.display=this.value==='promise'?'block':'none'"><option value="reminder">Sudah diingatkan</option><option value="promise">Klien janji bayar</option><option value="dispute">Sengketa / komplain</option><option value="sent">Faktur dikirim ulang</option></select></div><div class="field" id="fuPw" style="display:none"><label class="f">Tanggal janji bayar</label><input type="date" id="fuP"></div><div class="field"><label class="f">Catatan</label><input id="fuN" placeholder="mis. Finance klien minta bukti potong dulu"></div><button class="btn p s" onclick="addFollow('${v.id}')">Simpan tindak lanjut</button></div><div><h3>Riwayat penagihan</h3>${fs.length?fs.map(f=>`<div class="fu"><span>${dstr(f.date)}</span><span class="muted">${f.via}</span><span>${{reminder:'Diingatkan',promise:'Janji bayar',dispute:'Sengketa',sent:'Dikirim ulang'}[f.kind]||f.kind}${f.note?' · '+esc(f.note):''}</span><span class="right">${f.kind==='promise'?dstr(f.promise):''}<span class="muted small"> · ${esc(f.by)}</span></span></div>`).join(''):'<div class="empty">Belum ada tindak lanjut</div>'}</div></div>`}
function addFollow(id){const v=S.invoices.find(x=>x.id===id);(v.followups=v.followups||[]).push({date:document.getElementById('fuD').value,via:document.getElementById('fuV').value,kind:document.getElementById('fuK').value,promise:document.getElementById('fuP').value,note:document.getElementById('fuN').value,by:me.name});logIt('invoice',id,'Tindak lanjut penagihan');save();if(dD&&dD.id===id)dD.followups=v.followups;toast('Tindak lanjut dicatat');nav()}
function restoreRev(id,k){const v=S.invoices.find(x=>x.id===id);const r=v.revisions[k];if(!confirm('Pulihkan faktur ke versi '+dstr(r.t)+'? Versi sekarang ikut disimpan sebagai riwayat.'))return;const snap=JSON.parse(JSON.stringify(v));delete snap.revisions;v.revisions.push({t:iso(TODAY),who:me.name,snap});['lines','disc','addon','notes','date','due','pph','via','seller','custType','po','comm'].forEach(k2=>v[k2]=JSON.parse(JSON.stringify(r.snap[k2])));logIt('invoice',id,'Dipulihkan ke versi '+dstr(r.t)+' · total '+fmt(calc(v).total));save();dD=null;toast('Versi dipulihkan');nav()}
function pickCust(id){const c=cu(id);dD.cust=id;dD.seq=custSeq(id);dD.custType=dD.seq===1?'baru':'existing';dD.seller=dD.seq===1?c.bd:c.am;dD.pph=c.pph;dD.via=c.via;dD.due=iso(addDays(D(dD.date),tm(c.term).days));nav()}
function saveInvoice(){const isNew=dD.id==='new';if(isNew){dD.id='v'+Date.now();S.invoices.push(dD)}else{const old=S.invoices.find(v=>v.id===dD.id);const before=calc(old).total;if(old.status==='issued'){const snap=JSON.parse(JSON.stringify(old));delete snap.revisions;(old.revisions=old.revisions||[]).push({t:iso(TODAY),who:me.name,snap})}Object.assign(old,dD);const c=calc(old);if(old.status==='issued'){if(before!==c.total)logIt('invoice',old.id,'Total diubah '+fmt(before)+' → '+fmt(c.total));if(c.rem<0){const over=-c.rem;cu(old.cust).credit=(cu(old.cust).credit||0)+over;logIt('invoice',old.id,'Lebih bayar '+fmt(over)+' → uang muka pelanggan');toast('Disimpan · lebih bayar '+fmt(over)+' jadi uang muka pelanggan')}else toast('Perubahan disimpan')}else toast('Proyeksi disimpan')}save();const id=dD.id;const wasNew=isNew;finishDoc(wasNew?'invoice/new':'invoice/'+id,S.invoices.find(v=>v.id===id).status==='issued'?'invoices':'projection')}
function issueInvoice(){if(dD.id==='new'){dD.id='v'+Date.now();S.invoices.push(dD)}else Object.assign(S.invoices.find(v=>v.id===dD.id),dD);const v=S.invoices.find(x=>x.id===dD.id);const c=calc(v);if(!c.total){toast('Faktur kosong');return}if(S.periods[ym(v.date)]==='locked'){toast('Periode '+mlong(ym(v.date))+' sudah dikunci');return}v.status='issued';v.no=nextNo('inv');v.seq=custSeq(v.cust);const cst=cu(v.cust);if(!cst.running||v.date<cst.running)cst.running=v.date;logIt('invoice',v.id,'Diterbitkan sebagai '+v.no+' · pelanggan '+(v.custType==='baru'?'baru':'existing'));save();toast('Terbit: '+v.no+' · faktur ditutup');finishDoc(location.hash.replace('#',''),'invoices')}
function throwInvoice(v,offsets){let made=0;const terms=Math.round((D(v.due)-D(v.date))/864e5);offsets.forEach(k=>{const date=iso(addMonths(D(v.date),k));if(S.invoices.some(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===ym(date)&&alive(x)))return;const n=inv('p'+Date.now()+k,'',v.cust,date,iso(addDays(D(date),terms)),cu(v.cust).am,v.pph,v.via,v.lines.map(l=>{const base=(l.defer&&l.defer.s&&l.defer.s.length===10)?l.defer.s:v.date;return{...l,desc:(l.desc||'').replace(/\(Periode (\d+)[^)]*\)/,(m,p)=>`(Periode ${+p+k} : ${dfull(iso(addMonths(D(base),k)))} - ${dfull(iso(addDays(addMonths(D(base),k+1),-1)))})`),defer:l.defer?{m:l.defer.m,s:ym(iso(addMonths(D(dmonth(l,v)+'-01'),k)))}:null}}),{seq:(v.seq||1)+k,disc:v.disc,addon:v.addon,notes:v.notes,parent:v.id,status:'draft',custType:'existing',recurring:v.recurring});S.invoices.push(n);made++});return made}
function setHold(id,on){const v=S.invoices.find(x=>x.id===id);if(on){const r=prompt('Alasan hold:','');if(r===null)return;v.hold=r||'Hold'}else v.hold='';logIt('invoice',id,on?'Hold: '+v.hold:'Dilanjutkan');save();dD=null;nav()}
function deps(id){const rc=S.receipts.filter(r=>r.status!=='void'&&r.lines.some(l=>l.inv===id));const cn=S.creditNotes.filter(n=>n.status!=='void'&&n.inv===id);const cp=S.commPayments.filter(p=>p.status!=='void'&&(p.alloc||[]).some(a=>a.inv===id));const ch=S.invoices.filter(x=>x.parent===id&&x.status==='draft');return{rc,cn,cp,ch,n:rc.length+cn.length+cp.length}}
function depsModal(v){const d=deps(v.id);modal(`<h2>Belum bisa dibatalkan · ${v.no}</h2><p class="small muted" style="margin:0 0 12px">Ada dokumen lain yang bergantung pada faktur ini. Urutan yang benar: <b>batalkan dokumen turunan dulu</b> (masing-masing dengan alasan, bisa diaktifkan kembali), baru batalkan fakturnya. Tidak ada yang dihapus permanen.</p>${d.rc.length?`<h3>1. Penerimaan penjualan (${d.rc.length})</h3>${d.rc.map(r=>`<div class="item"><i class="dot" style="background:var(--red)"></i><div><b>${r.no}</b><span>${dstr(r.date)} · kas ${fmt(r.lines.filter(l=>l.inv===v.id).reduce((s,l)=>s+(+l.cash||0),0))}${r.lines.length>1?' · penerimaan ini juga melunasi faktur lain':''}</span></div><a href="#receipt/${r.id}" onclick="closeModal()">Buka</a> <button class="btn s d" onclick="closeModal();voidReceipt('${r.id}');setTimeout(()=>cancelInvoice('${v.id}'),50)">Batalkan penerimaan</button></div>`).join('')}`:''}${d.cp.length?`<h3>${d.rc.length?2:1}. Pembayaran komisi (${d.cp.length})</h3>${d.cp.map(p=>`<div class="item"><i class="dot" style="background:var(--amber)"></i><div><b>${esc(p.ref||'Komisi')} · ${se(p.seller).name}</b><span>${dstr(p.date)} · ${fmt(p.amount)}</span></div><button class="btn s d" onclick="closeModal();voidCommPay('${p.id}');setTimeout(()=>cancelInvoice('${v.id}'),50)">Batalkan pembayaran</button></div>`).join('')}`:''}${d.cn.length?`<h3>Nota kredit (${d.cn.length})</h3>${d.cn.map(n=>`<div class="item"><i class="dot" style="background:var(--amber)"></i><div><b>${n.no}</b><span>${fmt(n.amount)} · ${esc(n.reason)}</span></div><button class="btn s d" onclick="closeModal();voidCN('${n.id}');setTimeout(()=>cancelInvoice('${v.id}'),50)">Batalkan nota kredit</button></div>`).join('')}`:''}${d.ch.length?`<p class="small muted mt">Catatan: ${d.ch.length} proyeksi hasil lemparan faktur ini tetap ada — batalkan sendiri di Proyeksi Revenue kalau perlu.</p>`:''}<div class="mfoot"><button class="btn" onclick="closeModal()">Tutup</button></div>`)}
function cancelInvoice(id){const v=S.invoices.find(x=>x.id===id);const d=deps(id);if(d.n){depsModal(v);return}if(S.periods[ym(v.date)]==='locked'){toast('Periode terkunci');return}const why=prompt('Batalkan '+v.no+'? Nomor tetap terpakai. Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan wajib');return}v.status='cancelled';v.cancelReason=why;v.comm.on=false;logIt('invoice',id,'Dibatalkan · '+why);save();dD=null;nav()}
function approveComm(id){S.invoices.find(x=>x.id===id).comm.approved=true;logIt('invoice',id,'Komisi disetujui');save();if(dD&&dD.id===id)dD.comm.approved=true;nav()}
function throwNext_silent(id){const v=S.invoices.find(x=>x.id===id);const{ex}=nextProj(v);if(ex)return 0;return throwInvoice(v,[1])}

routes.projection=function(){const rows=S.invoices.filter(v=>v.status==='draft').sort((a,b)=>a.date.localeCompare(b.date));const months=[...new Set(rows.map(v=>ym(v.date)))].sort();
 return`<div class="top"><div><h1>Proyeksi Faktur (belum diterbitkan)</h1><p>Hasil <b>lemparan</b> faktur bulan sebelumnya, satu bulan ke depan setiap kali. Saat permintaan invoice datang, buka lalu <b>Terbitkan</b>. Belum ada nomor, belum masuk piutang.</p></div><div class="flex"><a class="btn" href="#invoices">Lempar dari daftar faktur →</a></div></div>
 <div class="card flush mb"><h2>Proyeksi penjualan per bulan</h2><div class="tw"><table><thead><tr><th>Bulan</th><th class="num">Faktur</th><th class="num">Nilai</th><th class="num">Setelah PPh (kas)</th></tr></thead><tbody>${months.length?months.map(m=>{const x=rows.filter(v=>ym(v.date)===m);return`<tr><td>${mlong(m)}</td><td class="num">${x.length}</td>${dcell(fmt(x.reduce((s,v)=>s+calc(v).total,0)),`drill('Proyeksi ${mlong(m)}',S.invoices.filter(v=>v.status==='draft'&&ym(v.date)==='${m}').map(invRow))`)}<td class="num">${fmt(x.reduce((s,v)=>s+calc(v).total*(1-tx(v.pph).rate),0))}</td></tr>`}).join(''):'<tr><td colspan="4" class="empty">Belum ada proyeksi</td></tr>'}</tbody></table></div></div>
 <div class="card flush"><div class="tw"><table><thead><tr><th>Bulan</th><th>Tanggal</th><th>Pelanggan</th><th>Lemparan dari</th><th>Isi</th><th class="num">Total</th><th>Status</th><th>Proyeksi berikutnya</th><th></th></tr></thead><tbody>${rows.length?rows.map(v=>{const np=nextProj(v);return`<tr><td>${mlong(ym(v.date))}</td><td>${dstr(v.date)}</td><td>${cu(v.cust).name}</td><td class="mono">${v.parent?((S.invoices.find(x=>x.id===v.parent)||{}).no||'proyeksi '+mlong(ym((S.invoices.find(x=>x.id===v.parent)||{}).date||v.date))):'manual'}</td><td style="white-space:normal">${v.lines.map(l=>esc(l.name)).join(', ')}</td><td class="num">${fmt(calc(v).total)}</td><td>${D(v.date)<TODAY?'<span class="st r">Lewat tanggal</span>':D(v.date)<=addDays(TODAY,7)?'<span class="st a">Minggu ini</span>':'<span class="st n">Terjadwal</span>'}</td><td>${np.ex?`<span class="chip g">✓ ${mlong(np.m)}</span>`:`<button class="btn s" onclick="throwNext('${v.id}')">Lempar → ${mlong(np.m)}</button>`}</td><td class="right" style="white-space:nowrap"><a class="btn s g" href="#invoice/${v.id}">Buka / Terbitkan</a> <button class="btn q s" onclick="shiftDraft('${v.id}')">Geser bulan</button> <button class="btn q s d" onclick="delDraft('${v.id}')">Hapus</button></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Tidak ada. Buka Faktur Penjualan → tombol <b>Lempar →</b> di baris faktur.</td></tr>'}</tbody></table></div></div>`};
function shiftDraft(id){const v=S.invoices.find(x=>x.id===id);const m=prompt('Geser ke bulan (YYYY-MM):',ym(iso(addMonths(D(v.date),1))));if(!m||!/^\d{4}-\d{2}$/.test(m))return;const terms=Math.round((D(v.due)-D(v.date))/864e5);const day=Math.min(+v.date.slice(8,10),new Date(+m.slice(0,4),+m.slice(5,7),0).getDate());v.date=m+'-'+pad(day);v.due=iso(addDays(D(v.date),terms));save();nav()}
function delDraft(id){if(!confirm('Hapus proyeksi ini? Pelanggan dianggap tidak lanjut bulan itu.'))return;S.invoices=S.invoices.filter(x=>x.id!==id);delete tabState['invoice/'+id];save();if(dD&&dD.id===id)dD=null;if(location.hash==='#invoice/'+id)go('projection');else nav()}

routes.receipts=function(){const rows=S.receipts.slice().sort((a,b)=>b.date.localeCompare(a.date));return`<div class="top"><div><h1>Penerimaan Penjualan</h1><p>Pembayaran dari pelanggan — kas, potongan PPh, diskon, uang muka</p></div><a class="btn g" href="#receipt/new">+ Penerimaan baru</a></div><div class="card flush"><div class="tw"><table><thead><tr><th>No. bukti</th><th>Tgl bayar</th><th>Terima dari</th><th>Bank</th><th>Cara bayar</th><th>Ref</th><th>Faktur</th><th class="num">Kas</th><th class="num">PPh</th><th class="num">Total pelunasan</th></tr></thead><tbody>${rows.map(r=>{const cash=r.lines.reduce((s,l)=>s+(+l.cash||0),0),pph=r.lines.reduce((s,l)=>s+(+l.pph||0),0),disc=r.lines.reduce((s,l)=>s+(+l.disc||0),0),cr=r.lines.reduce((s,l)=>s+(+l.credit||0),0);return`<tr class="row" onclick="go('receipt/${r.id}')"><td class="mono">${r.no}</td><td>${dstr(r.date)}</td><td>${cu(r.cust).name}</td><td>${r.bank==='PT'?'Rek. PT':'Rek. pribadi'}</td><td>${esc(r.method||'')}</td><td class="muted">${esc(r.ref)}</td><td class="mono">${r.lines.map(l=>(S.invoices.find(v=>v.id===l.inv)||{}).no||'?').join(', ')}</td><td class="num">${fmt(cash)}</td><td class="num">${fmt(pph)}</td><td class="num">${fmt(cash+pph+disc+cr)}</td></tr>`}).join('')}</tbody></table></div></div>`};
let rcTab='rincian',rcOpen={};
function rcBefore(r,v){const x=calc(v);const sv=(S.receipts.find(z=>z.id===r.id)||{lines:[]}).lines.find(z=>z.inv===v.id);return x.rem+(sv?(+sv.cash||0)+(+sv.pph||0)+(+sv.disc||0)+(+sv.credit||0):0)}
routes.receipt=function(arg){const[id,qs]=arg.split('?');const isNew=id==='new';if(!dD||dD.id!==id){if(isNew){const pre=new URLSearchParams(qs||'');const pv=pre.get('inv')?S.invoices.find(v=>v.id===pre.get('inv')):null;const cust=pv?pv.cust:(S.invoices.find(v=>v.status==='issued'&&calc(v).rem>0)||{}).cust||S.customers[0].id;dD={id:'new',no:'SR.'+TODAY.getFullYear()+'.'+pad(TODAY.getMonth()+1)+'.'+String(S.seq.receipt).padStart(4,'0'),cust,date:iso(TODAY),bank:cu(cust).via,method:'Transfer Bank',ref:'',note:'',lines:[]};if(pv)addRcLine(pv)}else dD=JSON.parse(JSON.stringify(S.receipts.find(r=>r.id===id)))}
 const r=dD,c=cu(r.cust);const open=S.invoices.filter(v=>v.status==='issued'&&v.cust===r.cust&&(calc(v).rem>0||r.lines.some(l=>l.inv===v.id))).sort((a,b)=>a.date.localeCompare(b.date));const cash=r.lines.reduce((s,l)=>s+(+l.cash||0),0),pph=r.lines.reduce((s,l)=>s+(+l.pph||0),0),disc=r.lines.reduce((s,l)=>s+(+l.disc||0),0),useCredit=r.lines.reduce((s,l)=>s+(+l.credit||0),0);const owed=open.reduce((s,v)=>s+rcBefore(r,v),0);
 return`<div class="docbar"><div><h1>${isNew?'Penerimaan Penjualan baru':r.no} ${isNew?'':r.status==='void'?'<span class="stamp r">Dibatalkan</span>':stamp('paid')}</h1><div class="sub">${esc(c.name)}${c.legal?' · '+esc(c.legal):''} · terhutang ${fmt(owed)} dari ${open.length} faktur</div></div><div class="acts">${!isNew?`<details class="dd"><summary class="btn">Proses ▾</summary><div class="menu">${r.status==='void'?`<button onclick="unvoidReceipt('${r.id}')">Aktifkan kembali</button>`:`<button class="d" onclick="voidReceipt('${r.id}')">Batalkan penerimaan (dengan alasan)</button>`}</div></details>`:''}</div></div>
 ${r.status==='void'?`<div class="note r mb">Penerimaan ini <b>dibatalkan</b> ${dstr(r.voidAt)} oleh ${esc(r.voidBy||'')} · alasan: ${esc(r.voidReason||'')}. Tidak dihitung ke faktur dan buku bank. Riwayat tetap tersimpan.</div>`:''}<div class="card"><div class="hdr"><div class="fld"><label class="f">Terima dari <b>*</b></label><select ${isNew?'':'disabled'} onchange="dD.cust=this.value;dD.bank=cu(this.value).via;dD.lines=[];nav()">${S.customers.map(x=>`<option value="${x.id}" ${x.id===r.cust?'selected':''}>${x.code} · ${esc(x.name)}</option>`).join('')}</select></div><div class="fld"><label class="f">Bank / kas <b>*</b></label><select onchange="dD.bank=this.value"><option value="PT" ${r.bank==='PT'?'selected':''}>Rekening PT · BCA</option><option value="Pribadi" ${r.bank==='Pribadi'?'selected':''}>Rekening pribadi</option></select></div><div class="fld"><label class="f">Tgl. bayar <b>*</b></label><input type="date" value="${r.date}" onchange="dD.date=this.value"></div>
 <div class="fld"><label class="f">Nilai pembayaran (kas masuk)</label><div class="flex" style="flex-wrap:nowrap;gap:6px"><input type="number" id="rcAmt" value="${cash||''}" placeholder="0" onchange="distribRc(+this.value)"><button class="btn s" title="Isi dari sisa faktur yang dicentang" onclick="dD.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);l.cash=Math.max(0,rcBefore(dD,v)-(+l.pph||0)-(+l.disc||0)-(+l.credit||0))});nav()">Hitung</button></div><span class="small muted">Ketik nominal transfer → didistribusikan ke faktur tercentang, terlama dulu</span></div><div class="fld"><label class="f">Cara bayar</label><select onchange="dD.method=this.value">${['Transfer Bank','Tunai/Lainnya','Cek/Giro'].map(m=>`<option ${r.method===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="fld"><label class="f">No. bukti</label><input value="${r.no}" disabled><input class="mt8" value="${esc(r.ref)}" placeholder="No. referensi transfer / cek" oninput="dD.ref=this.value"></div></div>
 <div class="ftabs">${[['rincian','Rincian Penerimaan',r.lines.length],['info','Info Lainnya']].map(t=>`<button class="${rcTab===t[0]?'on':''}" onclick="rcTab='${t[0]}';nav()">${t[1]}${t[2]?`<i>${t[2]}</i>`:''}</button>`).join('')}</div>
 ${rcTab==='rincian'?`${c.credit?`<div class="note mb">Pelanggan punya <b>uang muka / lebih bayar ${fmt(c.credit)}</b>. Pakai lewat kolom Potongan → Uang muka.</div>`:''}<div class="tw"><table class="grid-items" style="min-width:900px"><thead><tr><th style="width:40px">Bayar</th><th>No. faktur</th><th>Tgl. faktur</th><th>Jatuh tempo</th><th class="num">Total faktur</th><th class="num">Terhutang</th><th class="num" style="width:160px">Pembayaran (kas)</th><th style="width:230px">Potongan (PPh / diskon / uang muka)</th><th class="num">Sisa setelah ini</th></tr></thead><tbody>${open.length?open.map(v=>{const x=calc(v);const ln=r.lines.find(l=>l.inv===v.id);const before=rcBefore(r,v);const pot=ln?(+ln.pph||0)+(+ln.disc||0)+(+ln.credit||0):0;const after=ln?before-(+ln.cash||0)-pot:before;const mm=ln?pphMismatch(ln,before):0;return`<tr><td><input type="checkbox" ${ln?'checked':''} onchange="toggleRc('${v.id}',this.checked)"></td><td class="mono" style="padding-top:12px"><a href="#invoice/${v.id}">${v.no}</a></td><td style="padding-top:12px">${dstr(v.date)}</td><td style="padding-top:12px;color:${D(v.due)<TODAY?'var(--red)':'inherit'}">${dstr(v.due)}</td><td class="num" style="padding-top:12px">${fmt(x.total)}</td><td class="num" style="padding-top:12px">${fmt(before)}</td>${ln?`<td><input type="number" value="${ln.cash}" onchange="setRc('${v.id}','cash',this.value)"></td><td style="padding-top:9px"><span class="small">${tx(ln.pphType).rate?`PPh ${fmt(ln.pph)}`:'Tanpa PPh'}${ln.disc?` · diskon ${fmt(ln.disc)}`:''}${ln.credit?` · UM ${fmt(ln.credit)}`:''}</span> <button class="btn q s" onclick="rcOpen['${v.id}']=!rcOpen['${v.id}'];nav()">${rcOpen[v.id]?'Tutup':'Ubah'}</button>${mm?`<div class="warn-inline">PPh tidak sesuai tarif (seharusnya ${fmt(mm)})</div>`:''}${(+ln.pph||0)>0&&!(ln.bukti||'').trim()?'<div class="warn-inline">Bukti potong belum diterima — ditandai di Rekap PPh</div>':''}${ln.writeoff?`<div class="warn-inline">PPh ${fmt(ln.writeoff.pph)} dibebankan (tanpa bukti potong) <button class="btn q s" onclick="undoWriteOffPph('${r.id}','${v.id}')">batalkan</button></div>`:''}</td><td class="num" style="padding-top:12px;${after<0?'color:var(--amber)':''}">${after<0?'Lebih '+fmt(-after)+' → uang muka':after===0?'<span class="st g">Lunas</span>':fmt(after)}</td>`:`<td colspan="3" class="muted" style="padding-top:12px">Centang “Bayar” untuk memasukkan faktur ini</td>`}</tr>${ln&&rcOpen[v.id]?`<tr class="sub"><td></td><td colspan="8"><div class="pot"><div><label class="f">Jenis PPh (dipotong klien)</label><select onchange="setRc('${v.id}','pphType',this.value)">${S.taxes.map(t=>`<option value="${t.code}" ${t.code===ln.pphType?'selected':''}>${t.label}</option>`).join('')}</select></div><div><label class="f">Nominal PPh</label><input type="number" value="${ln.pph||''}" placeholder="0" onchange="setRc('${v.id}','pph',this.value)"></div><div><label class="f">No. bukti potong ${(+ln.pph||0)>0?'<b style="color:var(--red)">*</b>':''}</label><input value="${esc(ln.bukti||'')}" placeholder="wajib bila ada PPh" oninput="setRc('${v.id}','bukti',this.value)"></div><div><label class="f">Diskon / pembulatan</label><input type="number" value="${ln.disc||''}" placeholder="0" onchange="setRc('${v.id}','disc',this.value)"></div><div><label class="f">Pakai uang muka (maks ${fmtS(c.credit||0)})</label><input type="number" value="${ln.credit||''}" placeholder="0" max="${c.credit||0}" ${c.credit?'':'disabled'} onchange="setRc('${v.id}','credit',this.value)"></div></div></td></tr>`:''}`}).join(''):'<tr><td colspan="9" class="empty">Tidak ada faktur terhutang untuk pelanggan ini</td></tr>'}</tbody></table></div><p class="small muted mt8">Saat dicentang, kas terisi otomatis = terhutang − PPh sesuai pengaturan pelanggan. Faktur <b>lunas</b> bila kas + PPh + diskon + uang muka = terhutang. Kelebihan bayar otomatis jadi uang muka pelanggan.</p>
 <div class="foot2"><div></div><div class="tots"><div class="r"><span class="k">Total pembayaran (kas)</span><span>${fmt(cash)}</span></div><div class="r"><span class="k">Potongan PPh</span><span>${fmt(pph)}</span></div><div class="r"><span class="k">Diskon</span><span>${fmt(disc)}</span></div>${useCredit?`<div class="r"><span class="k">Uang muka dipakai</span><span>${fmt(useCredit)}</span></div>`:''}<div class="r t"><span>Total pelunasan</span><span>${fmt(cash+pph+disc+useCredit)}</span></div><div class="r"><span class="k">Sisa terhutang pelanggan setelah ini</span><span>${fmt(Math.max(0,owed-(cash+pph+disc+useCredit)))}</span></div></div></div>`:''}
 ${rcTab==='info'?`<div class="grid g2"><div class="field"><label class="f">Catatan</label><textarea rows="4" oninput="dD.note=this.value">${esc(r.note)}</textarea></div><div class="field"><label class="f">Lampiran (bukti transfer, bukti potong)</label><div class="empty">Unggah file — tersedia di versi produksi</div></div></div><h3 class="mt">Riwayat & versi sebelumnya</h3><div class="grid g2"><div class="hist">${S.log.filter(l=>l.id===r.id).map(l=>`<div class="e"><span class="when">${dstr(l.t)} · ${esc(l.who)}</span><span>${esc(l.m)}</span></div>`).join('')||'<div class="empty">Belum ada</div>'}</div><div>${(r.revisions||[]).length?(r.revisions||[]).slice().reverse().map((x,i,arr)=>`<div class="item"><div><b>Versi ${arr.length-i} · ${dstr(x.t)} · ${esc(x.who)}</b><span>kas ${fmt(x.snap.lines.reduce((s,l)=>s+(+l.cash||0),0))} · PPh ${fmt(x.snap.lines.reduce((s,l)=>s+(+l.pph||0),0))}</span></div><button class="btn s" onclick="restoreRcRev('${r.id}',${arr.length-1-i})">Pulihkan</button></div>`).join(''):'<div class="empty">Belum ada perubahan</div>'}</div></div>`:''}
 <div class="savebar"><span class="l">${isNew?'Satu penerimaan bisa melunasi beberapa faktur sekaligus.':'Tersimpan · perubahan mengubah status faktur terkait'}</span><span class="sp"></span><span style="font-weight:600;margin-right:10px">Kas ${fmt(cash)}</span><a class="btn" href="#receipts">Batal</a><button class="btn g" ${can('pay')&&r.status!=='void'?'':'disabled'} onclick="saveReceipt()">${isNew?'Simpan & tutup':'Simpan perubahan & tutup'}</button></div></div>`};
function restoreRcRev(id,k){const r=S.receipts.find(x=>x.id===id);const x=r.revisions[k];if(!confirm('Pulihkan penerimaan ke versi '+dstr(x.t)+'?'))return;const snap=JSON.parse(JSON.stringify(r));delete snap.revisions;r.revisions.push({t:iso(TODAY),who:me.name,snap});['lines','date','bank','method','ref','note','cust'].forEach(k2=>r[k2]=JSON.parse(JSON.stringify(x.snap[k2])));logIt('receipt',id,'Dipulihkan ke versi '+dstr(x.t));r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' dipulihkan ke versi '+dstr(x.t)));save();dD=null;toast('Versi dipulihkan');nav()}
function distribRc(amt){let left=amt;dD.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);const room=Math.max(0,rcBefore(dD,v)-(+l.pph||0)-(+l.disc||0)-(+l.credit||0));l.cash=Math.min(room,left);left-=l.cash});if(left>0&&dD.lines.length){dD.lines[dD.lines.length-1].cash+=left;toast('Kelebihan '+fmt(left)+' akan jadi uang muka pelanggan')}nav()}
function pphMismatch(ln,base){const rate=tx(ln.pphType).rate;if(!rate)return 0;const expect=Math.round(base*rate);return Math.abs(expect-(+ln.pph||0))>1?expect:0}
function addRcLine(v){const rem=rcBefore(dD,v);const rate=tx(cu(v.cust).pph).rate;const pph=Math.round(rem*rate);dD.lines.push({inv:v.id,cash:rem-pph,pphType:cu(v.cust).pph,pph:pph,bukti:'',disc:0,credit:0})}
function toggleRc(vid,on){if(on){addRcLine(S.invoices.find(v=>v.id===vid))}else dD.lines=dD.lines.filter(l=>l.inv!==vid);nav()}
function setRc(vid,k,val){const l=dD.lines.find(x=>x.inv===vid);if(k==='bukti'||k==='pphType')l[k]=val;else l[k]=+val||0;if(k==='pphType'){const v=S.invoices.find(x=>x.id===vid);const before=rcBefore(dD,v);l.pph=Math.round(before*tx(val).rate);l.cash=before-l.pph-(+l.disc||0)-(+l.credit||0)}if(k!=='bukti')nav()}
function saveReceipt(){const r=dD;if(!r.lines.length){toast('Centang minimal satu faktur');return}if(S.periods[ym(r.date)]==='locked'){toast('Periode '+mlong(ym(r.date))+' sudah dikunci');return}for(const l of r.lines){const v=S.invoices.find(x=>x.id===l.inv);if(v&&r.date<v.date){toast('Tanggal bayar tidak boleh sebelum tanggal faktur '+v.no);return}if((+l.cash||0)+(+l.pph||0)+(+l.disc||0)+(+l.credit||0)<=0){toast('Nominal kosong');return}}
 const isNew=r.id==='new';if(isNew){r.id='r'+Date.now();r.no=nextNo('receipt');S.receipts.push(r)}else{const old=S.receipts.find(x=>x.id===r.id);const snap=JSON.parse(JSON.stringify(old));delete snap.revisions;(old.revisions=old.revisions||[]).push({t:iso(TODAY),who:me.name,snap});r.revisions=old.revisions;Object.assign(old,r)}
 const c=cu(r.cust);const used=r.lines.reduce((s,l)=>s+(+l.credit||0),0);if(used>0){c.credit=Math.max(0,c.credit-used)}
 let over=0;r.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);const x=calc(v);if(x.rem<0){over+=-x.rem;l.cash=Math.max(0,(+l.cash||0)+x.rem)}});if(over>0){c.credit=(c.credit||0)+over}
 r.lines.forEach(l=>logIt('invoice',l.inv,'Pembayaran '+r.no+' · kas '+fmt(l.cash)+(l.pph?' · PPh '+fmt(l.pph):'')));logIt('receipt',r.id,(isNew?'Dibuat':'Diubah')+' '+r.no);save();const nobp=r.lines.some(l=>(+l.pph||0)>0&&!(l.bukti||'').trim());toast((isNew?'Penerimaan '+r.no+' disimpan':'Disimpan')+(over?' · lebih bayar '+fmt(over)+' jadi uang muka':'')+(nobp?' · bukti potong belum diterima, ditandai di Rekap PPh':''));rcOpen={};finishDoc(location.hash.replace('#',''),'receipts')}
