<style>
:root{--bg:#F5F5F7;--sf:#FFFFFF;--sf2:#FAFAFC;--hover:#F2F2F5;--ink:#1D1D1F;--ink2:#515154;--ink3:#86868B;--ink4:#AEAEB2;--hair:rgba(0,0,0,.08);--hair2:rgba(0,0,0,.14);--blue:#0066CC;--blue-soft:rgba(0,102,204,.08);--green:#1F8A4C;--amber:#B25E00;--red:#C7362F;--green-soft:rgba(31,138,76,.10);--amber-soft:rgba(178,94,0,.10);--red-soft:rgba(199,54,47,.10);--sh:0 1px 1px rgba(0,0,0,.02),0 2px 8px rgba(0,0,0,.04);--sh2:0 12px 40px rgba(0,0,0,.14);--bar1:#1D1D1F;--bar2:#8E8E93;--bar3:#D1D1D6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--sf:#1C1C1E;--sf2:#232326;--hover:#2A2A2E;--ink:#F5F5F7;--ink2:#C7C7CC;--ink3:#8E8E93;--ink4:#636366;--hair:rgba(255,255,255,.10);--hair2:rgba(255,255,255,.18);--blue:#2997FF;--blue-soft:rgba(41,151,255,.14);--green:#30D158;--amber:#FFB340;--red:#FF6961;--green-soft:rgba(48,209,88,.14);--amber-soft:rgba(255,179,64,.14);--red-soft:rgba(255,105,97,.14);--sh:none;--sh2:0 12px 40px rgba(0,0,0,.6);--bar1:#F5F5F7;--bar2:#8E8E93;--bar3:#48484A}}
:root[data-theme="dark"]{--bg:#000;--sf:#1C1C1E;--sf2:#232326;--hover:#2A2A2E;--ink:#F5F5F7;--ink2:#C7C7CC;--ink3:#8E8E93;--ink4:#636366;--hair:rgba(255,255,255,.10);--hair2:rgba(255,255,255,.18);--blue:#2997FF;--blue-soft:rgba(41,151,255,.14);--green:#30D158;--amber:#FFB340;--red:#FF6961;--green-soft:rgba(48,209,88,.14);--amber-soft:rgba(255,179,64,.14);--red-soft:rgba(255,105,97,.14);--sh:none;--sh2:0 12px 40px rgba(0,0,0,.6);--bar1:#F5F5F7;--bar2:#8E8E93;--bar3:#48484A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 "Geist",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;font-feature-settings:"tnum" 1}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;letter-spacing:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--hair2);border-radius:8px;padding:8px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:38px;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:var(--ink4)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--ink);margin:0}
input:disabled,select:disabled{color:var(--ink3);background:var(--sf2)}
label.f{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.field{margin-bottom:14px}
.btn{border:1px solid var(--hair2);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:9px;font-weight:500;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}.btn.p:hover{opacity:.88;background:var(--ink)}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.q{border-color:transparent;background:transparent;color:var(--blue)}.btn.q:hover{background:var(--blue-soft)}
.btn.d{color:var(--red)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{display:grid;grid-template-columns:172px 1fr;grid-template-rows:46px 38px 1fr;min-height:100vh}
.topbar{grid-column:1/-1;background:#1D1D1F;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px 0 10px;position:sticky;top:0;z-index:80}
.topbar .brand{padding:0;color:#fff;font-size:14px;flex:none}.topbar .topbar .brand i::after{background:#1D1D1F}
.topbar .search{position:relative;flex:1;min-width:120px;max-width:420px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:13px;color:rgba(255,255,255,.7)}
.gsearch-results{display:none;position:absolute;top:calc(100% + 6px);left:0;width:340px;max-height:380px;overflow:auto;background:var(--sf);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--sh2);z-index:60;padding:6px}
.gsr-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.gsr-item:hover{background:var(--hover)}
.ssel-wrap{position:relative}
.cbx{position:relative;width:100%}.cbl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:var(--sf);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--sh2);max-height:260px;overflow:auto;padding:4px;min-width:220px}.cbo{padding:8px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;color:var(--ink)}.cbo:hover,.cbo.hi{background:rgba(59,130,246,.14)}.cbe{padding:10px;font-size:13px;color:var(--ink4)}
.chipsel{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:5px 6px 5px 11px;border:1px solid rgba(59,130,246,.5);background:rgba(59,130,246,.12);border-radius:8px;font-size:14px;color:var(--ink)}
.chipsel>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipsel button{border:0;background:rgba(245,166,35,.18);color:#f5a623;font-size:15px;line-height:1;width:22px;height:22px;border-radius:6px;cursor:pointer;padding:0}
.chipsel button:hover{background:rgba(245,166,35,.35)}
.ssel-results{display:none;position:absolute;top:calc(100% + 4px);left:0;width:100%;min-width:260px;max-height:280px;overflow:auto;background:var(--sf);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--sh2);z-index:60;padding:6px}
.ssel-item{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink)}
.ssel-item:hover{background:var(--hover)}
.ssel-item b{font-weight:600}
.ssel-empty{padding:8px 9px;font-size:12px;color:var(--muted)}
.gsr-type{flex:none;font-size:10.5px;color:var(--ink4);text-transform:uppercase;letter-spacing:.04em;width:70px}
.gsr-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsr-sub{flex:none;font-size:11.5px;color:var(--ink3)}
.gsr-empty{padding:12px;font-size:13px;color:var(--ink3);text-align:center}
.topbar .search input{background:transparent;border:0;color:#fff;padding:0;font-size:13px}.topbar .search input::placeholder{color:rgba(255,255,255,.55)}.topbar .search input:focus{box-shadow:none}
.topbar .sp{flex:1}.topbar .co{flex:none;font-size:12.5px;color:rgba(255,255,255,.75);text-align:right;line-height:1.2;margin-left:6px}.topbar .co b{display:block;color:#fff;font-weight:500}
.topbar details.dd .menu{color:var(--ink)}.syncdot{width:8px;height:8px;border-radius:50%;background:#30D158;display:inline-block;margin-right:4px}.syncdot.busy{background:#FFB340;animation:blink 1s infinite}@keyframes blink{50%{opacity:.3}}.topbar .av{flex:none;color:#fff;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;font-weight:600}
.topbar .bell{flex:none;position:relative;width:30px;height:30px;cursor:pointer;display:grid;place-items:center;border-radius:8px;color:rgba(255,255,255,.8)}.topbar .bell:hover{background:rgba(255,255,255,.12)}.topbar .bell b{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:9.5px;font-weight:600;border-radius:8px;padding:0 4px;line-height:14px}
.pagetabs{grid-column:2;display:flex;align-items:flex-end;gap:2px;padding:0 12px;background:var(--sf);border-bottom:1px solid var(--hair);position:sticky;top:46px;z-index:55;overflow-x:auto}
.pagetabs .pt{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.pagetabs .pt:hover{color:var(--ink)}.pagetabs .pt.on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.pagetabs .pt i{font-style:normal;color:var(--ink4);padding:0 3px;border-radius:4px;font-size:13px}.pagetabs .pt i:hover{background:var(--hover);color:var(--ink)}

routes.item=function(id){const isNew=id==='new';if(!dD||dD.id!==id)dD=isNew?{id:'new',code:'',name:'',desc:'',price:0,cost:0}:JSON.parse(JSON.stringify(it(id)));const x=dD;return`<div class="top"><div><h1>${isNew?'Item baru':esc(x.name)}</h1><p>Barang & Jasa</p></div></div><div class="card" style="max-width:720px"><div class="grid g2"><div class="field"><label class="f">Kode</label><div class="flex" style="flex-wrap:nowrap;gap:6px"><input id="itCode" value="${esc(x.code)}" placeholder="Kosongkan = otomatis" oninput="dD.code=this.value;itChk()"><button class="btn s" type="button" title="Buat kode otomatis" onclick="dD.code=itAuto();document.getElementById('itCode').value=dD.code;itChk()">Otomatis</button></div><span id="itMsg" class="small" style="color:var(--red)">${itDup(x.code,x.id)?'Kode sudah dipakai item lain':''}</span></div><div class="field"><label class="f">Nama</label><input value="${esc(x.name)}" oninput="dD.name=this.value"></div></div><div class="field"><label class="f">Deskripsi standar (tampil di dokumen, bisa beberapa baris)</label><textarea rows="5" oninput="dD.desc=this.value">${esc(x.desc)}</textarea><p class="small muted mt8">Pakai <b>{brand}</b> (nama pelanggan) dan <b>{periode}</b> (diisi otomatis dari Periode layanan di faktur) supaya teks yang sama bisa dipakai ke semua pelanggan. Isi di faktur tetap bisa diedit.</p></div><div class="grid g2"><div class="field"><label class="f">Harga jual default</label><input type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(x.price)}" onchange="dD.price=num(this.value)"></div><div class="field"><label class="f">HPP / biaya default (internal)</label><input type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(x.cost)}" onchange="dD.cost=num(this.value)"><p class="small muted mt8">Dipakai untuk laba kotor. Tidak tampil di dokumen.</p></div></div></div>${vtool([`<button class="btn p" onclick="saveItem()">Simpan</button>`,`<button class="btn" onclick="cancelDoc('items')">Batal</button>`,!isNew?`<button class="btn d" onclick="if(S.invoices.some(v=>v.lines.some(l=>l.item==='${x.id}'))){toast('Item dipakai di faktur — tidak bisa dihapus, nonaktifkan saja');return}if(confirm('Hapus item?')){S.items=S.items.filter(i=>i.id!=='${x.id}');save();go('items')}">Hapus</button>`:''])}`};
function itDup(c,id){c=(c||'').trim().toLowerCase();return !!c&&S.items.some(x=>x.id!==id&&(x.code||'').trim().toLowerCase()===c)}

 const tbl=(list,type)=>`<div class="tw"><table><thead><tr><th>Nama</th><th class="num">Faktur</th><th class="num">Komisi accrued</th><th class="num">Dibayar</th><th>Aktif</th><th></th></tr></thead><tbody>${list.length?list.map(s=>{const vs=S.invoices.filter(v=>v.status==='issued'&&v.seller===s.id&&v.comm.on);const acc=vs.filter(v=>v.comm.approved).reduce((a,v)=>a+calc(v).comm.amount,0),paid=S.commPayments.filter(p=>p.status!=='void'&&p.seller===s.id).reduce((a,p)=>a+p.amount,0);return`<tr><td><input value="${esc(s.name)}" style="width:200px;${s.active?'':'opacity:.6'}" onchange="sdEdit('${s.id}','name',this.value)">${s.active?'':' <span class="tag">nonaktif</span>'}</td>${dcell(vs.length,`drill('Faktur ${esc(s.name)}',S.invoices.filter(v=>v.status==='issued'&&v.seller==='${s.id}').map(invRow))`)}<td class="num">${fmt(acc)}</td><td class="num">${fmt(paid)}</td><td><input type="checkbox" ${s.active?'checked':''} onchange="sdEdit('${s.id}','active',this.checked)" title="Nonaktif = tidak muncul di pilihan faktur/penawaran baru; faktur & komisi lama tetap tercatat"></td><td class="right"><button class="btn q s d" onclick="delSeller('${s.id}')">Hapus</button><button class="btn q s" onclick="S.sellers.find(x=>x.id==='${s.id}').type='${type==='BD'?'AM':'BD'}';save();nav()" title="Salah taruh? Pindahkan ke daftar ${type==='BD'?'AM':'BD'}">Pindah ke ${type==='BD'?'AM':'BD'}</button></td></tr>`}).join(''):`<tr><td colspan="6" class="empty">Belum ada ${type==='BD'?'Business Development':'Account Manager'}</td></tr>`}</tbody></table></div>`;
 return`${sdrDirty()?`<div class="note a mb" style="position:sticky;top:130px;z-index:35;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="flex:1"><b>Ada perubahan yang belum disimpan.</b> Penjual yang dinonaktifkan tidak muncul di pilihan faktur/penawaran baru; faktur dan komisi lama tetap tercatat.</span><button class="btn" onclick="sdCancel()">Batal</button><button class="btn g" onclick="sdSave()">Simpan</button></div>`:''}<div class="top"><div><h1>Penjual — BD & AM</h1><p>Business Development (BD) menutup deal, dapat komisi dari faktur pertama pelanggan. Account Manager (AM) mengelola pelanggan berjalan, dapat komisi dari faktur selanjutnya. Dua daftar terpisah di bawah — nama di sini yang muncul sebagai pilihan BD/AM saat mengisi data Pelanggan.</p></div></div>
 <div class="card flush mb"><div class="flex" style="justify-content:space-between;align-items:center;padding:20px 24px 4px"><h2 style="margin:0;padding:0">Business Development (BD) <span class="muted" style="font-weight:400">· ${bdList.length}</span></h2><button class="btn g s" onclick="const n=prompt('Nama BD baru:');if(n){S.sellers.push({id:'s'+Date.now(),name:n,type:'BD',active:true});save();nav()}">+ Tambah BD</button></div>${tbl(bdList,'BD')}</div>
 <div class="card flush"><div class="flex" style="justify-content:space-between;align-items:center;padding:20px 24px 4px"><h2 style="margin:0;padding:0">Account Manager (AM) <span class="muted" style="font-weight:400">· ${amList.length}</span></h2><button class="btn g s" onclick="const n=prompt('Nama AM baru:');if(n){S.sellers.push({id:'s'+Date.now(),name:n,type:'AM',active:true});save();nav()}">+ Tambah AM</button></div>${tbl(amList,'AM')}</div>`};

/* ---------- grid item (dipakai penawaran & faktur) — gaya Accurate ---------- */
function itemsGrid(lines,ro,withDefer){return`<div class="tw"><table class="grid-items"><thead><tr><th style="width:26px">#</th><th style="width:38%">Nama barang & jasa</th><th class="num" style="width:70px">Kuantitas</th><th class="num" style="width:150px">Harga satuan</th><th class="num" style="width:150px">Total harga</th><th class="num" style="width:130px;color:var(--amber)">HPP · internal</th>${withDefer?'<th style="width:170px">Pengakuan pendapatan</th>':''}<th style="width:50px"></th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td class="muted" style="padding-top:12px">${i+1}</td><td>${ro?'':`<div class="ssel-wrap"><input autocomplete="off" placeholder="Cari / pilih barang & jasa…" value="${l.item?esc((it(l.item)||{}).code||''):''}" oninput="itemPickFilter(${i},this.value)" onfocus="itemPickFilter(${i},this.value)" onblur="setTimeout(()=>closeItemPick(${i}),180)"><div id="item-pick-results-${i}" class="ssel-results"></div></div>`}<input class="nm" value="${esc(l.name)}" placeholder="Nama jasa" ${ro?'disabled':''} oninput="dD.lines[${i}].name=this.value"><textarea rows="2" placeholder="Catatan baris (tampil di dokumen, boleh beberapa baris)" ${ro?'disabled':''} oninput="dD.lines[${i}].desc=this.value;dD.lines[${i}].descEdited=true;this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(l.desc)}</textarea></td><td><input type="number" value="${l.qty}" ${ro?'disabled':''} onchange="dD.lines[${i}].qty=+this.value;nav()"></td><td><input type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(l.price)}" ${ro?'disabled':''} onchange="dD.lines[${i}].price=num(this.value);nav()"></td><td class="num" style="padding-top:12px">${fmt(lineAmt(l))}</td><td><input type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(l.cost||'')}" placeholder="${l.noHpp?'tanpa HPP':'0'}" ${ro||l.noHpp?'disabled':''} onchange="dD.lines[${i}].cost=num(this.value);nav()"><label class="small" style="display:flex;gap:5px;align-items:center;margin-top:4px;color:${!l.noHpp&&!(+l.cost>0)?'var(--amber)':'var(--ink3)'};cursor:pointer"><input type="checkbox" style="width:auto" ${l.noHpp?'checked':''} ${ro?'disabled':''} onchange="dD.lines[${i}].noHpp=this.checked;if(this.checked)dD.lines[${i}].cost=0;nav()">Tanpa HPP</label></td>${withDefer?`<td style="padding-top:11px">${l.defer&&l.defer.m?`<span class="defer" onclick="openDefer(${i})">${l.defer.m} bln · mulai ${mlong(dmonth(l,dD))}</span>`:`<span class="defer off" onclick="openDefer(${i})">Diakui langsung · ${mlong(ym(dD.date))}</span>`}</td>`:''}<td style="padding-top:8px">${ro?'':`<button class="btn q s" onclick="dD.lines.splice(${i},1);nav()">×</button>`}</td></tr>`).join('')}</tbody></table></div>${ro?'':`<button class="btn q s mt8" onclick="dD.lines.push({item:'',name:'',desc:'',qty:1,price:0,cost:0,defer:null});nav()">+ Tambah baris</button>`}`}
function fmtTgl(d){return d?D(d).toLocaleDateString(LOC(),{day:'2-digit',month:'long',year:'numeric'}):''}
function fmtPeriode(v){if(!v||!v.perStart||!v.perEnd)return'';return'(Periode '+(v.perNo?v.perNo+' : ':': ').replace(/^(Periode : )$/,'')+fmtTgl(v.perStart)+' - '+fmtTgl(v.perEnd)+')'}
function resolveTpl(tpl,v){if(!tpl)return'';const c=v&&v.cust?cu(v.cust):null;return String(tpl).replace(/\{brand\}/gi,c?c.name:'').replace(/\{periode\}/gi,fmtPeriode(v)).replace(/[ \t]+\n/g,'\n').replace(/[ \t]{2,}/g,' ').trim()}
function applyTpl(v){(v.lines||[]).forEach(l=>{if(l.tpl&&!l.descEdited)l.desc=resolveTpl(l.tpl,v)})}
function setPeriode(k,val){dD[k]=k==='perNo'?(+val||''):val;if(k==='perStart'&&val&&!dD.perEnd){const d=D(val);const e=new Date(d.getFullYear(),d.getMonth()+1,d.getDate()-1);dD.perEnd=iso(e)}applyTpl(dD);nav()}
function pickItem(i,id){const x=it(id);if(!x)return;Object.assign(dD.lines[i],{item:x.id,name:x.name,tpl:x.desc,descEdited:false,desc:resolveTpl(x.desc,dD),price:x.price,cost:x.cost});nav()}
function itemPickFilter(i,q){const box=document.getElementById('item-pick-results-'+i);if(!box)return;q=(q||'').trim().toLowerCase();const res=S.items.filter(x=>!q||((x.code||'')+' '+x.name).toLowerCase().includes(q)).slice(0,30);if(!res.length){box.innerHTML=`<div class="ssel-empty">Tidak ditemukan</div>`;box.style.display='block';return}box.innerHTML=res.map(x=>`<div class="ssel-item" onmousedown="event.preventDefault();closeItemPick(${i});pickItem(${i},'${x.id}')"><b>${esc(x.code)}</b> · ${esc(x.name)} · ${fmtS(x.price)}</div>`).join('');box.style.display='block'}
function closeItemPick(i){const box=document.getElementById('item-pick-results-'+i);if(box){box.style.display='none';box.innerHTML=''}}
// Penangguhan: bulanan saja (N bulan, mulai bulan tertentu, sama rata) — seperti Accurate
function openDefer(i){const l=dD.lines[i];const on=!!(l.defer&&l.defer.m);const cur=on?dmonth(l,dD):ym(dD.date);const base=D(ym(dD.date)+'-01');const opts=[];for(let k=-3;k<=12;k++)opts.push(ym(iso(addMonths(base,k))));if(!opts.includes(cur))opts.unshift(cur);const m0=on?l.defer.m:1;
 modal(`<h2>Pengakuan pendapatan</h2><p class="small muted" style="margin:0 0 14px">${esc(l.name)||'Baris '+(i+1)} · ${fmt(lineAmt(l))}</p><label class="flex" style="gap:10px;cursor:pointer;margin-bottom:12px"><input type="checkbox" id="dfOn" ${on?'checked':''} onchange="document.getElementById('dfBox').style.opacity=this.checked?1:.4"><span>Ditangguhkan — diakui <b>per bulan, sama rata</b></span></label><div id="dfBox" style="opacity:${on?1:.4}"><div class="grid g2"><div class="field"><label class="f">Selama</label><div class="flex" style="flex-wrap:nowrap"><input type="number" id="dfM" min="1" max="36" value="${m0}"><span class="small muted">bulan</span></div></div><div class="field"><label class="f">Mulai bulan</label><select id="dfS">${opts.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${mlong(m)}</option>`).join('')}</select></div></div><p class="small muted">Tidak ditangguhkan = seluruh nilai diakui di bulan faktur (${mlong(ym(dD.date))}). Contoh: 3 bulan mulai ${mlong(ym(dD.date))} → 1/3 tiap bulan.</p></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="dD.lines[${i}].defer=document.getElementById('dfOn').checked?{m:Math.min(36,Math.max(1,+document.getElementById('dfM').value)),s:document.getElementById('dfS').value}:null;closeModal();nav()">Terapkan</button></div>`)}

routes.quotes=function(){return`<div class="top"><div><h1>Penawaran Penjualan</h1><p>${S.quotes.filter(q=>q.status==='sent').length} menunggu jawaban</p></div><a class="btn p" href="#quote/new">Penawaran baru</a></div><div class="card flush"><div class="tw"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Pelanggan</th><th>Penjual</th><th>Berlaku s/d</th><th class="num">Total</th><th>Status</th><th>Faktur</th></tr></thead><tbody>${S.quotes.map(q=>{const lk=q.status==='converted'?quoteLink(q):null;const eff=q.status==='converted'&&!lk?'accepted':q.status;return`<tr class="row" onclick="go('quote/${q.id}')"><td class="mono">${q.no}</td><td>${dstr(q.date)}</td><td>${q.cust?cu(q.cust).name:esc(q.custName)+' <span class="tag">baru</span>'}</td><td>${q.seller?se(q.seller).name:'—'}</td><td>${dstr(q.valid)}</td><td class="num">${fmt(q.lines.reduce((s,l)=>s+lineAmt(l),0))}</td><td>${st(eff)}</td><td>${lk?`<a class="mono" href="#invoice/${lk.id}" onclick="event.stopPropagation()">${esc(lk.no||'Draft')}</a> ${st(calc(lk).st)}`:'<span class="muted">—</span>'}</td></tr>`}).join('')}</tbody></table></div></div>`};
routes.quote=function(id){const isNew=id==='new';if(!dD||dD.id!==id)dD=isNew?{id:'new',no:quoteNoPeek(''),cust:'',date:iso(TODAY),valid:iso(addDays(TODAY,30)),seller:'',prep:'',pph:'none',signOn:true,status:'draft',notes:quoteRemarksDefault(),special:'',lines:[{item:'',name:'',desc:'',qty:1,price:0,cost:0}]}:JSON.parse(JSON.stringify(S.quotes.find(q=>q.id===id)));if(dD.status==='converted'&&!quoteLink(dD))dD.status='accepted';const q=dD,ro=q.status==='converted',tot=q.lines.reduce((s,l)=>s+lineAmt(l),0),cost=q.lines.reduce((s,l)=>s+(+l.qty||0)*(+l.cost||0),0);
 return`<div class="top"><div><h1>${isNew?'Penawaran baru':q.no} ${stamp(q.status)}</h1><p>Penawaran Penjualan</p></div></div><div class="card"><div class="doc-head"><div><div class="row"><label>Pelanggan <b>*</b></label>${combo(custOpts(),q.cust,"v=>{dD.cust=v;if(v)dD.pph=cu(v).pph||'none';if(dD.id==='new')dD.no=quoteNoPeek(v);nav()}",'Ketik nama brand…',ro,1)}${q.custName&&!q.cust?`<div class="small muted">${esc(q.custName)} (baru)</div>`:''}</div><div class="row"><label>Penjual</label>${combo(sellerOpts(),q.seller,"v=>{dD.seller=v;nav()}",'Ketik nama BD / AM…',ro,1)}</div></div><div><div class="row"><label>Penawaran #</label><input value="${q.no}" disabled></div><div class="row"><label>Tanggal</label><input type="date" value="${q.date}" ${ro?'disabled':''} onchange="dD.date=this.value"></div><div class="row"><label>Berlaku s/d</label><input type="date" value="${q.valid}" ${ro?'disabled':''} onchange="dD.valid=this.value"></div></div></div>${itemsGrid(q.lines,ro,false)}<div class="grid g2 mt"><div><label class="f">Special notes and instructions (tampil di PDF)</label><textarea rows="5" ${ro?'disabled':''} oninput="dD.special=this.value">${esc(q.special||'')}</textarea></div><div><label class="f">Important remarks (default dari Pengaturan, bisa diedit per penawaran)</label><textarea rows="5" ${ro?'disabled':''} oninput="dD.notes=this.value">${esc((q.notes==null||q.notes==='')?quoteRemarksDefault():q.notes)}</textarea></div></div><div class="grid g2 mt"><div><label class="f">Client's approval 1 · nama</label><input value="${esc(q.ap1||'')}" ${ro?'disabled':''} placeholder="mis. Vera Merdeka" oninput="dD.ap1=this.value"></div><div><label class="f">Client's approval 1 · jabatan</label><input value="${esc(q.at1||'')}" ${ro?'disabled':''} placeholder="mis. Account Executive" oninput="dD.at1=this.value"></div><div><label class="f">Client's approval 2 · nama</label><input value="${esc(q.ap2||'')}" ${ro?'disabled':''} placeholder="mis. Vera Merdeka" oninput="dD.ap2=this.value"></div><div><label class="f">Client's approval 2 · jabatan</label><input value="${esc(q.at2||'')}" ${ro?'disabled':''} placeholder="mis. Account Executive" oninput="dD.at2=this.value"></div></div><p class="small muted">Nama & jabatan pihak klien yang menyetujui. Tanda tangannya dibubuhkan klien sendiri di kertas / PDF.</p><div class="grid g2 mt"><div><label class="f">Pajak dipotong klien (mengurangi Grand Total)</label><select ${ro?'disabled':''} onchange="dD.pph=this.value;nav()">${S.taxes.map(t=>`<option value="${t.code}" ${(q.pph||'none')===t.code?'selected':''}>${t.label}</option>`).join('')}</select></div><div><label class="f">Prepared by (penyusun penawaran)</label>${combo(S.sellers.map(x=>({v:x.id,l:x.name+' · '+(x.type==='AM'?'Account Management':'Business Development Specialist')})),q.prep||q.seller,"v=>{dD.prep=v;nav()}",'Ketik nama penyusun…',ro,1)}</div></div><label class="small mt8" style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${q.signOn!==false?'checked':''} ${ro?'disabled':''} onchange="dD.signOn=this.checked"> Sertakan tanda tangan digital di PDF (Prepared by & Aulia Nanda, dari Pengaturan → Tanda tangan)</label><div class="totbar"><div><div class="k">HPP · internal</div><div class="v">${fmt(cost)}</div></div><div><div class="k">Laba kotor · internal</div><div class="v">${fmt(tot-cost)} · ${tot?pct((tot-cost)/tot):'—'}</div></div><div><div class="k">Total</div><div class="v big">${fmt(tot)}</div></div>${tx(q.pph||'none').rate?`<div><div class="k">Tax ${pct(tx(q.pph).rate)}</div><div class="v">${fmt(Math.round(tot*tx(q.pph).rate))}</div></div><div><div class="k">Grand Total</div><div class="v big">${fmt(tot-Math.round(tot*tx(q.pph).rate))}</div></div>`:''}</div></div>
 ${vtool([!ro?`<button class="btn p" onclick="saveQuote()">Simpan</button>`:'',q.status==='accepted'?`<button class="btn" onclick="convertQuote('${q.id}')">Proses → Faktur</button>`:'',q.status==='sent'?`<button class="btn" onclick="setQuote('${q.id}','accepted')">Diterima</button><button class="btn" onclick="setQuote('${q.id}','rejected')">Ditolak</button>`:'',q.status==='draft'?`<button class="btn" onclick="setQuote('${q.id}','sent')">Tandai terkirim</button>`:'',`<button class="btn" onclick="showPdf('Penawaran',dD)">Cetak / PDF</button>${!isNew&&['sent','accepted','rejected'].includes(q.status)?`<button class="btn" onclick="resetQuote('${q.id}')">Kembalikan ke draft</button>`:''}${!isNew?`<button class="btn d" onclick="delQuote('${q.id}')">Hapus</button>`:''}`,`<button class="btn" onclick="cancelDoc('quotes')">Batal</button>`])}`};
async function saveQuote(){if(!dD.cust&&!dD.custName){toast('Pelanggan wajib dipilih — kolom Pelanggan di penawaran masih kosong');return}if(dD.id==='new'){const d=dD;let n=null;if(cloudReady){const r=await sb.rpc('next_quote_seq');if(r.error){cloudError(r.error,'Nomor penawaran');return}n=r.data;S.seq.quote=Math.max(S.seq.quote||1,n+1)}d.id='q'+Date.now();d.no=n!=null?quoteNoFmt(d.cust,n):quoteNoTake(d.cust);d.by=me.id;d.byName=me.name;S.quotes.push(d)}else Object.assign(S.quotes.find(q=>q.id===dD.id),dD);save();toast('Penawaran disimpan');finishDoc(location.hash.replace('#',''),'quotes')}
async function setQuote(id,s){if(id==='new'){const d=dD;await saveQuote();if(d.id==='new')return;id=d.id}else Object.assign(S.quotes.find(q=>q.id===id),dD);S.quotes.find(q=>q.id===id).status=s;save();dD=null;toast('Status: '+STL[s][1]);nav()}
function convertQuote(id){const q=S.quotes.find(x=>x.id===id);const c=cu(q.cust);const seq=custSeq(q.cust);const v=inv('v'+Date.now(),'',q.cust,iso(TODAY),iso(addDays(TODAY,tm(c.term).days)),'',c.pph,c.via,q.lines.map(l=>({...l,defer:null})),{seq,quote:q.no,quoteId:q.id});{const ba=lastBA(q.cust);v.bd=ba.bd;v.am=ba.am;v.seller=seq===1?ba.bd:ba.am}S.invoices.push(v);q.status='converted';save();dD=null;toast('Faktur dibuat dari '+q.no);go('invoice/'+v.id)}

/* ---------- FAKTUR PENJUALAN ---------- */
function nextProj(v){const m=ym(iso(addMonths(D(v.date),1)));return{m,ex:S.invoices.find(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===m&&alive(x))}}
function throwNext(id){const v=S.invoices.find(x=>x.id===id);const{m,ex}=nextProj(v);if(ex){toast(mlong(m)+' sudah ada: '+(ex.no||'proyeksi'));return}throwInvoice(v,[1]);logIt('invoice',id,'Dilempar ke proyeksi '+mlong(m));save();toast((v.no||'Proyeksi '+mlong(ym(v.date)))+' → dilempar ke '+mlong(m));nav()}
routes.invoices=function(){const f=listFilter;const all=S.invoices.filter(v=>v.status!=='draft'&&v.status!=='pcancel');const rows=all.map(v=>({v,c:calc(v)})).filter(({v,c})=>(!f.m||ym(v.date)===f.m)&&(!f.c||v.cust===f.c)&&(!f.st||!f.st.length||f.st.includes(c.st))&&(!f.pt||(f.pt==='pt')===!!v.passthrough)&&(!f.ct||(f.ct==='baru')===(v.custType==='baru'))&&(!f.q||(v.no||'').toLowerCase().includes(f.q)||cu(v.cust).name.toLowerCase().includes(f.q))).sort((a,b)=>b.v.date.localeCompare(a.v.date));const months=[...new Set(all.map(v=>ym(v.date)))].sort().reverse();
 return`<div class="top"><div><h1>Faktur Penjualan</h1><p>${all.filter(v=>v.status==='issued').length} faktur · ${all.filter(v=>calc(v).st==='overdue').length} jatuh tempo · <a href="#projection">${S.invoices.filter(v=>v.status==='draft').length} proyeksi belum diterbitkan</a></p></div><div class="flex"><button class="btn" onclick="exportTable(document.querySelector('table.invlist'),'faktur-penjualan.csv')">Ekspor CSV</button><a class="btn" href="#quotes">Ambil dari penawaran</a><a class="btn g" href="#invoice/new">+ Faktur baru</a></div></div>

function addFollow(id){const v=S.invoices.find(x=>x.id===id);const d=document.getElementById('fuD').value,tm=document.getElementById('fuT').value||'00:00',k=document.getElementById('fuK').value,pr=document.getElementById('fuP').value,note=document.getElementById('fuN').value.trim();if(!d){toast('Tanggal tindak lanjut wajib diisi');return}if(k==='promise'&&!pr){toast('Status "Janji bayar" wajib disertai tanggal janji bayarnya');return}const at=new Date(d+'T'+tm).toISOString();(v.followups=v.followups||[]).push({date:d,via:document.getElementById('fuV').value,kind:k,promise:k==='promise'?pr:'',note,by:me.name,at});v.collStatus=KIND_ST[k]||'reminded';v.promise=k==='promise'?pr:'';v.collStatusAt=d;v.collStatusTm=at;v.collStatusBy=me.name;if(note){v.collNote=note;v.collNoteAt=d;v.collNoteTm=at;v.collNoteBy=me.name}logIt('invoice',id,'Penagihan · '+KIND_L[k]+(note?' — '+note.slice(0,80):''));save();if(dD&&dD.id===id){dD.followups=v.followups;dD.collStatus=v.collStatus;dD.promise=v.promise;dD.collStatusAt=v.collStatusAt;dD.collStatusTm=v.collStatusTm;dD.collStatusBy=v.collStatusBy;dD.collNote=v.collNote}closeModal();toast('Penagihan dicatat — status: '+COLL_ST[v.collStatus][1]);nav()}
function restoreRev(id,k){const v=S.invoices.find(x=>x.id===id);const r=v.revisions[k];if(!confirm('Pulihkan faktur ke versi '+dstr(r.t)+'? Versi sekarang ikut disimpan sebagai riwayat.'))return;const snap=JSON.parse(JSON.stringify(v));delete snap.revisions;v.revisions.push({t:iso(TODAY),who:me.name,snap});['lines','disc','addon','notes','date','due','pph','via','seller','custType','po','comm'].forEach(k2=>v[k2]=JSON.parse(JSON.stringify(r.snap[k2])));logIt('invoice',id,'Dipulihkan ke versi '+dstr(r.t)+' · total '+fmt(calc(v).total));save();dD=null;toast('Versi dipulihkan');nav()}

function syncReceiptsPph(id,oldT,newT,total){const rate=(tx(newT)||{}).rate||0,full=Math.round(total*rate);const rcs=S.receipts.filter(r=>r.status!=='void'&&r.lines.some(l=>l.inv===id)).sort((a,b)=>a.date.localeCompare(b.date));if(!rcs.length||oldT===newT)return{n:0,locked:0};let n=0,locked=0,left=full;rcs.forEach(r=>{if(S.periods[ym(r.date)]==='locked'){locked++;return}r.lines.forEach(l=>{if(l.inv!==id)return;const base=(+l.cash||0)-(+l.over||0)+(+l.pph||0)+(+l.disc||0)+(+l.credit||0);const hadP=(+l.pph||0)>0;l.pphType=newT;if(hadP||!rate){const np=rate?Math.min(left,Math.max(0,base)):0;if(np!==(+l.pph||0)){l.pph=np;n++}left-=np;if(!rate)l.bukti=''}});});return{n,locked}}
function saveInvoice(){if(!dD.cust){toast('Pelanggan wajib dipilih — kolom Pelanggan di faktur masih kosong');return}{const e=invCheck(dD);if(e){toast(e);return}}const isNew=dD.id==='new';{const o0=isNew?null:S.invoices.find(v=>v.id===dD.id);if(plock(dD.date,o0&&o0.date))return}if(isNew){dD.id='v'+Date.now();S.invoices.push(dD)}else{const old=S.invoices.find(v=>v.id===dD.id);const before=calc(old).total;if(old.status==='issued'){const snap=JSON.parse(JSON.stringify(old));delete snap.revisions;(old.revisions=old.revisions||[]).push({t:iso(TODAY),who:me.name,snap})}const _oT=old.pph||'none';Object.assign(old,dD);let _sy=null;if(old.status==='issued'&&(old.pph||'none')!==_oT){_sy=syncReceiptsPph(old.id,_oT,old.pph||'none',calc(old).total);if(_sy.n||_sy.locked)logIt('invoice',old.id,'PPh faktur diubah '+tx(_oT).label+' → '+tx(old.pph||'none').label+' · penerimaan ikut disesuaikan ('+_sy.n+' baris'+(_sy.locked?', '+_sy.locked+' penerimaan di periode terkunci tidak diubah':'')+')')}const c=calc(old);if(_sy&&(_sy.n||_sy.locked))toast('PPh faktur diubah · '+_sy.n+' baris penerimaan ikut disesuaikan'+(_sy.locked?' · '+_sy.locked+' di periode terkunci tidak diubah':''));if(old.status==='issued'){if(before!==c.total)logIt('invoice',old.id,'Total diubah '+fmt(before)+' → '+fmt(c.total));if(c.rem<0){const over=-c.rem;cu(old.cust).credit=(cu(old.cust).credit||0)+over;logIt('invoice',old.id,'Lebih bayar '+fmt(over)+' → uang muka pelanggan');toast('Disimpan · lebih bayar '+fmt(over)+' jadi uang muka pelanggan')}else toast('Perubahan disimpan')}else toast('Proyeksi disimpan')}save();const id=dD.id;const wasNew=isNew;finishDoc(wasNew?'invoice/new':'invoice/'+id,S.invoices.find(v=>v.id===id).status==='issued'?'invoices':'projection')}
function lockMsg(d,short){const en=LANG()==='en';const m=en?D(ym(d)+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'}):mlong(ym(d));return en?'Period '+m+' is locked'+(short?'':' — cannot be changed'):'Periode '+m+' sudah dikunci'+(short?'':' — tidak bisa diubah')}

function restoreRcRev(id,k){const r=S.receipts.find(x=>x.id===id);const x=r.revisions[k];if(!confirm('Pulihkan penerimaan ke versi '+dstr(x.t)+'?'))return;const snap=JSON.parse(JSON.stringify(r));delete snap.revisions;r.revisions.push({t:iso(TODAY),who:me.name,snap});['lines','date','bank','method','ref','note','cust'].forEach(k2=>r[k2]=JSON.parse(JSON.stringify(x.snap[k2])));logIt('receipt',id,'Dipulihkan ke versi '+dstr(x.t));r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' dipulihkan ke versi '+dstr(x.t)));save();dD=null;toast('Versi dipulihkan');nav()}
function distribRc(amt){let left=amt;dD.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);const room=Math.max(0,rcBefore(dD,v)-(+l.pph||0)-(+l.disc||0)-(+l.credit||0));l.cash=Math.min(room,left);left-=l.cash});if(left>0&&dD.lines.length){dD.lines[dD.lines.length-1].cash+=left;toast('Kelebihan '+fmt(left)+' akan jadi uang muka pelanggan')}nav()}
function pphMismatch(ln,base,v){const rate=tx(ln.pphType).rate;if(!rate)return 0;const expect=(v&&ln.pphType===(v.pph||'none'))?Math.min(pphLeft(dD,v),base):Math.round(base*rate);return Math.abs(expect-(+ln.pph||0))>1?expect:0}
function addRcLine(v){const rem=rcBefore(dD,v);const pph=Math.min(pphLeft(dD,v),rem);dD.lines.push({inv:v.id,cash:0,pphType:v.pph||'none',pph:pph,bukti:'',disc:0,credit:0})}
function toggleRc(vid,on){if(on){addRcLine(S.invoices.find(v=>v.id===vid))}else dD.lines=dD.lines.filter(l=>l.inv!==vid);nav()}
function setRc(vid,k,val){const l=dD.lines.find(x=>x.inv===vid);if(k==='bukti'||k==='pphType')l[k]=val;else l[k]=num(val);if(k==='cash'&&dD.amt!==undefined)dD.amt=dD.lines.reduce((a,x)=>a+(+x.cash||0),0);if(k==='pphType'){const v=S.invoices.find(x=>x.id===vid);const before=rcBefore(dD,v);l.pph=val===(v.pph||'none')?Math.min(pphLeft(dD,v),before):Math.round(before*tx(val).rate);l.cash=before-l.pph-(+l.disc||0)-(+l.credit||0)}if(k!=='bukti')nav()}
function saveReceipt(){const r=dD;if(!r.lines.length){toast('Belum ada faktur yang dibayar — centang minimal satu faktur di daftar');return}if(S.periods[ym(r.date)]==='locked'){toast(lockMsg(r.date,1));return}for(const l of r.lines){const v=S.invoices.find(x=>x.id===l.inv);if(v&&r.date<v.date){toast('Tanggal bayar tidak boleh sebelum tanggal faktur '+v.no);return}if((+l.cash||0)+(+l.pph||0)+(+l.disc||0)+(+l.credit||0)<=0){toast('Faktur '+(v?v.no:'')+': kas, PPh, potongan, dan kredit semuanya 0 — isi nominal, atau hilangkan centang fakturnya');return}if(v&&(v.pph||'none')!=='none'&&pphLeft(r,v)>0&&!((+l.pph||0)>0)){toast('Faktur '+v.no+' kena '+tx(v.pph).label+' — nominal PPh wajib diisi (seharusnya '+fmt(Math.min(pphLeft(r,v),rcBefore(r,v)))+'). Kalau klien tidak memotong, ubah Jenis PPh di baris itu menjadi "Tidak dipotong"');return}}
 if(r.amt!==undefined){const dist=r.lines.reduce((a,l)=>a+(+l.cash||0),0);if(!(+r.amt>0)){toast('Isi Nilai pembayaran, lalu klik Distribusi');return}if(Math.round(dist)!==Math.round(+r.amt)){toast('Nilai pembayaran '+fmt(r.amt)+' belum sama dengan yang dibagikan ke faktur ('+fmt(dist)+'). Klik Distribusi dulu.');return}}
 r.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);const ex=(+l.cash||0)+(+l.pph||0)+(+l.disc||0)+(+l.credit||0)-rcBefore(r,v);l.over=Math.max(0,Math.min(+l.cash||0,ex))});
 const isNew=r.id==='new';if(!isNew){const o0=S.receipts.find(x=>x.id===r.id);if(o0&&o0.status!=='void')rcCreditFx(o0,-1)}
 if(isNew){r.id='r'+Date.now();r.no=nextNo('receipt');S.receipts.push(r)}else{const old=S.receipts.find(x=>x.id===r.id);const snap=JSON.parse(JSON.stringify(old));delete snap.revisions;(old.revisions=old.revisions||[]).push({t:iso(TODAY),who:me.name,snap});r.revisions=old.revisions;Object.assign(old,r)}
 rcCreditFx(r,1);const over=r.lines.reduce((a,l)=>a+(+l.over||0),0);
 r.lines.forEach(l=>logIt('invoice',l.inv,'Pembayaran '+r.no+' · kas '+fmt(l.cash)+(l.pph?' · PPh '+fmt(l.pph):'')));logIt('receipt',r.id,(isNew?'Dibuat':'Diubah')+' '+r.no);save();const nobp=r.lines.some(l=>(+l.pph||0)>0&&!(l.bukti||'').trim());const selfTax=r.lines.reduce((a,l)=>{const v=S.invoices.find(x=>x.id===l.inv);return a+(v?pphInfo(v).out:0)},0);toast((isNew?'Penerimaan '+r.no+' disimpan':'Disimpan')+(over?' · lebih bayar '+fmt(over)+' jadi uang muka':'')+(nobp?' · bupot belum diperiksa, ditandai di Rekap PPh':'')+(selfTax>0?' · klien bayar penuh: PPh '+fmt(selfTax)+' tidak dipotong (tercatat di Monitoring PPh)':''));rcOpen={};finishDoc(location.hash.replace('#',''),'receipts')}

routes.creditnotes=function(){return`<div class="top"><div><h1>Nota Kredit</h1><p>Pengurangan nilai faktur yang sudah terbit (revisi setelah dibayar, pembatalan sebagian)</p></div><div class="flex"><button class="btn" onclick="exportTable(document.querySelector('table.cnlist'),'nota-kredit.csv')">Ekspor CSV</button><a class="btn p" href="#creditnote/new">Nota kredit baru</a></div></div><div class="card flush"><div class="tw"><table class="cnlist"><thead><tr><th>Nomor</th><th>Tanggal</th><th>Faktur</th><th>Pelanggan</th><th>Alasan</th><th class="num">Nilai</th><th>Status</th></tr></thead><tbody>${S.creditNotes.length?S.creditNotes.map(n=>{const v=S.invoices.find(x=>x.id===n.inv)||{};return`<tr class="row" onclick="go('creditnote/${n.id}')"><td class="mono">${n.no}</td><td>${dstr(n.date)}</td><td class="mono">${v.no||'—'}</td><td>${cu(v.cust).name}</td><td>${esc(n.reason)}</td><td class="num">${fmt(n.amount)}</td><td>${n.status==='void'?'<span class="st r">Dibatalkan</span>':'<span class="st g">Aktif</span>'}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Belum ada</td></tr>'}</tbody></table></div></div>`};
routes.creditnote=function(arg){const[id,qs]=arg.split('?');const isNew=id==='new';if(!dD||dD.id!==id){const pre=new URLSearchParams(qs||'');dD=isNew?{id:'new',no:'CN.'+TODAY.getFullYear()+'.'+pad(TODAY.getMonth()+1)+'.'+String(S.seq.cn).padStart(4,'0'),inv:pre.get('inv')||'',date:iso(TODAY),amount:0,reason:'',refund:false}:JSON.parse(JSON.stringify(S.creditNotes.find(n=>n.id===id)))}const n=dD;const v=S.invoices.find(x=>x.id===n.inv);const c=v?calc(v):null;
 return`<div class="top"><div><h1>${isNew?'Nota kredit baru':n.no}</h1><p>Mengurangi nilai terutang faktur. Kalau faktur sudah lunas, selisih menjadi uang muka pelanggan atau dikembalikan.</p></div></div><div class="card" style="max-width:760px"><div class="doc-head"><div><div class="row"><label>Faktur <b>*</b></label>${combo(S.invoices.filter(x=>x.status==='issued'||x.id===n.inv).map(x=>({v:x.id,l:x.no+' · '+cu(x.cust).name+' · '+fmtS(calc(x).total)})),n.inv,"v=>{dD.inv=v;nav()}",'Ketik no. faktur / pelanggan…',!isNew,0)}</div><div class="row"><label>Nilai <b>*</b></label><input type="text" inputmode="numeric" oninput="fmtLive(this)" value="${fmtN(n.amount||'')}" onchange="dD.amount=num(this.value);nav()"></div></div><div><div class="row"><label>Nomor</label><input value="${n.no}" disabled></div><div class="row"><label>Tanggal</label><input type="date" value="${n.date}" onchange="dD.date=this.value"></div></div></div><div class="field"><label class="f">Alasan</label><input value="${esc(n.reason)}" placeholder="mis. revisi scope setelah invoice terbit" oninput="dD.reason=this.value"></div>${c?`<div class="kv"><span>Total faktur</span><span>${fmt(c.total)}</span><span>Sudah dibayar</span><span>${fmt(c.paid)}</span><span>Sisa setelah nota kredit</span><span>${fmt(c.total-(isNew?n.amount:0)-c.paid+(isNew?0:0))}</span></div>${n.amount+cnUsed(n.inv)>c.total?`<div class="note r mt">Nilai nota kredit melebihi nilai faktur. Maksimal ${fmt(c.total-cnUsed(n.inv))}${cnUsed(n.inv)?' (sudah ada nota kredit lain '+fmt(cnUsed(n.inv))+')':''}.</div>`:''}${isNew&&n.amount>c.rem&&c.rem>=0?`<div class="note a mt">Nilai nota kredit melebihi sisa piutang. Kelebihan ${fmt(n.amount-c.rem)} akan menjadi <b>uang muka pelanggan</b>.</div>`:''}`:''}</div>${vtool([isNew?`<button class="btn p" ${can('pay')?'':'disabled'} onclick="saveCN()">Simpan</button>`:'',!isNew&&n.status!=='void'&&can('pay')?`<button class="btn p" onclick="saveCN()">Simpan</button><button class="btn d" onclick="voidCN('${n.id}')">Batalkan</button><button class="btn d" onclick="delCN('${n.id}')">Hapus</button>`:'',!isNew&&n.status==='void'?`<button class="btn" onclick="unvoidCN('${n.id}')">Aktifkan kembali</button><button class="btn d" onclick="delCN('${n.id}')">Hapus permanen</button><span class="l" style="color:var(--red)">Dibatalkan · ${esc(n.voidReason||'')}</span>`:'',`<button class="btn" onclick="cancelDoc('creditnotes')">${n.status==='void'?'Tutup':'Batal'}</button>`])}`};
function cnUsed(id){return S.creditNotes.filter(x=>x.inv===id&&x.status!=='void'&&!(dD&&x.id===dD.id)).reduce((a,x)=>a+(+x.amount||0),0)}
function cnBase(v){return calc(v).total}
function saveCN(){const n=dD;{const o0=n.id==='new'?null:S.creditNotes.find(x=>x.id===n.id);if(plock(n.date,o0&&o0.date))return}if(n.id!=='new'){const o=S.creditNotes.find(x=>x.id===n.id);const v=S.invoices.find(x=>x.id===n.inv);if(!o||!v)return;if(!(+n.amount>0)){toast('Nilai nota kredit wajib diisi dan harus lebih dari 0');return}if(!n.reason.trim()){toast('Alasan nota kredit wajib diisi — kolom Alasan masih kosong');return}if(n.amount+cnUsed(v.id)>cnBase(v)){toast('Nota kredit melebihi nilai faktur (maks '+fmt(cnBase(v)-cnUsed(v.id))+')');return}const b=calc(v).rem;const old=o.amount;o.amount=+n.amount;o.date=n.date;o.reason=n.reason;const d=Math.max(0,-calc(v).rem)-Math.max(0,-b);if(d){const c=cu(v.cust);c.credit=Math.max(0,(c.credit||0)+d)}logIt('invoice',v.id,'Nota kredit '+o.no+' diubah · '+fmt(old)+' → '+fmt(o.amount));save();toast('Nota kredit disimpan');finishDoc(location.hash.replace('#',''),'creditnotes');return}if(!n.inv){toast('Faktur wajib dipilih — ketik no. faktur atau nama pelanggan di kolom Faktur');return}if(!n.amount||!n.inv){toast('Nilai nota kredit wajib diisi dan harus lebih dari 0');return}const v=S.invoices.find(x=>x.id===n.inv);if(n.amount+cnUsed(v.id)>cnBase(v)){toast('Nota kredit melebihi nilai faktur (maks '+fmt(cnBase(v)-cnUsed(v.id))+')');return}if(!n.reason.trim()){toast('Alasan nota kredit wajib diisi — kolom Alasan masih kosong');return}const before=calc(v);n.id='n'+Date.now();n.no=nextNo('cn');S.creditNotes.push(n);const after=calc(v);if(after.rem<0){cu(v.cust).credit=(cu(v.cust).credit||0)+(-after.rem)}logIt('invoice',v.id,'Nota kredit '+n.no+' '+fmt(n.amount)+' · '+n.reason);save();toast('Nota kredit '+n.no+' disimpan');finishDoc(location.hash.replace('#',''),'creditnotes')}

function commAlloc(sellerId){const vs=S.invoices.filter(v=>v.status==='issued'&&v.comm.on&&v.comm.approved&&v.seller===sellerId).sort((a,b)=>a.date.localeCompare(b.date));const out={};vs.forEach(v=>out[v.id]={amt:calc(v).comm.amount,paid:0});let pool=0;S.commPayments.filter(p=>p.seller===sellerId).forEach(p=>{if(p.alloc&&p.alloc.length)p.alloc.forEach(a=>{if(out[a.inv])out[a.inv].paid+=a.amt});else pool+=p.amount});vs.forEach(v=>{const o=out[v.id];const use=Math.min(Math.max(0,o.amt-o.paid),pool);o.paid+=use;pool-=use});Object.values(out).forEach(o=>o.st=o.paid>=o.amt?'paid':o.paid>0?'partial':'unpaid');return out}

function commRows(){const al={};new Set([...S.sellers.map(s=>s.id),...S.invoices.map(v=>v.seller),...S.commPayments.map(p=>p.seller)].filter(Boolean)).forEach(id=>al[id]=commAlloc(id));return S.invoices.filter(v=>v.status==='issued'&&v.comm.on&&!v.passthrough).map(v=>{const c=calc(v);const a=(al[v.seller]||{})[v.id];const amt=c.comm.amount,paid=a?a.paid:0;const st=!v.comm.approved?'pending':paid>=amt?'paid':paid>0?'partial':'unpaid';return{v,c,amt,paid,rem:v.comm.approved?amt-paid:0,st,cl:c.total?Math.min(1,c.paid/c.total):0}}).sort((a,b)=>b.v.date.localeCompare(a.v.date))}

 const ppl=S.sellers.map(s=>{const rs=all.filter(r=>r.v.seller===s.id);return{s,n:rs.length,pend:rs.filter(r=>r.st==='pending').reduce((a,r)=>a+r.amt,0),acc:rs.filter(r=>r.st!=='pending').reduce((a,r)=>a+r.amt,0),paid:rs.reduce((a,r)=>a+r.paid,0),due:rs.reduce((a,r)=>a+r.rem,0),ready:rs.filter(r=>r.st!=='pending'&&r.cl>=1).reduce((a,r)=>a+r.rem,0)}});
 return`<div class="top"><div><h1>Monitoring Komisi</h1><p>Komisi terbentuk saat faktur terbit → <b>disetujui</b> Master/Finance → menjadi <b>piutang komisi penjual</b> (hutang perusahaan) → <b>dibayar</b>. Pilih faktur, lalu bayar.</p></div><div class="flex"><a class="btn" href="#report/commdebt">Laporan hutang komisi</a><button class="btn g" onclick="${cmF.seller?`payCommModal('${cmF.seller}',[])`:'payCommStart()'}">+ Bayar komisi</button></div></div>
 <div class="grid g4 mb"><div class="card kpi"><p class="lbl">Komisi terbentuk</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();cmTab='all';nav()">${fmtS(tot)}</a></div><div class="d">${rows.length} faktur${cmF.seller||cmF.m?' · sesuai filter':''}</div></div><div class="card kpi"><p class="lbl">Menunggu persetujuan</p><div class="v" style="color:var(--amber)"><a href="#" style="color:inherit" onclick="event.preventDefault();cmTab='pending';nav()">${fmtS(pend)}</a></div><div class="d">${by('pending').length} faktur · belum jadi hutang</div></div><div class="card kpi"><p class="lbl">Piutang komisi penjual (belum dibayar)</p><div class="v" style="color:var(--red)"><a href="#" style="color:inherit" onclick="event.preventDefault();cmTab='unpaid';nav()">${fmtS(due)}</a></div><div class="d">${by('unpaid').length} belum · ${by('partial').length} sebagian</div></div><div class="card kpi"><p class="lbl">Sudah dibayar</p><div class="v" style="color:var(--green)"><a href="#commpays" style="color:inherit">${fmtS(paid)}</a></div><div class="d">${S.commPayments.filter(p=>p.status!=='void').length} pembayaran · <a href="#commpays">riwayat</a></div></div></div>

 <div class="tabs">${[['all','Semua',rows.length],['pending','Menunggu persetujuan',by('pending').length],['unpaid','Belum dibayar',by('unpaid').length],['partial','Sebagian',by('partial').length],['paid','Sudah dibayar',by('paid').length],['hist','Riwayat pembayaran',S.commPayments.length]].map(t=>`<button class="${cmTab===t[0]?'on':''}" onclick="cmTab='${t[0]}';nav()">${t[1]}<span>${t[2]}</span></button>`).join('')}</div>

"btn s g" onclick="payCommModal('${v.seller}',['${v.id}'])">Bayar</button>`:'<span class="small muted">menunggu klien lunas</span>'):''}${v.comm.approved&&r.paid===0&&can('pay')?`<button class="btn q s" onclick="unapproveComm('${v.id}')">Batalkan persetujuan</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="14" class="empty">Kosong</td></tr>'}</tbody></table></div></div>`}`};

function payCommSave(sellerId){if(!document.getElementById('cpD').value){toast('Tanggal bayar wajib diisi');return}if(plock(document.getElementById('cpD').value))return;const alloc=[];let warn=false;document.querySelectorAll('.cpC:checked').forEach(c=>{const a=document.querySelector('.cpA[data-inv="'+c.dataset.inv+'"]');const amt=Math.round(+a.value||0);if(amt>0){if(amt>+a.max+0.5){toast('Nominal melebihi sisa komisi');throw new Error('over')}alloc.push({inv:c.dataset.inv,amt});const v=S.invoices.find(x=>x.id===c.dataset.inv);if(calc(v).rem>0)warn=true}});if(!alloc.length){toast('Belum ada faktur yang dibayar — centang faktur dan isi nominal lebih dari 0');return}if(warn){toast('Komisi hanya bisa dibayar setelah klien lunas');return}const amount=alloc.reduce((s,a)=>s+a.amt,0);S.commPayments.push({id:'cp'+Date.now(),date:document.getElementById('cpD').value,seller:sellerId,amount,ref:document.getElementById('cpR').value,bankId:document.getElementById('cpB').value,bank:document.getElementById('cpB').selectedOptions[0].textContent,alloc});alloc.forEach(a=>logIt('invoice',a.inv,'Komisi dibayar '+fmt(a.amt)+' ke '+se(sellerId).name));logIt('commission',sellerId,'Bayar komisi '+fmt(amount));save();closeModal();cmSel={};toast('Komisi '+fmt(amount)+' dibayar ke '+se(sellerId).name);nav()}

function cashProj(from,to,tiers){tiers=tiers||{received:true,issued:true,draft:true};const out=[];if(tiers.received)S.receipts.filter(r=>r.status!=='void').forEach(r=>r.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);out.push({tier:'received',date:r.date,amount:(+l.cash||0),label:r.no+' · '+((v||{}).no||''),who:cu(r.cust).name,id:v?v.id:null,rid:r.id})}));S.invoices.forEach(v=>{if(v.status==='issued'&&tiers.issued){const c=calc(v);if(c.rem<=0||v.hold)return;const d=D(v.expect||v.due);out.push({tier:'issued',date:iso(d<TODAY?addDays(TODAY,7):d),amount:c.rem*(1-tx(v.pph).rate),label:v.no,who:cu(v.cust).name,id:v.id})}else if(v.status==='draft'&&tiers.draft){const c=calc(v);const d=D(v.due);out.push({tier:'draft',date:iso(d<TODAY?addDays(TODAY,7):d),amount:c.total*(1-tx(v.pph).rate),label:'Proyeksi · '+mlabel(ym(v.date)),who:cu(v.cust).name,id:v.id})}});return out.filter(p=>p.date>=from&&p.date<=to).sort((a,b)=>a.date.localeCompare(b.date))}
function buckets(o){const ks=[];if(o.gran==='month'){let d=D(o.from.slice(0,7)+'-01');const end=D(o.to);while(d<=end){ks.push(ym(iso(d)));d=new Date(d.getFullYear(),d.getMonth()+1,1)}}else if(o.gran==='week'){let d=D(o.from);d.setDate(d.getDate()-((d.getDay()+6)%7));const end=D(o.to);while(d<=end){ks.push(iso(d));d=addDays(d,7)}}else{let d=D(o.from);const end=D(o.to);while(d<=end){ks.push(iso(d));d=addDays(d,1)}}return ks}
function keyOf(date,o){if(o.gran==='month')return ym(date);if(o.gran==='week'){const d=D(date);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}return date}

function chart(o){const ks=buckets(o),data=cashProj(o.from,o.to,o.tiers||tiers),by={};ks.forEach(k=>by[k]={received:0,issued:0,draft:0,items:[]});data.forEach(p=>{const k=keyOf(p.date,o);if(by[k]){by[k][p.tier]+=p.amount;by[k].items.push(p)}});chartData=by;const max=Math.max(1,...ks.map(k=>by[k].received+by[k].issued+by[k].draft));const W=o.compact?640:900,H=o.compact?210:300,L=64,B=26,T=16,pw=W-L-16,ph=H-T-B,n=ks.length,slot=pw/n,bw=Math.max(2,Math.min(28,slot*.62));let g='';for(let k=0;k<=3;k++){const y=T+ph-ph*k/3;g+=`<line class="grid" x1="${L}" x2="${W-16}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmtS(max*k/3)}</text>`}let bars='';const every=n>40?Math.ceil(n/12):n>14?Math.ceil(n/8):1;ks.forEach((k,i)=>{const x=L+slot*i+(slot-bw)/2;let y=T+ph;[['received',TIER.received[1]],['issued',TIER.issued[1]],['draft',TIER.draft[1]]].forEach(([t,col])=>{const v=by[k][t];if(!v)return;const h=ph*v/max;y-=h;bars+=`<rect class="bar ${selKey===k?'sel':''}" x="${x}" y="${y+1}" width="${bw}" height="${Math.max(0,h-2)}" rx="${Math.min(4,bw/2)}" fill="${col}" onmousemove="showTip(event,'${k}','${o.gran}')" onmouseleave="hideTip()" onclick="barClick('${k}','${o.gran}')"/>`});bars+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" onmousemove="showTip(event,'${k}','${o.gran}')" onmouseleave="hideTip()" onclick="barClick('${k}','${o.gran}')" style="cursor:pointer"/>`;const tot=by[k].received+by[k].issued+by[k].draft;if(tot&&(n<=14||slot>40))bars+=`<text class="lbl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtS(tot)}</text>`;if(i%every===0)bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${o.gran==='month'?mlabel(k):D(k).toLocaleDateString(LOC(),{day:'numeric',month:'short'})}</text>`});return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${bars}</svg><div class="legend mt">${['received','issued','draft'].map(k=>`<span><i style="background:${TIER[k][1]}"></i>${TIER[k][0]}</spa function sgCtx(){const c=document.getElementById('sgcv');return c&&c.getContext('2d')}
function sgPos(ev){const c=ev.target.getBoundingClientRect();return[(ev.clientX-c.left)*640/c.width,(ev.clientY-c.top)*240/c.height]}
function sgDown(ev){const x=sgCtx();if(!x)return;ev.target.setPointerCapture&&ev.target.setPointerCapture(ev.pointerId);sgDrawing=true;sgInk=true;const[a,b]=sgPos(ev);x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()}
function sgMove(ev){if(!sgDrawing)return;const x=sgCtx();const[a,b]=sgPos(ev);x.lineTo(a,b);x.stroke()}
function sgUp(){if(sgDrawing){sgDrawing=false;sgPreview()}}
function sgPreview(){const n=document.getElementById('sgpvn'),t=document.getElementById('sgpvt');if(n&&sgEdit)n.textContent=sgEdit.name||'Nama';if(t&&sgEdit)t.textContent=sgEdit.title||'Jabatan'}
function sgClear(){const x=sgCtx();if(x)x.clearRect(0,0,640,240);sgInk=false;if(sgEdit)sgEdit.img='';sgPreview()}
function sgLoad(im){const x=sgCtx();if(!x)return;x.clearRect(0,0,640,240);const r=Math.min(640/im.naturalWidth,240/im.naturalHeight);const w=im.naturalWidth*r,h=im.naturalHeight*r;x.drawImage(im,(640-w)/2,(240-h)/2,w,h);sgInk=true;sgPreview()}
function sgUpload(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>sgLoad(im);im.src=rd.result};rd.readAsDataURL(f)}
function sgTrim(c){const x=c.getContext('2d'),W=c.width,H=c.height,d=x.getImageData(0,0,W,H).data;let a=W,b=H,e=0,f=0;for(let j=0;j<H;j++)for(let i=0;i<W;i++){if(d[(j*W+i)*4+3]>8){if(i<a)a=i;if(i>e)e=i;if(j<b)b=j;if(j>f)f=j}}if(e<a||f<b)return c.toDataURL('image/png');const m=6;a=Math.max(0,a-m);b=Math.max(0,b-m);e=Math.min(W-1,e+m);f=Math.min(H-1,f+m);const t=document.createElement('canvas');t.width=e-a+1;t.height=f-b+1;t.getContext('2d').drawImage(c,a,b,t.width,t.height,0,0,t.width,t.height);return t.toDataURL('image/png')}

/* ---------- grafik batang generik: klik batang → sumber data ---------- */
function miniChart(keys,series,labelFn){const W=900,H=220,L=64,B=26,T=16,pw=W-L-16,ph=H-T-B,n=keys.length,slot=pw/n,bw=Math.max(2,Math.min(34,slot*.62));const tot=k=>series.reduce((s,sr)=>s+(sr.v[k]||0),0);const max=Math.max(1,...keys.map(tot));let g='';for(let i=0;i<=3;i++){const y=T+ph-ph*i/3;g+=`<line class="grid" x1="${L}" x2="${W-16}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmtS(max*i/3)}</text>`}let bars='';keys.forEach((k,i)=>{const x=L+slot*i+(slot-bw)/2;let y=T+ph;series.forEach(sr=>{const v=sr.v[k]||0;if(!v)return;const h=ph*v/max;y-=h;bars+=`<rect class="bar" x="${x}" y="${y+1}" width="${bw}" height="${Math.max(0,h-2)}" rx="4" fill="${sr.color}" onclick="${sr.click.replace('{k}',k)}"><title>${esc(sr.name)} · ${labelFn(k)} · ${fmt(v)} — klik untuk rincian</title></rect>`});if(tot(k))bars+=`<text class="lbl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtS(tot(k))}</text>`;bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${labelFn(k)}</text>`});return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${bars}</svg><div class="legend mt">${series.map(sr=>`<span><i style="background:${sr.color}"></i>${sr.name}</span>`).join('')}<span class="muted">· klik batang untuk melihat sumber data</span></div>`}

 <div class="card flush mb"><h2>Matriks pelanggan × bulan</h2><p class="small muted" style="padding:0 24px 10px">Hijau = faktur terbit · abu = proyeksi (bisa ◀ ▶ geser, ✎ edit, ✕ batalkan, ⇢ lempar ke bulan berikutnya, ✓ terbitkan) · kosong = belum ada.</p><div class="tw"><table class="pjm"><thead><tr><th>Pelanggan</th>${months.map(m=>`<th class="num">${mlabel(m)}</th>`).join('')}<th class="num">Total proyeksi</th></tr></thead><tbody>${custs.map(c=>`<tr><td><a href="#customer/${c.id}">${esc(c.name)}</a><span class="sub">${se(lastBA(c.id).am).name} · AM</span></td>${months.map((m,i)=>{const vs=cell(c,m);if(!vs.length){if(acc){const from=S.invoices.filter(v=>v.cust===c.id&&(v.status==='issued'||v.status==='draft')&&accByMonth(v)[m]);if(from.length)return`<td class="num pjc">${from.map(v=>`<a class="pj ${v.status==='issued'?'iss':'drf'}" href="#invoice/${v.id}" style="opacity:.75"><b>${fmtS(accByMonth(v)[m])}</b><span>diakui dari ${v.no||'proyeksi'} ${mlabel(ym(v.date))}</span></a>`).join('')}</td>`}const prev=i>0?cell(c,months[i-1]).find(v=>alive(v)):S.invoices.filter(v=>v.cust===c.id&&ym(v.date)===ym(iso(addMonths(D(m+'-01'),-1)))&&alive(v))[0];return`<td class="num pjc empty2">${prev?`<button class="btn q s" title="Lempar ${prev.no||'proyeksi'} ke ${mlong(m)}" onclick="throwNext('${prev.id}')">⇢ lempar</button>`:'<span class="muted">—</span>'}</td>`}return`<td class="num pjc">${acc?S.invoices.filter(v=>v.cust===c.id&&(v.status==='issued'||v.status==='draft')&&accByMonth(v)[m]&&ym(v.date)!==m).map(v=>`<a class="pj ${v.status==='issued'?'iss':'drf'}" href="#invoice/${v.id}" style="opacity:.75"><b>${fmtS(accByMonth(v)[m])}</b><span>diakui dari ${v.no||'proyeksi'} ${mlabel(ym(v.date))}</span></a>`).join(''):''}${vs.map(v=>{const c2=calc(v);const amt=acc?(accByMonth(v)[m]||0):c2.total;return v.status==='issued'?`<a class="pj iss" href="#invoice/${v.id}" title="${v.no} · ${STL[c2.st][1]}"><b>${fmtS(amt)}</b><span>${v.no}${acc&&amt!==c2.total?' · diakui dari '+fmtS(c2.total):''}</span></a>`:`<div class="pj drf"><b><a href="#invoice/${v.id}" style="color:inherit">${fmtS(amt)}</a></b><span>proyeksi${D(v.date)<TODAY?' · <em style="color:var(--red)">lewat</em>':''}</span><span class="acts"><button title="Geser ke bulan sebelumnya" onclick="shiftDraftBy('${v.id}',-1)">◀</button><button title="Geser ke bulan berikutnya" onclick="shiftDraftBy('${v.id}',1)">▶</button><a title="Edit proyeksi" href="#invoice/${v.id}">✎</a><button title="Lempar ke bulan berikutnya" onclick="throwNext('${v.id}')">⇢</button><a title="Terbitkan" href="#invoice/${v.id}" style="color:var(--green)">✓</a><button title="Batalkan lemparan" class="d" onclick="delDraft('${v.id}')">✕</button></span></div>`}).join('')}</td>`}).join('')}<td class="num" style="font-weight:500">${fmt(months.reduce((s,m)=>s+cell(c,m).filter(v=>v.status==='draft').reduce((a,v)=>a+calc(v).total,0),0))}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total proyeksi</td>${months.map(m=>dcell(fmtS(vD[m]),`pjDrill('${m}','draft')`)).join('')}<td class="num">${fmt(months.reduce((s,m)=>s+vD[m],0))}</td></tr><tr><td>Total terbit</td>${months.map(m=>dcell(fmtS(vI[m]),`pjDrill('${m}','issued')`)).join('')}<td class="num">${fmt(months.reduce((s,m)=>s+vI[m],0))}</td></tr></tfoot></table></div></div>
 <div class="card flush"><h2>Daftar proyeksi</h2><div class="tw"><table><thead><tr><th>Bulan</th><th>Tanggal</th><th>Pelanggan</th><th>Lemparan dari</th><th>Isi</th><th class="num">Total</th><th>Status</th><th>Berikutnya</th><th></th></tr></thead><tbody>${drafts.length?drafts.sort((a,b)=>a.date.localeCompare(b.date)).map(v=>{const np=nextProj(v);const par=S.invoices.find(x=>x.id===v.parent);return`<tr><td>${mlong(ym(v.date))}</td><td>${dstr(v.date)}</td><td>${cu(v.cust).name}</td><td class="mono">${par?`<a href="#invoice/${par.id}">${par.no||'proyeksi '+mlabel(ym(par.date))}</a>`:'manual'}</td><td style="white-space:normal">${v.lines.map(l=>esc(l.name)).join(', ')}</td><td class="num">${fmt(calc(v).total)}</td><td>${D(v.date)<TODAY?'<span class="st r">Lewat tanggal</span>':D(v.date)<=addDays(TODAY,7)?'<span class="st a">Minggu ini</span>':'<span class="st n">Terjadwal</span>'}</td><td>${np.ex?`<span class="chip g">✓ ${mlabel(np.m)}</span>`:`<button class="btn s" onclick="throwNext('${v.id}')">⇢ ${mlabel(np.m)}</button>`}</td><td class="right" style="white-space:nowrap"><button class="btn q s" onclick="shiftDraftBy('${v.id}',-1)">◀</button><button class="btn q s" onclick="shiftDraftBy('${v.id}',1)">▶</button> <a class="btn s" href="#invoice/${v.id}">Edit</a> <a class="btn s g" href="#invoice/${v.id}">Terbitkan</a> <button class="btn q s d" onclick="delDraft('${v.id}')">Batalkan</button></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Belum ada proyeksi. Lempar dari Faktur Penjualan.</td></tr>'}</tbody></table></div></div>${(()=>{const pc=S.invoices.filter(v=>v.status==='pcancel');return pc.length?`<div class="card flush mt"><h2>Dibatalkan <span class="muted" style="font-weight:400">· bisa dipulihkan</span></h2><div class="tw"><table><thead><tr><th>Bulan</th><th>Pelanggan</th><th class="num">Total</th><th>Dibatalkan</th><th>Alasan</th><th></th></tr></thead><tbody>${pc.map(v=>`<tr><td>${mlong(ym(v.date))}</td><td>${cu(v.cust).name}</td><td class="num">${fmt(calc(v).total)}</td><td>${dstr(v.cancelAt)} · ${esc(v.cancelBy||'')}</td><td>${esc(v.cancelReason||'')}</td><td class="right"><a class="btn q s" href="#invoice/${v.id}">Lihat</a> <button class="btn s" onclick="restoreDraft('${v.id}')">Pulihkan</button></td></tr>`).join('')}</tbody></table></div></div>`:''})()}`};
function shiftDraftBy(id,k){const v=S.invoices.find(x=>x.id===id);const to=ym(iso(addMonths(D(v.date),k)));if(S.invoices.some(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===to&&alive(x))){toast(mlong(to)+' sudah ada faktur/proyeksi untuk '+cu(v.cust).name);return}const terms=Math.round((D(v.due)-D(v.date))/864e5);const from=v.date;v.date=iso(addMonths(D(v.date),k));v.due=iso(addDays(D(v.date),terms));v.lines.forEach(l=>{if(l.defer&&l.defer.m)l.defer.s=ym(iso(addMonths(D(dmonth(l,{date:from})+'-01'),k)));l.desc=(l.desc||'').replace(/\(Periode (\d+) : [^)]*\)/,(m,p)=>`(Periode ${+p+k} : ${dfull(v.date)} - ${dfull(iso(addDays(addMonths(D(v.date),1),-1)))})`)});logIt('invoice',id,'Proyeksi digeser '+mlong(ym(from))+' → '+mlong(ym(v.date)));save();if(dD&&dD.id===id)dD=null;toast('Digeser ke '+mlong(ym(v.date)));nav()}
function delDraft(id){const v=S.invoices.find(x=>x.id===id);const r=prompt('Batalkan proyeksi '+cu(v.cust).name+' '+mlong(ym(v.date))+'? Alasan (mis. klien tidak lanjut):','');if(r===null)return;if(!r.trim()){toast('Alasan pembatalan proyeksi wajib diisi — proyeksi tidak jadi dibatalkan');return}unlinkQuote(v);v.status='pcancel';v.cancelReason=r;v.cancelBy=me.name;v.cancelAt=iso(TODAY);delete tabState['invoice/'+id];logIt('invoice',id,'Proyeksi dibatalkan · '+cu(v.cust).name+' '+mlong(ym(v.date))+' · '+r);save();if(dD&&dD.id===id)dD=null;toast('Proyeksi dibatalkan — bisa dipulihkan dari Proyeksi Revenue → Dibatalkan');if(location.hash==='#invoice/'+id)go('projection');else nav()}
function restoreDraft(id){const v=S.invoices.find(x=>x.id===id);if(S.invoices.some(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===ym(v.date)&&alive(x))){toast(mlong(ym(v.date))+' sudah terisi — geser dulu yang ada, atau biarkan');return}v.status='draft';logIt('invoice',id,'Proyeksi dipulihkan');save();toast('Dipulihkan');nav()}

/* ---------- PEMBATALAN TRANSAKSI (dengan alasan, jejak audit, cek periode) ---------- */
function voidReceipt(id){const r=S.receipts.find(x=>x.id===id);if(S.periods[ym(r.date)]==='locked'){toast(lockMsg(r.date,1));return}const why=prompt('Batalkan penerimaan '+r.no+'? Faktur terkait kembali terhutang. Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan pembatalan penerimaan wajib diisi — penerimaan tidak jadi dibatalkan');return}rcCreditFx(r,-1);r.status='void';r.voidReason=why;r.voidBy=me.name;r.voidAt=iso(TODAY);r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' dibatalkan · '+why));logIt('receipt',id,'Dibatalkan · '+why);save();dD=null;toast(r.no+' dibatalkan');nav()}
function unvoidReceipt(id){const r=S.receipts.find(x=>x.id===id);const dead=r.lines.map(l=>S.invoices.find(v=>v.id===l.inv)).filter(v=>!v||v.status!=='issued');if(dead.length){toast('Faktur '+dead.map(v=>v?v.no:'?').join(', ')+' tidak aktif — aktifkan fakturnya dulu');return}if(S.periods[ym(r.date)]==='locked'){toast(lockMsg(r.date,1));return}if(!confirm('Aktifkan kembali '+r.no+'?'))return;r.status='active';rcCreditFx(r,1);logIt('receipt',id,'Diaktifkan kembali');r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' diaktifkan kembali'));save();dD=null;nav()}
function cnCreditFx(n,fn){const v=S.invoices.find(x=>x.id===n.inv);if(!v){fn();return}const b=calc(v).rem;fn();const a=calc(v).rem;const d=Math.max(0,-b)-Math.max(0,-a);if(d>0){const c=cu(v.cust);c.credit=Math.max(0,(c.credit||0)-d)}}
function voidCN(id){const n=S.creditNotes.find(x=>x.id===id);if(plock(n.date))return;const why=prompt('Batalkan nota kredit '+n.no+'? Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan pembatalan nota kredit wajib diisi — nota kredit tidak jadi dibatalkan');return}cnCreditFx(n,()=>{n.status='void'});n.voidReason=why;logIt('invoice',n.inv,'Nota kredit '+n.no+' dibatalkan · '+why);save();dD=null;nav()}
function unapproveComm(id){const v=S.invoices.find(x=>x.id===id);if(!v||!v.comm.approved)return;const a=(commAlloc(v.seller)||{})[id];if(a&&a.paid>0){toast('Sudah ada pembayaran komisi untuk faktur ini — batalkan/hapus pembayarannya dulu');return}if(!confirm('Batalkan persetujuan komisi '+v.no+'? Komisi kembali ke status menunggu persetujuan.'))return;v.comm.approved=false;logIt('invoice',id,'Persetujuan komisi dibatalkan');save();nav()}
function otherCommPaid(inv,exceptId){return S.commPayments.filter(p=>p.id!==exceptId&&p.status!=='void').reduce((s,p)=>s+(p.alloc||[]).filter(a=>a.inv===inv).reduce((x,a)=>x+a.amt,0),0)}
function editCommPay(id){const p=S.commPayments.find(x=>x.id===id);if(!p)return;if(plock(p.date))return;const hasAlloc=p.alloc&&p.alloc.length;modal(`<h2>Edit pembayaran komisi · ${esc(se(p.seller).name)}</h2><p class="small muted" style="margin:0 0 12px">Perubahan tercatat di log. Nominal tiap faktur tidak boleh melebihi komisi faktur itu.</p><div class="grid g3"><div class="field"><label class="f">Tanggal bayar</label><input type="date" id="ecD" value="${p.date}"></div><div class="field"><label class="f">Bank / kas</label><select id="ecB">${S.banks.map(b=>`<option value="${b.id}" ${b.id===p.bankId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label class="f">Referensi</label><input id="ecR" value="${esc(p.ref||'')}"></div></div>${hasAlloc?`<div class="tw"><table class="grid-items"><thead><tr><th>Faktur</th><th class="num">Komisi faktur</th><th class="num" style="width:160px">Dibayar</th></tr></thead><tbody>${p.alloc.map(a=>{const v=S.invoices.find(x=>x.id===a.inv)||{};const cm=v.id?calc(v).comm.amount:0;return`<tr><td class="mono" style="padding-top:11px">${v.no||'?'}</td><td class="num" style="padding-top:11px">${fmt(cm)}</td><td><input type="number" class="ecA" data-inv="${a.inv}" value="${a.amt}" data-max="${Math.max(0,cm-otherCommPaid(a.inv,p.id))}"></td></tr>`}).join('')}</tbody></table></div>`:`<div class="field"><label class="f">Nominal (pembayaran lama tanpa alokasi)</label><input type="number" id="ecN" value="${p.amount}"></div>`}<div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="saveEditCommPay('${id}')">Simpan perubahan</button></div>`)}
function saveEditCommPay(id){const p=S.commPayments.find(x=>x.id===id);const d=document.getElementById('ecD').value;if(plock(d,p&&p.date))return;if(!d){toast('Tanggal bayar komisi wajib diisi');return}const sel=document.getElementById('ecB');let alloc=p.alloc,amount=p.amount;if(p.alloc&&p.alloc.length){alloc=[];for(const el of document.querySelectorAll('.ecA')){const amt=Math.round(+el.value||0);if(amt<0){toast('Nominal komisi per faktur tidak boleh minus');return}if(amt>+el.dataset.max+0.5){toast('Nominal melebihi sisa komisi faktur');return}if(amt>0)alloc.push({inv:el.dataset.inv,amt})}if(!alloc.length){toast('Minimal satu faktur harus dibayar — atau hapus pembayarannya');return}amount=alloc.reduce((s,a)=>s+a.amt,0)}else{amount=Math.round(+document.getElementById('ecN').value||0);if(amount<=0){toast('Nominal pembayaran komisi harus lebih dari 0');return}}const before=fmt(p.amount)+' · '+p.date;p.date=d;p.ref=document.getElementById('ecR').value;p.bankId=sel.value;p.bank=sel.selectedOptions[0].textContent;p.alloc=alloc;p.amount=amount;logIt('commission',p.seller,'Pembayaran komisi diedit: '+before+' → '+fmt(amount)+' · '+d);save();closeModal();toast('Pembayaran komisi diperbarui');nav()}
function delCommPay(id){const p=S.commPayments.find(x=>x.id===id);if(!p)return;if(plock(p.date))return;if(!confirm('Hapus permanen pembayaran komisi '+fmt(p.amount)+' ke '+se(p.seller).name+' ('+dstr(p.date)+')?'+(p.status==='void'?'':' Piutang komisi akan naik kembali.')+' Tindakan ini tidak bisa dibatalkan.'))return;S.commPayments=S.commPayments.filter(x=>x.id!==id);logIt('commission',p.seller,'Pembayaran komisi dihapus permanen: '+fmt(p.amount)+' · '+p.date+(p.ref?' · '+p.ref:''));save();toast('Pembayaran komisi dihapus');nav()}
function delReceipt(id){const r=S.receipts.find(x=>x.id===id);if(!r)return;if(S.periods[ym(r.date)]==='locked'){toast(lockMsg(r.date,1));return}if(!confirm('Hapus permanen penerimaan '+r.no+'?'+(r.status!=='void'?' Faktur terkait kembali punya sisa tagihan.':'')+' Tidak bisa dibatalkan.'))return;if(r.status!=='void')rcCreditFx(r,-1);S.receipts=S.receipts.filter(x=>x.id!==id);r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' dihapus permanen'));logIt('receipt',id,'Dihapus permanen · '+r.no);save();dD=null;toast('Penerimaan dihapus');go('receipts')}
function delCN(id){const n=S.creditNotes.find(x=>x.id===id);if(!n)return;if(plock(n.date))return;if(!confirm('Hapus permanen nota kredit '+n.no+'?'+(n.status!=='void'?' Nilai faktur kembali naik sebesar '+fmt(n.amount)+'.':'')+' Tidak bisa dibatalkan.'))return;if(n.status!=='void')cnCreditFx(n,()=>{S.creditNotes=S.creditNotes.filter(x=>x.id!==id)});else S.creditNotes=S.creditNotes.filter(x=>x.id!==id);logIt('invoice',n.inv,'Nota kredit '+n.no+' dihapus permanen');save();dD=null;toast('Nota kredit dihapus');nav()}
function delCustomer(id){const c=cu(id);if(!c)return;const nI=S.invoices.filter(v=>v.cust===id).length,nQ=S.quotes.filter(q=>q.cust===id).length,nR=S.receipts.filter(r=>r.cust===id).length;if(nI+nQ+nR){toast(c.name+' dipakai '+(nI?nI+' faktur/proyeksi ':'')+(nQ?nQ+' penawaran ':'')+(nR?nR+' penerimaan':'')+'— hapus/batalkan dokumennya dulu');return}if(!confirm('Hapus pelanggan '+c.name+' ('+c.code+') permanen?'))return;S.customers=S.customers.filter(x=>x.id!==id);logIt('customer',id,'Pelanggan dihapus: '+c.name);save();dD=null;toast('Pelanggan dihapus');go('customers')}
function delSeller(id){const s=se(id);if(!s||!s.id)return;const nI=S.invoices.filter(v=>v.seller===id).length,nC=S.customers.filter(c=>c.bd===id||c.am===id).length+S.invoices.filter(v=>v.bd===id||v.am===id).length,nP=S.commPayments.filter(p=>p.seller===id).length;if(nI+nC+nP){toast(s.name+' masih dipakai ('+nI+' faktur, '+nC+' pelanggan, '+nP+' pembayaran komisi) — nonaktifkan saja');return}if(!confirm('Hapus '+s.type+' '+s.name+' permanen?'))return;S.sellers=S.sellers.filter(x=>x.id!==id);logIt('seller',id,'Penjual dihapus: '+s.name);save();nav()}
function resetQuote(id){const q=S.quotes.find(x=>x.id===id);if(!q)return;q.status='draft';logIt('quote',id,'Status dikembalikan ke draft');save();dD=null;toast('Penawaran dikembalikan ke draft');nav()}
function delQuote(id){const q=S.quotes.find(x=>x.id===id);if(!q)return;if(!confirm('Hapus penawaran '+q.no+' permanen?'+(q.status==='converted'?' Faktur hasil penawaran ini tidak ikut terhapus.':'')))return;S.quotes=S.quotes.filter(x=>x.id!==id);logIt('quote',id,'Penawaran dihapus: '+q.no);save();dD=null;toast('Penawaran dihapus');go('quotes')}
function voidCommPay(id){const p=S.commPayments.find(x=>x.id===id);if(plock(p.date))return;const why=prompt('Batalkan pembayaran komisi '+fmt(p.amount)+' ke '+se(p.seller).name+'? Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan pembatalan pembayaran komisi wajib diisi — pembayaran tidak jadi dibatalkan');return}p.status='void';p.voidReason=why;(p.alloc||[]).forEach(a=>logIt('invoice',a.inv,'Pembayaran komisi '+fmt(a.amt)+' dibatalkan · '+why));logIt('commission',p.seller,'Pembayaran komisi dibatalkan · '+why);save();nav()}
function unvoidCommPay(id){const p=S.commPayments.find(x=>x.id===id);if(plock(p.date))return;if(!confirm('Aktifkan kembali pembayaran komisi '+fmt(p.amount)+'?'))return;p.status='active';logIt('commission',p.seller,'Pembayaran komisi diaktifkan kembali');save();nav()}
function unvoidCN(id){const n=S.creditNotes.find(x=>x.id===id);if(plock(n.date))return;if(!confirm('Aktifkan kembali '+n.no+'?'))return;{const v0=S.invoices.find(x=>x.id===n.inv);const b0=v0?calc(v0).rem:0;n.status='active';if(v0){const a0=calc(v0).rem;const d=Math.max(0,-a0)-Math.max(0,-b0);if(d>0)cu(v0.cust).credit=(cu(v0.cust).credit||0)+d}}logIt('invoice',n.inv,'Nota kredit '+n.no+' diaktifkan kembali');save();dD=null;nav()}
function uncancelInvoice(id){const v=S.invoices.find(x=>x.id===id);if(plock(v.date))return;if(!confirm('Aktifkan kembali '+v.no+'?'))return;v.status='issued';v.comm.on=true;logIt('invoice',id,'Diaktifkan kembali');save();dD=null;nav()}
function hardDeleteInvoice(id){const v=S.invoices.find(x=>x.id===id);if(!v||v.status!=='cancelled'){toast('Hanya faktur berstatus dibatalkan yang bisa dihapus');return}if(plock(v.date))return;const rc=S.receipts.filter(r=>r.lines.some(l=>l.inv===id));const cn=S.creditNotes.filter(n=>n.inv===id);const cp=S.commPayments.filter(p=>(p.alloc||[]).some(a=>a.inv===id));const allCh=S.invoices.filter(x=>x.parent===id);const ch=allCh.filter(x=>x.status!=='pcancel');const chCx=allCh.filter(x=>x.status==='pcancel');const n=rc.length+cn.length+cp.length+ch.length;if(n){toast('Faktur masih punya '+(rc.length?rc.length+' penerimaan ('+rc.map(r=>r.no).join(', ')+') ':'')+(cn.length?cn.length+' nota kredit ':'')+(cp.length?cp.length+' pembayaran komisi ':'')+(ch.length?ch.length+' proyeksi turunan ':'')+'— hapus permanen dokumen tersebut dulu, baru faktur bisa dihapus');return}const typed=prompt('Menghapus faktur ini PERMANEN dan tidak bisa dibatalkan. '+(chCx.length?'Ikut terhapus: '+chCx.length+' proyeksi turunan yang sudah dibatalkan. ':'')+'Ketik nomor faktur "'+v.no+'" untuk konfirmasi:','');if(typed===null)return;if(typed.trim()!==v.no){toast('Nomor yang diketik tidak sama dengan '+v.no+' — faktur tidak dihapus');return}logIt('invoice',id,'Dihapus permanen · '+v.no+(chCx.length?' · beserta '+chCx.length+' proyeksi yang sudah dibatalkan':''));unlinkQuote(v);const gone=new Set([id,...chCx.map(x=>x.id)]);S.invoices=S.invoices.filter(x=>!gone.has(x.id));delete tabState['invoice/'+id];save();dD=null;toast('Faktur dihapus permanen');if(location.hash==='#invoice/'+id)go('invoices');else nav()}
routes.receipts=function(){const f=listFilter;const all=S.receipts.slice().sort((a,b)=>b.date.localeCompare(a.date));const rows=all.filter(r=>(!f.q||r.no.toLowerCase().includes(f.q)||cu(r.cust).name.toLowerCase().includes(f.q))&&(!f.c||r.cust===f.c)&&(!f.m||ym(r.date)===f.m)&&(f.s==='void'?r.status==='void':f.s==='active'?r.status!=='void':true));const rcm=[...new Set(all.map(r=>ym(r.date)))].sort().reverse();const rcs=r=>({cash:r.lines.reduce((s,l)=>s+(+l.cash||0),0),pph:r.lines.reduce((s,l)=>s+(+l.pph||0),0),oth:r.lines.reduce((s,l)=>s+(+l.disc||0)+(+l.credit||0),0)});const act=rows.filter(r=>r.status!=='void');const tc=act.reduce((s,r)=>s+rcs(r).cash,0),tp=act.reduce((s,r)=>s+rcs(r).pph,0),to=act.reduce((s,r)=>s+rcs(r).oth,0);return`<div class="top"><div><h1>Penerimaan Penjualan</h1><p>Pembayaran dari pelanggan — kas, potongan PPh, diskon, uang muka · ${all.filter(r=>r.status==='void').length} dibatalkan</p></div><div class="flex"><button class="btn" onclick="exportTable(document.querySelector('table.rcplist'),'penerimaan-penjualan.csv')">Ekspor CSV</button><a class="btn g" href="#receipt/new">+ Penerimaan baru</a></div></div>${filterBar([`<select onchange="listFilter.m=this.value;nav()"><option value="">Tanggal: semua</option>${rcm.map(m=>`<option value="${m}" ${f.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,`${combo(custOpts(),f.c,"v=>{listFilter.c=v;nav()}",'Pelanggan: ketik untuk cari…',false,1)}`,`<select onchange="listFilter.s=this.value;nav()"><option value="">Status: semua</option><option value="active" ${f.s==='active'?'selected':''}>Aktif</option><option value="void" ${f.s==='void'?'selected':''}>Dibatalkan</option></select>`,`<input id="flt-rc-q" placeholder="Cari no. bukti / pelanggan" value="${esc(f.q||'')}" oninput="listFilter.q=this.value.toLowerCase();nav()">`,`<span class="sp"></span><span class="cnt">${rows.length} dari ${all.length}</span>`])}<div class="card flush"><div class="tw"><table class="rcplist"><thead><tr><th>No. bukti</th><th>Tgl bayar</th><th>Terima dari</th><th>Bank</th><th>Cara bayar</th><th>Ref</th><th>Faktur</th><th class="num">Kas diterima (bersih)</th><th class="num">PPh</th><th class="num">Total pelunasan</th><th>Status</th></tr></thead><tbody>${rows.map(r=>{const cash=r.lines.reduce((s,l)=>s+(+l.cash||0),0),pph=r.lines.reduce((s,l)=>s+(+l.pph||0),0),disc=r.lines.reduce((s,l)=>s+(+l.disc||0),0),cr=r.lines.reduce((s,l)=>s+(+l.credit||0),0);const vd=r.status==='void';return`<tr class="row" style="${vd?'opacity:.55':''}" onclick="go('receipt/${r.id}')"><td class="mono">${r.no}</td><td>${dstr(r.date)}</td><td>${cu(r.cust).name}</td><td>${r.bank==='PT'?'Rek. PT':'Rek. pribadi'}</td><td>${esc(r.method||'')}</td><td class="muted">${esc(r.ref)}</td><td class="mono">${r.lines.map(l=>(S.invoices.find(v=>v.id===l.inv)||{}).no||'?').join(', ')}</td><td class="num">${fmt(cash)}</td><td class="num">${fmt(pph)}${r.lines.some(l=>(+l.pph||0)>0&&!(l.bukti||'').trim())?' <span class="chip a" title="Bupot belum diperiksa">BP?</span>':''}</td><td class="num">${fmt(cash+pph+disc+cr)}</td><td>${vd?`<span class="st r">Dibatalkan</span>`:'<span class="st g">Aktif</span>'}</td></tr>`}).join('')}</tbody>${rows.length?`<tfoot><tr><td colspan="7">Total · ${act.length} penerimaan aktif</td><td class="num">${fmt(tc)}</td><td class="num">${fmt(tp)}</td><td class="num">${fmt(tc+tp+to)}</td><td></td></tr></tfoot>`:''}</table></div></div>`};
