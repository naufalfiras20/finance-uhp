/* ---------- MODUL KOMISI: pembayaran & aturan ---------- */
function commAlloc(sellerId){const vs=S.invoices.filter(v=>v.status==='issued'&&v.comm.on&&v.comm.approved&&v.seller===sellerId).sort((a,b)=>a.date.localeCompare(b.date));const out={};vs.forEach(v=>out[v.id]={amt:calc(v).comm.amount,paid:0});let pool=0;S.commPayments.filter(p=>p.seller===sellerId&&p.status!=='void').forEach(p=>{if(p.alloc&&p.alloc.length)p.alloc.forEach(a=>{if(out[a.inv])out[a.inv].paid+=a.amt});else pool+=p.amount});vs.forEach(v=>{const o=out[v.id];const use=Math.min(Math.max(0,o.amt-o.paid),pool);o.paid+=use;pool-=use});Object.values(out).forEach(o=>o.st=o.paid>=o.amt?'paid':o.paid>0?'partial':'unpaid');return out}
routes.commpays=function(){const ps=S.commPayments.slice().sort((a,b)=>b.date.localeCompare(a.date));const act=ps.filter(p=>p.status!=='void');return`<div class="top"><div><h1>Pembayaran Komisi</h1><p>Riwayat pembayaran komisi ke penjual · ${act.length} aktif · ${ps.length-act.length} dibatalkan</p></div><div class="flex"><a class="btn" href="#commissions">Monitoring</a><button class="btn g" onclick="payCommModal((S.sellers.find(s=>s.active)||S.sellers[0]).id,[])">+ Bayar komisi</button></div></div><div class="grid g3 mb"><div class="card kpi"><p class="lbl">Dibayar bulan ini</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('Pembayaran komisi ${mlong(ym(iso(TODAY)))}',S.commPayments.filter(p=>p.status!=='void'&&ym(p.date)==='${ym(iso(TODAY))}').map(p=>({no:p.ref||'Komisi',who:se(p.seller).name,date:p.date,amt:p.amount,href:'commpays'})))">${fmtS(act.filter(p=>ym(p.date)===ym(iso(TODAY))).reduce((s,p)=>s+p.amount,0))}</a></div></div><div class="card kpi"><p class="lbl">Total dibayar</p><div class="v">${fmtS(act.reduce((s,p)=>s+p.amount,0))}</div></div><div class="card kpi"><p class="lbl">Piutang komisi penjual</p><div class="v" style="color:var(--red)"><a href="#commissions" style="color:inherit">${fmtS(commRows().reduce((s,r)=>s+r.rem,0))}</a></div><div class="d">belum dibayar</div></div></div><div class="card flush"><div class="tw"><table><thead><tr><th>Tanggal</th><th>Penjual</th><th>Bank</th><th>Referensi</th><th>Alokasi ke faktur</th><th class="num">Nominal</th><th>Status</th><th></th></tr></thead><tbody>${ps.length?ps.map(p=>`<tr style="${p.status==='void'?'opacity:.55':''}"><td>${dstr(p.date)}</td><td>${se(p.seller).name}</td><td>${esc(p.bank||'Rekening PT')}</td><td>${esc(p.ref||'')}</td><td style="white-space:normal">${p.alloc&&p.alloc.length?p.alloc.map(a=>`<a href="#invoice/${a.inv}" class="mono">${(S.invoices.find(v=>v.id===a.inv)||{}).no||'?'}</a> ${fmtS(a.amt)}`).join(' · '):'<span class="muted">otomatis (FIFO)</span>'}</td><td class="num">${fmt(p.amount)}</td><td>${p.status==='void'?`<span class="st r" title="${esc(p.voidReason||'')}">Dibatalkan · ${esc(p.voidReason||'')}</span>`:'<span class="st g">Dibayar</span>'}</td><td class="right">${can('pay')?(p.status!=='void'?`<button class="btn q s d" onclick="voidCommPay('${p.id}')">Batalkan</button>`:`<button class="btn q s" onclick="unvoidCommPay('${p.id}')">Aktifkan kembali</button>`):''}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">Belum ada pembayaran</td></tr>'}</tbody></table></div></div>`};
routes.commrules=function(){if(!can('settings'))return'<div class="empty">Hanya Master yang bisa mengubah aturan komisi.</div>';return`<div class="top"><div><h1>Aturan Komisi</h1><p>BD untuk faktur pertama pelanggan, AM untuk faktur lanjutan. Aturan terbaru yang cocok dipakai; per faktur tetap bisa % / Rp custom.</p></div></div>${commRulesHtml()}`};

function bupotDeadline(payDate){const d=D(payDate);return iso(new Date(d.getFullYear(),d.getMonth()+2,0))}
function writeOffPph(rid,inv){const r=S.receipts.find(x=>x.id===rid);const l=r.lines.find(x=>x.inv===inv);const why=prompt('Klien tidak memberi bukti potong. PPh '+fmt(l.pph)+' dijadikan beban (diskon), kredit pajak dilepas. Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan wajib');return}l.writeoff={pph:l.pph,type:l.pphType,why,at:iso(TODAY),by:me.name};l.disc=(+l.disc||0)+l.pph;l.pph=0;l.pphType='none';logIt('receipt',rid,'PPh '+fmt(l.writeoff.pph)+' dibebankan (tanpa bukti potong) · '+why);logIt('invoice',inv,'PPh '+fmt(l.writeoff.pph)+' dibebankan · tanpa bukti potong');save();toast('PPh dibebankan');nav()}
function undoWriteOffPph(rid,inv){const r=S.receipts.find(x=>x.id===rid);const l=r.lines.find(x=>x.inv===inv);if(!l.writeoff)return;if(!confirm('Kembalikan PPh '+fmt(l.writeoff.pph)+' sebagai potongan PPh (bukti potong ternyata ada)?'))return;l.pph=l.writeoff.pph;l.pphType=l.writeoff.type;l.disc=Math.max(0,(+l.disc||0)-l.writeoff.pph);delete l.writeoff;logIt('receipt',rid,'Pembebanan PPh dibatalkan — kembali jadi PPh dipotong');save();nav()}
/* ---------- ekspor tabel ke CSV (semua laporan & daftar) ---------- */
async function exportTable(tbl,fn){if(!tbl){toast('Tabel tidak ditemukan');return}const rows=[...tbl.querySelectorAll('tr')].map(tr=>[...tr.children].filter(td=>getComputedStyle(td).display!=='none').map(td=>'"'+td.innerText.replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"').join(','));const csv='﻿'+rows.join('\n');try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data:csv});toast('CSV disimpan');return}}catch(e){if(e&&e.code==='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}


/* ---------- PROYEKSI REVENUE · alur bulanan (wizard) ---------- */
let pw={m:ym(iso(addMonths(TODAY,1))),step:1,sel:null,made:[]};
function pwSrc(c,m){const pm=ym(iso(addMonths(D(m+'-01'),-1)));return S.invoices.filter(v=>v.cust===c.id&&ym(v.date)===pm&&alive(v)&&v.status!=='cancelled').sort((a,b)=>(a.status==='issued'?0:1)-(b.status==='issued'?0:1))[0]}
function pwCur(c,m){return S.invoices.find(v=>v.cust===c.id&&ym(v.date)===m&&alive(v))}
routes.projwiz=function(){const m=pw.m;const pm=ym(iso(addMonths(D(m+'-01'),-1)));const rows=S.customers.map(c=>({c,src:pwSrc(c,m),cur:pwCur(c,m)}));if(!pw.sel){pw.sel={};rows.forEach(r=>{if(r.src&&!r.cur)pw.sel[r.c.id]=true})}
 const steps=[['1','Pilih bulan'],['2','Tinjau pelanggan'],['3','Lempar & sesuaikan'],['4','Ringkasan']];const strip=`<div class="wiz">${steps.map((x,i)=>`<div class="${pw.step===i+1?'on':pw.step>i+1?'done':''}"><b>Langkah ${x[0]}</b>${x[1]}</div>`).join('')}</div>`;
 const totPrev=S.invoices.filter(v=>ym(v.date)===pm&&v.status==='issued').reduce((s,v)=>s+calc(v).total,0),totCur=S.invoices.filter(v=>ym(v.date)===m&&v.status==='draft').reduce((s,v)=>s+calc(v).total,0),totCurIss=S.invoices.filter(v=>ym(v.date)===m&&v.status==='issued').reduce((s,v)=>s+calc(v).total,0);
 let body='';
 if(pw.step===1)body=`<div class="card" style="max-width:720px"><h2>Bulan yang mau disusun proyeksinya</h2><div class="grid g2"><div class="field"><label class="f">Bulan proyeksi</label><input type="month" value="${m}" onchange="pw.m=this.value;pw.sel=null;nav()"></div><div class="field"><label class="f">Sumber lemparan</label><input value="${mlong(pm)}" disabled><span class="small muted">faktur terbit / proyeksi bulan sebelumnya</span></div></div><div class="kv mb"><span>Revenue terbit ${mlong(pm)}</span><span>${fmt(totPrev)}</span><span>Proyeksi ${mlong(m)} saat ini</span><span>${fmt(totCur)} (${S.invoices.filter(v=>ym(v.date)===m&&v.status==='draft').length} proyeksi)</span><span>Sudah terbit di ${mlong(m)}</span><span>${fmt(totCurIss)}</span></div><button class="btn g" onclick="pw.step=2;nav()">Lanjut → tinjau pelanggan</button></div>`;
 if(pw.step===2){const n=Object.values(pw.sel).filter(Boolean).length;body=`<div class="card flush"><h2>Pelanggan mana yang lanjut di ${mlong(m)}?</h2><p class="small muted" style="padding:0 24px 12px">Centang = lempar faktur/proyeksi ${mlong(pm)} ke ${mlong(m)}. Yang sudah punya faktur/proyeksi di ${mlong(m)} tidak perlu dilempar. Yang tidak lanjut, kosongkan saja (catat alasannya).</p><div class="tw"><table><thead><tr><th style="width:30px"></th><th>Pelanggan</th><th>AM</th><th>Sumber (${mlabel(pm)})</th><th class="num">Nilai</th><th>Status ${mlabel(m)}</th><th>Catatan tidak lanjut</th></tr></thead><tbody>${rows.map(({c,src,cur})=>`<tr><td><input type="checkbox" ${pw.sel[c.id]?'checked':''} ${!src||cur?'disabled':''} onchange="pw.sel['${c.id}']=this.checked"></td><td><a href="#customer/${c.id}">${esc(c.name)}</a><span class="sub">${esc(c.legal||'')}</span></td><td>${se(c.am).name}</td><td>${src?`<a href="#invoice/${src.id}" class="mono">${src.no||'proyeksi'}</a> <span class="chip ${src.status==='issued'?'g':''}">${src.status==='issued'?'terbit':'proyeksi'}</span>`:'<span class="muted">tidak ada faktur bulan lalu</span>'}</td><td class="num">${src?fmt(calc(src).total):'—'}</td><td>${cur?`<a href="#invoice/${cur.id}" class="chip ${cur.status==='issued'?'g':'a'}">${cur.status==='issued'?'✓ sudah terbit '+cur.no:'✓ sudah ada proyeksi'}</a>`:src?'<span class="muted">belum ada</span>':`<a class="btn q s" href="#invoice/new?cust=${c.id}">+ buat manual</a>`}</td><td>${src&&!cur?`<input placeholder="mis. kontrak selesai / pause" value="${esc(c.projNote||'')}" onchange="cu('${c.id}').projNote=this.value;save()">`:''}</td></tr>`).join('')}</tbody></table></div></div><div class="flex mt"><button class="btn" onclick="pw.step=1;nav()">← Kembali</button><span class="sp" style="flex:1"></span><span class="muted small">${n} pelanggan akan dilempar</span><button class="btn g" ${n?'':'disabled'} onclick="pwThrow()">Lempar ${n} pelanggan → ${mlong(m)}</button></div>`}
 if(pw.step===3){const made=S.invoices.filter(v=>ym(v.date)===m&&v.status==='draft');body=`<div class="card flush"><h2>Proyeksi ${mlong(m)} · sesuaikan bila perlu</h2><p class="small muted" style="padding:0 24px 12px">Nilai bisa diubah langsung (buka → edit baris), digeser, atau dibatalkan. Setelah rapi, lanjut ke ringkasan.</p><div class="tw"><table><thead><tr><th>Pelanggan</th><th>Tanggal</th><th>Isi</th><th class="num">Total</th><th class="num">Setelah PPh (kas)</th><th>Lemparan dari</th><th></th></tr></thead><tbody>${made.length?made.map(v=>{const par=S.invoices.find(x=>x.id===v.parent);return`<tr><td>${cu(v.cust).name}</td><td><input type="date" value="${v.date}" style="width:150px" onchange="const x=S.invoices.find(z=>z.id==='${v.id}');const t=Math.round((D(x.due)-D(x.date))/864e5);x.date=this.value;x.due=iso(addDays(D(this.value),t));save();nav()"></td><td style="white-space:normal">${v.lines.map(l=>esc(l.name)).join(', ')}</td><td class="num">${fmt(calc(v).total)}</td><td class="num">${fmt(calc(v).total*(1-tx(v.pph).rate))}</td><td class="mono">${par?(par.no||'proyeksi'):'manual'}</td><td class="right" style="white-space:nowrap"><a class="btn s" href="#invoice/${v.id}">Edit</a> <button class="btn q s d" onclick="delDraft('${v.id}')">Batalkan</button></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Belum ada proyeksi bulan ini</td></tr>'}</tbody><tfoot><tr><td colspan="3">Total proyeksi ${mlong(m)}</td><td class="num">${fmt(made.reduce((s,v)=>s+calc(v).total,0))}</td><td class="num">${fmt(made.reduce((s,v)=>s+calc(v).total*(1-tx(v.pph).rate),0))}</td><td colspan="2"></td></tr></tfoot></table></div></div><div class="flex mt"><button class="btn" onclick="pw.step=2;nav()">← Kembali</button><a class="btn" href="#invoice/new">+ Tambah proyeksi manual</a><span class="sp" style="flex:1"></span><button class="btn g" onclick="pw.step=4;nav()">Lanjut → ringkasan</button></div>`}
 if(pw.step===4){const made=S.invoices.filter(v=>ym(v.date)===m&&v.status==='draft');const skip=rows.filter(r=>r.src&&!pwCur(r.c,m));body=`<div class="grid g3 mb"><div class="card kpi"><p class="lbl">Revenue terbit ${mlabel(pm)}</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();pjDrill('${pm}','issued')">${fmtS(totPrev)}</a></div></div><div class="card kpi"><p class="lbl">Proyeksi ${mlabel(m)}</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();pjDrill('${m}','draft')">${fmtS(made.reduce((s,v)=>s+calc(v).total,0))}</a></div><div class="d">${made.length} pelanggan · ${totPrev?pct((made.reduce((s,v)=>s+calc(v).total,0)+totCurIss)/totPrev-1):'—'} vs bulan lalu</div></div><div class="card kpi"><p class="lbl">Tidak lanjut</p><div class="v" style="color:var(--amber)">${skip.length}</div><div class="d">${skip.map(r=>esc(r.c.name)+(r.c.projNote?' ('+esc(r.c.projNote)+')':'')).join(', ')||'—'}</div></div></div><div class="card"><h2>Proyeksi ${mlong(m)} selesai disusun</h2><p class="small muted">Proyeksi masuk ke Proyeksi Cash In (kategori belum terbit) dan laporan. Saat permintaan invoice datang, buka proyeksinya lalu <b>Terbitkan</b>.</p><div class="flex"><a class="btn g" href="#projection">Buka matriks proyeksi</a><a class="btn" href="#cashin">Lihat proyeksi cash in</a><button class="btn" onclick="pw={m:ym(iso(addMonths(D('${m}-01'),1))),step:1,sel:null,made:[]};nav()">Susun bulan berikutnya →</button></div></div>`}
 return`<div class="top"><div><h1>Susun Proyeksi · ${mlong(m)}</h1><p>Alur bulanan: pilih bulan → tinjau pelanggan yang lanjut → lempar → sesuaikan → ringkasan.</p></div></div>${strip}${body}`};
function pwThrow(){let n=0;S.customers.forEach(c=>{if(!pw.sel[c.id])return;const src=pwSrc(c,pw.m);if(!src||pwCur(c,pw.m))return;const k=Math.round((D(pw.m+'-01')-D(ym(src.date)+'-01'))/864e5/29.5);n+=throwInvoice(src,[1]);});logIt('projection',pw.m,'Susun proyeksi '+mlong(pw.m)+' · '+n+' pelanggan dilempar');save();toast(n+' proyeksi dibuat');pw.step=3;nav()}

/* ---------- PROYEKSI CASH IN (modul sendiri) ---------- */
let ciF={from:iso(TODAY),to:iso(addDays(TODAY,60)),gran:'week',tab:'all'};
function setExpect(id,val){const v=S.invoices.find(x=>x.id===id);v.expect=val||null;logIt('invoice',id,'Perkiraan tertagih diubah ke '+dstr(val||v.due));save();nav()}
routes.cashin=function(arg){if(arg&&['all','received','issued','draft'].includes(arg))ciF.tab=arg;const o={from:ciF.from,to:ciF.to,gran:ciF.gran,tiers};const data=cashProj(o.from,o.to,tiers);const sum=k=>data.filter(p=>p.tier===k).reduce((s,p)=>s+p.amount,0);const ks=buckets(o);const by={};ks.forEach(k=>by[k]={received:0,issued:0,draft:0});data.forEach(p=>{const k=keyOf(p.date,o);if(by[k])by[k][p.tier]+=p.amount});
 const rc=S.receipts.filter(r=>r.status!=='void'&&r.date>=ciF.from&&r.date<=ciF.to).sort((a,b)=>a.date.localeCompare(b.date));const ar=S.invoices.filter(v=>v.status==='issued'&&calc(v).rem>0&&!v.hold).map(v=>({v,c:calc(v),d:v.expect||v.due})).filter(x=>{const d=D(x.d)<TODAY?iso(addDays(TODAY,7)):x.d;return d>=ciF.from&&d<=ciF.to}).sort((a,b)=>a.d.localeCompare(b.d));const dr=S.invoices.filter(v=>v.status==='draft').map(v=>({v,c:calc(v),d:v.due})).filter(x=>{const d=D(x.d)<TODAY?iso(addDays(TODAY,7)):x.d;return d>=ciF.from&&d<=ciF.to}).sort((a,b)=>a.d.localeCompare(b.d));
 const tabs=[['all','Ringkasan per periode'],['received','Kas sudah diterima',rc.length],['issued','A/R akan tertagih',ar.length],['draft','Faktur belum terbit',dr.length]];
 return`<div class="top"><div><h1>Proyeksi Cash In</h1><p>Tiga sumber kas masuk: <b>sudah diterima</b> (tanggal terima) · <b>A/R akan tertagih</b> (perkiraan tanggal tertagih, bisa diubah per faktur, setelah PPh) · <b>faktur belum terbit</b> (proyeksi revenue, jatuh tempo, setelah PPh).</p></div><div class="flex"><a class="btn" href="#bank">Buku Bank</a><a class="btn" href="#collections">Penagihan</a><a class="btn" href="#projwiz">Susun proyeksi</a></div></div>
 ${filterBar([`<label class="f" style="margin:0">Dari</label><input type="date" value="${ciF.from}" onchange="ciF.from=this.value;nav()">`,`<label class="f" style="margin:0">Sampai</label><input type="date" value="${ciF.to}" onchange="ciF.to=this.value;nav()">`,`<div class="seg">${[['day','Harian'],['week','Mingguan'],['month','Bulanan']].map(g=>`<button class="${ciF.gran===g[0]?'on':''}" onclick="ciF.gran='${g[0]}';nav()">${g[1]}</button>`).join('')}</div>`,`<div class="seg">${[[30,'30 hr'],[60,'60 hr'],[90,'90 hr'],[180,'6 bln']].map(d=>`<button onclick="ciF.from='${iso(TODAY)}';ciF.to='${''}'+iso(addDays(TODAY,${d[0]}));nav()">${d[1]}</button>`).join('')}</div>`,`<span class="sp"></span><div class="legend">${['received','issued','draft'].map(k=>`<label class="${tiers[k]?'':'off'}"><input type="checkbox" hidden ${tiers[k]?'checked':''} onchange="tiers['${k}']=this.checked;nav()"><i style="background:${TIER[k][1]}"></i>${TIER[k][0].split(' (')[0]}</label>`).join('')}</div>`])}
 ${cashSummary(ciF.from,ciF.to,tiers)}<div class="card mb"><div class="flex" style="justify-content:space-between"><h2 style="margin:0">${fmt(data.reduce((s,p)=>s+p.amount,0))} <span class="muted" style="font-weight:400;font-size:13px">total ${dstr(ciF.from)} – ${dstr(ciF.to)}</span></h2><span class="small muted">klik batang → sumber data</span></div>${chart(o)}</div>
 <div class="tabs">${tabs.map(t=>`<button class="${ciF.tab===t[0]?'on':''}" onclick="go('cashin/${t[0]}')">${t[1]}${t[2]!=null?`<span>${t[2]}</span>`:''}</button>`).join('')}</div>
 ${ciF.tab==='all'?`<div class="card flush"><div class="tw"><table><thead><tr><th>Periode</th><th class="num">Sudah diterima</th><th class="num">A/R akan tertagih</th><th class="num">Belum terbit</th><th class="num">Total</th><th class="num">Kumulatif</th></tr></thead><tbody>${(()=>{let cum=0;return ks.map(k=>{const b=by[k];const t=b.received+b.issued+b.draft;cum+=t;return`<tr><td>${o.gran==='month'?mlong(k):o.gran==='week'?'Minggu '+dstr(k):dstr(k)}</td>${dcell(b.received?fmt(b.received):'—',`barClick('${k}','${o.gran}')`)}${dcell(b.issued?fmt(b.issued):'—',`barClick('${k}','${o.gran}')`)}${dcell(b.draft?fmt(b.draft):'—',`barClick('${k}','${o.gran}')`)}<td class="num" style="font-weight:500">${fmt(t)}</td><td class="num">${fmt(cum)}</td></tr>`}).join('')})()}</tbody><tfoot><tr><td>Total</td><td class="num">${fmt(sum('received'))}</td><td class="num">${fmt(sum('issued'))}</td><td class="num">${fmt(sum('draft'))}</td><td class="num">${fmt(data.reduce((s,p)=>s+p.amount,0))}</td><td></td></tr></tfoot></table></div></div>`:''}
 ${ciF.tab==='received'?`<div class="card flush"><div class="tw"><table><thead><tr><th>Tgl terima</th><th>No. bukti</th><th>Pelanggan</th><th>Faktur</th><th>Bank</th><th class="num">Kas masuk</th><th class="num">PPh dipotong</th></tr></thead><tbody>${rc.length?rc.map(r=>`<tr class="row" onclick="go('receipt/${r.id}')"><td>${dstr(r.date)}</td><td class="mono">${r.no}</td><td>${cu(r.cust).name}</td><td class="mono">${r.lines.map(l=>(S.invoices.find(v=>v.id===l.inv)||{}).no||'?').join(', ')}</td><td>${r.bank}</td><td class="num">${fmt(r.lines.reduce((s,l)=>s+(+l.cash||0),0))}</td><td class="num">${fmt(r.lines.reduce((s,l)=>s+(+l.pph||0),0))}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Tidak ada penerimaan di rentang ini</td></tr>'}</tbody><tfoot><tr><td colspan="5">Total</td><td class="num">${fmt(rc.reduce((s,r)=>s+r.lines.reduce((a,l)=>a+(+l.cash||0),0),0))}</td><td></td></tr></tfoot></table></div></div>`:''}
 ${ciF.tab==='issued'?`<div class="card flush"><p class="small muted" style="padding:16px 24px 0">Perkiraan tertagih default = jatuh tempo; ubah kalau klien sudah janji tanggal lain. Faktur lewat jatuh tempo tanpa perkiraan dianggap masuk 7 hari lagi.</p><div class="tw"><table><thead><tr><th>Faktur</th><th>Pelanggan</th><th>AM</th><th>Jatuh tempo</th><th>Perkiraan tertagih</th><th class="num">Sisa</th><th class="num">Setelah PPh</th><th>Status penagihan</th><th>Keterangan komunikasi</th></tr></thead><tbody>${ar.length?ar.map(({v,c,d})=>{const f=(v.followups||[]).slice(-1)[0];return`<tr><td class="mono"><a href="#invoice/${v.id}">${v.no}</a></td><td>${cu(v.cust).name}</td><td>${se(cu(v.cust).am).name}</td><td style="color:${D(v.due)<TODAY?'var(--red)':'inherit'}">${dstr(v.due)}</td><td><input type="date" value="${v.expect||v.due}" style="width:150px" onchange="setExpect('${v.id}',this.value)"></td><td class="num">${fmt(c.rem)}</td><td class="num" style="font-weight:500">${fmt(c.rem*(1-tx(cu(v.cust).pph).rate))}</td><td>${collStatusSel(v)}</td><td style="white-space:normal;min-width:240px">${collNoteBox(v)}</td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Tidak ada piutang di rentang ini</td></tr>'}</tbody><tfoot><tr><td colspan="5">Total</td><td class="num">${fmt(ar.reduce((s,x)=>s+x.c.rem,0))}</td><td class="num">${fmt(ar.reduce((s,x)=>s+x.c.rem*(1-tx(cu(x.v.cust).pph).rate),0))}</td><td colspan="2"></td></tr></tfoot></table></div></div>`:''}
 ${ciF.tab==='draft'?`<div class="card flush"><div class="tw"><table><thead><tr><th>Bulan</th><th>Pelanggan</th><th>Tgl proyeksi</th><th>Jatuh tempo</th><th class="num">Nilai</th><th class="num">Setelah PPh</th><th>Lemparan dari</th><th></th></tr></thead><tbody>${dr.length?dr.map(({v,c})=>{const par=S.invoices.find(x=>x.id===v.parent);return`<tr><td>${mlong(ym(v.date))}</td><td>${cu(v.cust).name}</td><td>${dstr(v.date)}</td><td>${dstr(v.due)}</td><td class="num">${fmt(c.total)}</td><td class="num" style="font-weight:500">${fmt(c.total*(1-tx(v.pph).rate))}</td><td class="mono">${par?(par.no||'proyeksi'):'manual'}</td><td class="right"><a class="btn s" href="#invoice/${v.id}">Buka / Terbitkan</a></td></tr>`}).join(''):'<tr><td colspan="8" class="empty">Tidak ada proyeksi di rentang ini — <a href="#projwiz">susun proyeksi</a></td></tr>'}</tbody><tfoot><tr><td colspan="4">Total</td><td class="num">${fmt(dr.reduce((s,x)=>s+x.c.total,0))}</td><td class="num">${fmt(dr.reduce((s,x)=>s+x.c.total*(1-tx(x.v.pph).rate),0))}</td><td colspan="2"></td></tr></tfoot></table></div></div>`:''}`};

/* ---------- LOG AKTIVITAS ---------- */
let acF={who:'',type:'',q:'',from:'',to:''};
function logHref(l){if(l.entity==='invoice')return'invoice/'+l.id;if(l.entity==='receipt')return'receipt/'+l.id;if(l.entity==='commission')return'commpays';if(l.entity==='projection')return'projection';return''}
routes.activity=function(){const rows=S.log.filter(l=>(!acF.who||l.who===acF.who)&&(!acF.type||l.entity===acF.type)&&(!acF.q||l.m.toLowerCase().includes(acF.q))&&(!acF.from||l.t>=acF.from)&&(!acF.to||l.t<=acF.to));const TYPES={invoice:'Faktur',receipt:'Penerimaan',commission:'Komisi',projection:'Proyeksi',session:'Sesi'};return`<div class="top"><div><h1>Log Aktivitas</h1><p>Semua aktivitas pengguna: input, ubah, batalkan, pulihkan, setujui, bayar, masuk sistem. ${S.log.length} catatan.</p></div><button class="btn s" onclick="exportTable(document.querySelector('table.actlog'),'log-aktivitas.csv')">Ekspor CSV</button></div>${filterBar([`<select onchange="acF.who=this.value;nav()"><option value="">Pengguna: semua</option>${[...new Set(S.log.map(l=>l.who))].map(w=>`<option ${acF.who===w?'selected':''}>${esc(w)}</option>`).join('')}</select>`,`<select onchange="acF.type=this.value;nav()"><option value="">Jenis: semua</option>${Object.keys(TYPES).map(k=>`<option value="${k}" ${acF.type===k?'selected':''}>${TYPES[k]}</option>`).join('')}</select>`,`<input type="date" value="${acF.from}" onchange="acF.from=this.value;nav()">`,`<input type="date" value="${acF.to}" onchange="acF.to=this.value;nav()">`,`<input placeholder="Cari aktivitas" value="${esc(acF.q)}" oninput="acF.q=this.value.toLowerCase();nav()">`,`<span class="sp"></span><span class="cnt">${rows.length}</span>`])}<div class="card flush"><div class="tw"><table class="actlog"><thead><tr><th>Tanggal</th><th>Pengguna</th><th>Jenis</th><th>Dokumen</th><th>Aktivitas</th></tr></thead><tbody>${rows.length?rows.map(l=>{const href=logHref(l);const v=l.entity==='invoice'?S.invoices.find(x=>x.id===l.id):null;const r=l.entity==='receipt'?S.receipts.find(x=>x.id===l.id):null;return`<tr class="${href?'row':''}" onclick="${href?`go('${href}')`:''}"><td>${dstr(l.t)}</td><td>${esc(l.who)}</td><td>${TYPES[l.entity]||l.entity}</td><td class="mono">${v?(v.no||'proyeksi '+mlabel(ym(v.date))):r?r.no:l.entity==='commission'?se(l.id).name:l.entity==='projection'?(/^\d{4}-\d{2}$/.test(l.id)?mlong(l.id):''):'—'}</td><td style="white-space:normal">${esc(l.m)}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Belum ada aktivitas</td></tr>'}</tbody></table></div></div>`};


/* =====================================================================
   LAPISAN SUPABASE · auth, muat data, sinkronisasi, realtime
   ===================================================================== */
const SUPA_URL='https://vfffkwayrjepacmbasmo.supabase.co';
const SUPA_KEY='sb_publishable_hfSq3vLE6u05YHJMREJXOw_aNPDX2KO';
const AUTH_DOMAIN='upscale.local';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const COLL={customers:'customers',sellers:'sellers',items:'items',terms:'terms',taxes:'taxes',commRules:'comm_rules',banks:'banks',views:'views',quotes:'quotes',invoices:'invoices',receipts:'receipts',creditNotes:'credit_notes',commPayments:'comm_payments'};
const SETTINGS=['company','periods','seq'];
const ROLE_UP={master:'Master',finance:'Finance',accounting:'Accounting'};
let snap={},cloudReady=false,syncTimer=null,syncing=false,pendingSync=false;
function cloudError(e,ctx){console.error(ctx,e);toast((ctx?ctx+': ':'')+(e&&e.message||e))}

async function loadCloud(){
  const d=defaultState();
  S={company:d.company,periods:{},seq:{inv:1,quote:1,receipt:1,cn:1,cust:1},prefs:{lang:'id',theme:'auto'},users:[],log:[]};
  Object.keys(COLL).forEach(k=>S[k]=[]);
  const qs=Object.entries(COLL).map(([k,t])=>sb.from(t).select('id,data').then(r=>{if(r.error)throw r.error;S[k]=r.data.map(x=>x.data);snap[k]={};r.data.forEach(x=>snap[k][x.id]=JSON.stringify(x.data))}));
  qs.push(sb.from('settings').select('key,data').then(r=>{if(r.error)throw r.error;r.data.forEach(x=>{S[x.key]=x.data;snap[x.key]=JSON.stringify(x.data)})}));
  qs.push(sb.from('profiles').select('*').then(r=>{if(r.error)throw r.error;S.users=r.data.map(p=>({id:p.id,name:p.name,user:p.username,role:ROLE_UP[p.role],active:p.active,prefs:p.prefs}))}));
  qs.push(sb.from('activity_log').select('*').order('created_at',{ascending:false}).limit(500).then(r=>{if(r.error)throw r.error;S.log=r.data.map(l=>({t:l.t,who:l.who,entity:l.entity,id:l.doc_id,m:l.m}))}));
  await Promise.all(qs);
  // pertama kali: isi master data dasar (tanpa transaksi contoh)
  if(!snap.company&&me&&me.role!=='Accounting'){S.company=d.company;S.periods={};S.seq={inv:1,quote:1,receipt:1,cn:1,cust:1};S.taxes=d.taxes;S.terms=d.terms;S.banks=d.banks.map(b=>({...b,opening:0}));S.commRules=d.commRules;await syncNow();toast('Master data awal dibuat — isi pelanggan, penjual, dan katalog di Penjualan → Data')}
  cloudReady=true;
}
function diffSync(){const ops=[];for(const[k,t]of Object.entries(COLL)){const cur=S[k]||[];const prev=snap[k]||{};const seen={};cur.forEach(doc=>{if(!doc||!doc.id)return;const j=JSON.stringify(doc);seen[doc.id]=1;if(prev[doc.id]!==j)ops.push({t,up:{id:doc.id,data:doc},k,j})});Object.keys(prev).forEach(id=>{if(!seen[id])ops.push({t,del:id,k})})}
  SETTINGS.forEach(key=>{const j=JSON.stringify(S[key]||{});if(snap[key]!==j)ops.push({set:key,data:S[key],j})});return ops}
async function syncNow(){if(syncing){pendingSync=true;return}syncing=true;try{const ops=diffSync();const byT={};ops.filter(o=>o.up).forEach(o=>(byT[o.t]=byT[o.t]||[]).push(o));for(const t of Object.keys(byT)){const rows=byT[t].map(o=>o.up);const r=await sb.from(t).upsert(rows,{onConflict:'id'});if(r.error){cloudError(r.error,'Simpan '+t);continue}byT[t].forEach(o=>{snap[o.k]=snap[o.k]||{};snap[o.k][o.up.id]=o.j})}
  for(const o of ops.filter(o=>o.del)){const r=await sb.from(o.t).delete().eq('id',o.del);if(r.error){cloudError(r.error,'Hapus '+o.t);continue}delete snap[o.k][o.del]}
  for(const o of ops.filter(o=>o.set)){const r=await sb.from('settings').upsert({key:o.set,data:o.data},{onConflict:'key'});if(r.error){cloudError(r.error,'Simpan '+o.set);continue}snap[o.set]=o.j}
  const el=document.getElementById('syncdot');if(el)el.className='syncdot ok';}finally{syncing=false;if(pendingSync){pendingSync=false;syncNow()}}}
function save(){if(!cloudReady)return;const el=document.getElementById('syncdot');if(el)el.className='syncdot busy';clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,250)}
function logIt(entity,id,m){const t=iso(TODAY);S.log.unshift({t,who:me?me.name:'—',entity,id,m});if(cloudReady||entity==='session')sb.from('activity_log').insert({t,who:me?me.name:'—',user_id:me?me.id:null,entity,doc_id:id,m}).then(r=>{if(r.error)console.error(r.error)})}
async function doLogin(){const u=(document.getElementById('lu')||{}).value||'',p=(document.getElementById('lp')||{}).value||'';const btn=document.querySelector('.login .btn');if(btn){btn.disabled=true;btn.textContent='Memeriksa…'}const {error}=await sb.auth.signInWithPassword({email:u.trim().toLowerCase()+'@'+AUTH_DOMAIN,password:p});if(error){toast(t('Nama pengguna atau kata sandi salah'));if(btn){btn.disabled=false;btn.textContent=t('Masuk')}return}await afterAuth()}
async function afterAuth(){const {data:{user}}=await sb.auth.getUser();if(!user){loggedIn=false;return nav()}const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error||!p||!p.active){toast('Akun tidak aktif');await sb.auth.signOut();loggedIn=false;return nav()}me={id:p.id,name:p.name,user:p.username,role:ROLE_UP[p.role],prefs:p.prefs};loggedIn=true;try{await loadCloud()}catch(e){cloudError(e,'Muat data');}S.prefs=p.prefs||S.prefs;logIt('session',me.id,'Masuk ke sistem');subscribeRealtime();nav()}
async function logout(){logIt('session',me.id,'Keluar');await sb.auth.signOut();loggedIn=false;me=null;pages=[];lastRoute=null;cloudReady=false;snap={};nav()}
function setLang(x){S.prefs=S.prefs||{};S.prefs.lang=x;if(me)sb.from('profiles').update({prefs:S.prefs}).eq('id',me.id).then(()=>{});nav()}
function setTheme(x){S.prefs=S.prefs||{};S.prefs.theme=x;if(me)sb.from('profiles').update({prefs:S.prefs}).eq('id',me.id).then(()=>{});applyTheme();nav()}
function resetData(){if(!me||me.role!=='Master'){toast('Hanya Master');return}if(S.invoices.some(v=>v.status==='issued')&&!confirm('PERINGATAN: sudah ada faktur terbit. Memuat data contoh akan MENGGANTI semua data di server. Lanjutkan?'))return;if(!confirm('Muat data contoh ke server? Semua data saat ini diganti.'))return;const d=defaultState();Object.keys(COLL).forEach(k=>S[k]=d[k]);S.company=d.company;S.periods=d.periods;S.seq=d.seq;save();logIt('session',me.id,'Data contoh dimuat');toast('Data contoh dimuat');nav()}
let rtChan=null;function subscribeRealtime(){if(rtChan)return;rtChan=sb.channel('docs');Object.values(COLL).concat(['settings']).forEach(t=>rtChan.on('postgres_changes',{event:'*',schema:'public',table:t},payload=>{if(syncing)return;const mine=payload.new&&payload.new.updated_by===me.id;if(mine)return;refreshFromCloud()}));rtChan.subscribe()}
let refreshTimer=null;function refreshFromCloud(){clearTimeout(refreshTimer);refreshTimer=setTimeout(async()=>{if(dD){toast('Ada perubahan dari pengguna lain — akan dimuat setelah dokumen ini ditutup');return}try{const keepPrefs=S.prefs;await loadCloud();S.prefs=keepPrefs;nav();toast('Data diperbarui dari pengguna lain')}catch(e){cloudError(e,'Muat ulang')}},600)}
// kelola akun (Master) lewat Edge Function admin-users
async function adminUsers(body){const r=await sb.functions.invoke('admin-users',{body});const d=r.data||{};if(r.error||d.error){toast(d.error||r.error.message||'Gagal');return false}return d}
async function reloadUsers(){const r=await sb.from('profiles').select('*');if(!r.error)S.users=r.data.map(p=>({id:p.id,name:p.name,user:p.username,role:ROLE_UP[p.role],active:p.active,prefs:p.prefs}));nav()}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)await afterAuth();else{S=defaultState();S.users=[];loggedIn=false;nav()}sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&loggedIn){loggedIn=false;nav()}})}
boot();


</script>
