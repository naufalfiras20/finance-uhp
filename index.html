routes.creditnotes=function(){return`<div class="top"><div><h1>Nota Kredit</h1><p>Pengurangan nilai faktur yang sudah terbit (revisi setelah dibayar, pembatalan sebagian)</p></div><a class="btn p" href="#creditnote/new">Nota kredit baru</a></div><div class="card flush"><div class="tw"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Faktur</th><th>Pelanggan</th><th>Alasan</th><th class="num">Nilai</th><th>Status</th></tr></thead><tbody>${S.creditNotes.length?S.creditNotes.map(n=>{const v=S.invoices.find(x=>x.id===n.inv)||{};return`<tr class="row" onclick="go('creditnote/${n.id}')"><td class="mono">${n.no}</td><td>${dstr(n.date)}</td><td class="mono">${v.no||'—'}</td><td>${cu(v.cust).name}</td><td>${esc(n.reason)}</td><td class="num">${fmt(n.amount)}</td><td>${n.status==='void'?'<span class="st r">Dibatalkan</span>':'<span class="st g">Aktif</span>'}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Belum ada</td></tr>'}</tbody></table></div></div>`};
routes.creditnote=function(arg){const[id,qs]=arg.split('?');const isNew=id==='new';if(!dD||dD.id!==id){const pre=new URLSearchParams(qs||'');dD=isNew?{id:'new',no:'CN.'+TODAY.getFullYear()+'.'+pad(TODAY.getMonth()+1)+'.'+String(S.seq.cn).padStart(4,'0'),inv:pre.get('inv')||(S.invoices.find(v=>v.status==='issued')||{}).id,date:iso(TODAY),amount:0,reason:'',refund:false}:JSON.parse(JSON.stringify(S.creditNotes.find(n=>n.id===id)))}const n=dD;const v=S.invoices.find(x=>x.id===n.inv);const c=v?calc(v):null;
 return`<div class="top"><div><h1>${isNew?'Nota kredit baru':n.no}</h1><p>Mengurangi nilai terutang faktur. Kalau faktur sudah lunas, selisih menjadi uang muka pelanggan atau dikembalikan.</p></div></div><div class="card" style="max-width:760px"><div class="doc-head"><div><div class="row"><label>Faktur <b>*</b></label><select ${isNew?'':'disabled'} onchange="dD.inv=this.value;nav()">${S.invoices.filter(x=>x.status==='issued').map(x=>`<option value="${x.id}" ${x.id===n.inv?'selected':''}>${x.no} · ${cu(x.cust).name} · ${fmtS(calc(x).total)}</option>`).join('')}</select></div><div class="row"><label>Nilai <b>*</b></label><input type="number" value="${n.amount||''}" onchange="dD.amount=+this.value;nav()"></div></div><div><div class="row"><label>Nomor</label><input value="${n.no}" disabled></div><div class="row"><label>Tanggal</label><input type="date" value="${n.date}" onchange="dD.date=this.value"></div></div></div><div class="field"><label class="f">Alasan</label><input value="${esc(n.reason)}" placeholder="mis. revisi scope setelah invoice terbit" oninput="dD.reason=this.value"></div>${c?`<div class="kv"><span>Total faktur</span><span>${fmt(c.total)}</span><span>Sudah dibayar</span><span>${fmt(c.paid)}</span><span>Sisa setelah nota kredit</span><span>${fmt(c.total-(isNew?n.amount:0)-c.paid+(isNew?0:0))}</span></div>${isNew&&n.amount>c.rem&&c.rem>=0?`<div class="note a mt">Nilai nota kredit melebihi sisa piutang. Kelebihan ${fmt(n.amount-c.rem)} akan menjadi <b>uang muka pelanggan</b>.</div>`:''}`:''}</div>${vtool([isNew?`<button class="btn p" ${can('pay')?'':'disabled'} onclick="saveCN()">Simpan</button>`:'',!isNew&&n.status!=='void'&&can('pay')?`<button class="btn d" onclick="voidCN('${n.id}')">Batalkan</button>`:'',!isNew&&n.status==='void'?`<button class="btn" onclick="unvoidCN('${n.id}')">Aktifkan kembali</button><span class="l" style="color:var(--red)">Dibatalkan · ${esc(n.voidReason||'')}</span>`:'',`<a class="btn" href="#creditnotes">Tutup</a>`])}`};
function saveCN(){const n=dD;if(!n.amount||!n.inv){toast('Faktur dan nilai wajib');return}const v=S.invoices.find(x=>x.id===n.inv);if(n.amount>calc(v).total){toast('Nota kredit melebihi total faktur');return}if(!n.reason.trim()){toast('Alasan wajib');return}const before=calc(v);n.id='n'+Date.now();n.no=nextNo('cn');S.creditNotes.push(n);const after=calc(v);if(after.rem<0){cu(v.cust).credit=(cu(v.cust).credit||0)+(-after.rem)}logIt('invoice',v.id,'Nota kredit '+n.no+' '+fmt(n.amount)+' · '+n.reason);save();toast('Nota kredit '+n.no+' disimpan');finishDoc(location.hash.replace('#',''),'creditnotes')}

/* ---------- MONITORING KOMISI (Finance: piutang komisi penjual → bayar → lunas) ---------- */
// alokasi pembayaran komisi ke faktur: alokasi eksplisit dari form bayar; pembayaran lama tanpa alokasi → FIFO
function commAlloc(sellerId){const vs=S.invoices.filter(v=>v.status==='issued'&&v.comm.on&&v.comm.approved&&v.seller===sellerId).sort((a,b)=>a.date.localeCompare(b.date));const out={};vs.forEach(v=>out[v.id]={amt:calc(v).comm.amount,paid:0});let pool=0;S.commPayments.filter(p=>p.seller===sellerId).forEach(p=>{if(p.alloc&&p.alloc.length)p.alloc.forEach(a=>{if(out[a.inv])out[a.inv].paid+=a.amt});else pool+=p.amount});vs.forEach(v=>{const o=out[v.id];const use=Math.min(Math.max(0,o.amt-o.paid),pool);o.paid+=use;pool-=use});Object.values(out).forEach(o=>o.st=o.paid>=o.amt?'paid':o.paid>0?'partial':'unpaid');return out}
let cmTab='all',cmSel={},cmF={seller:'',m:''};
function commRows(){const al={};S.sellers.forEach(s=>al[s.id]=commAlloc(s.id));return S.invoices.filter(v=>v.status==='issued'&&v.comm.on).map(v=>{const c=calc(v);const a=al[v.seller][v.id];const amt=c.comm.amount,paid=a?a.paid:0;const st=!v.comm.approved?'pending':paid>=amt?'paid':paid>0?'partial':'unpaid';return{v,c,amt,paid,rem:v.comm.approved?amt-paid:0,st,cl:c.total?Math.min(1,c.paid/c.total):0}}).sort((a,b)=>b.v.date.localeCompare(a.v.date))}
routes.commissions=function(){const all=commRows();const rows=all.filter(r=>(!cmF.seller||r.v.seller===cmF.seller)&&(!cmF.m||ym(r.v.date)===cmF.m));const by=k=>rows.filter(r=>r.st===k);const tabRows=cmTab==='all'?rows:by(cmTab);const tot=rows.reduce((s,r)=>s+r.amt,0),pend=by('pending').reduce((s,r)=>s+r.amt,0),paid=rows.reduce((s,r)=>s+r.paid,0),due=rows.reduce((s,r)=>s+r.rem,0);const months=[...new Set(all.map(r=>ym(r.v.date)))].sort().reverse();const sel=Object.keys(cmSel).filter(k=>cmSel[k]);const selRows=all.filter(r=>cmSel[r.v.id]);const selSellers=[...new Set(selRows.map(r=>r.v.seller))];
 const ppl=S.sellers.map(s=>{const rs=all.filter(r=>r.v.seller===s.id);return{s,n:rs.length,pend:rs.filter(r=>r.st==='pending').reduce((a,r)=>a+r.amt,0),acc:rs.filter(r=>r.st!=='pending').reduce((a,r)=>a+r.amt,0),paid:rs.reduce((a,r)=>a+r.paid,0),due:rs.reduce((a,r)=>a+r.rem,0),ready:rs.filter(r=>r.st!=='pending'&&r.cl>=1).reduce((a,r)=>a+r.rem,0)}});
 return`<div class="top"><div><h1>Monitoring Komisi</h1><p>Komisi terbentuk saat faktur terbit → <b>disetujui</b> Master/Finance → menjadi <b>piutang komisi penjual</b> (hutang perusahaan) → <b>dibayar</b>. Pilih faktur, lalu bayar.</p></div><div class="flex"><a class="btn" href="#report/commdebt">Laporan hutang komisi</a><button class="btn g" onclick="payCommModal(cmF.seller||(ppl.find(p=>p.due>0)||ppl[0]).s.id,[])">+ Bayar komisi</button></div></div>
 <div class="grid g4 mb"><div class="card kpi"><p class="lbl">Komisi terbentuk</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();cmTab='all';nav()">${fmtS(tot)}</a></div><div class="d">${rows.length} faktur${cmF.seller||cmF.m?' · sesuai filter':''}</div></div><div class="card kpi"><p class="lbl">Menunggu persetujuan</p><div class="v" style="color:var(--amber)"><a href="#" style="color:inherit" onclick="event.preventDefault();cmTab='pending';nav()">${fmtS(pend)}</a></div><div class="d">${by('pending').length} faktur · belum jadi hutang</div></div><div class="card kpi"><p class="lbl">Piutang komisi penjual (belum dibayar)</p><div class="v" style="color:var(--red)"><a href="#" style="color:inherit" onclick="event.preventDefault();cmTab='unpaid';nav()">${fmtS(due)}</a></div><div class="d">${by('unpaid').length} belum · ${by('partial').length} sebagian</div></div><div class="card kpi"><p class="lbl">Sudah dibayar</p><div class="v" style="color:var(--green)"><a href="#commpays" style="color:inherit">${fmtS(paid)}</a></div><div class="d">${S.commPayments.filter(p=>p.status!=='void').length} pembayaran · <a href="#commpays">riwayat</a></div></div></div>
 <div class="card flush mb"><h2>Per penjual</h2><div class="tw"><table><thead><tr><th>Penjual</th><th>Tipe</th><th class="num">Faktur</th><th class="num">Menunggu</th><th class="num">Disetujui</th><th class="num">Dibayar</th><th class="num">Piutang komisi</th><th class="num">Siap bayar (klien lunas)</th><th></th></tr></thead><tbody>${ppl.map(p=>`<tr><td><b style="font-weight:500">${esc(p.s.name)}</b></td><td><span class="tag">${p.s.type}</span></td>${dcell(p.n,`cmF.seller='${p.s.id}';cmTab='all';nav()`)}${dcell(p.pend?fmt(p.pend):'—',`cmF.seller='${p.s.id}';cmTab='pending';nav()`)}${dcell(fmt(p.acc),`drill('Komisi disetujui · ${esc(p.s.name)}',commRows().filter(r=>r.v.seller==='${p.s.id}'&&r.st!=='pending').map(r=>({...invRow(r.v),amt:r.amt})),'Komisi')`)}${dcell(fmt(p.paid),`drill('Komisi dibayar · ${esc(p.s.name)}',commRows().filter(r=>r.v.seller==='${p.s.id}'&&r.paid>0).map(r=>({...invRow(r.v),amt:r.paid})),'Dibayar')`)}${dcell(fmt(p.due),`cmF.seller='${p.s.id}';cmTab='unpaid';nav()`,p.due>0?'':'')}${dcell(fmt(p.ready),`drill('Siap bayar (klien lunas) · ${esc(p.s.name)}',commRows().filter(r=>r.v.seller==='${p.s.id}'&&r.st!=='pending'&&r.cl>=1&&r.rem>0).map(r=>({...invRow(r.v),amt:r.rem})),'Sisa komisi')`)}<td class="right">${p.due>0&&can('pay')?`<button class="btn s" onclick="payCommModal('${p.s.id}',[])">Bayar</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
 ${filterBar([`<select onchange="cmF.seller=this.value;nav()"><option value="">Penjual: semua</option>${S.sellers.map(s=>`<option value="${s.id}" ${cmF.seller===s.id?'selected':''}>${esc(s.name)} · ${s.type}</option>`).join('')}</select>`,`<select onchange="cmF.m=this.value;nav()"><option value="">Bulan faktur: semua</option>${months.map(m=>`<option value="${m}" ${cmF.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,`<span class="sp"></span>`,(cmF.seller||cmF.m)?`<button class="btn q s" onclick="cmF={seller:'',m:''};nav()">Hapus filter</button>`:''])}
 <div class="tabs">${[['all','Semua',rows.length],['pending','Menunggu persetujuan',by('pending').length],['unpaid','Belum dibayar',by('unpaid').length],['partial','Sebagian',by('partial').length],['paid','Sudah dibayar',by('paid').length],['hist','Riwayat pembayaran',S.commPayments.length]].map(t=>`<button class="${cmTab===t[0]?'on':''}" onclick="cmTab='${t[0]}';nav()">${t[1]}<span>${t[2]}</span></button>`).join('')}</div>
 ${sel.length?`<div class="selbar"><b>${sel.length} faktur dipilih</b> · komisi ${fmt(selRows.reduce((s,r)=>s+r.amt,0))} · sisa belum dibayar ${fmt(selRows.reduce((s,r)=>s+r.rem,0))}<span class="sp" style="flex:1"></span>${selRows.some(r=>r.st==='pending')&&can('pay')?`<button class="btn s" onclick="selRowsApprove()">Setujui yang dipilih</button>`:''}${selRows.some(r=>r.rem>0)&&can('pay')?`<button class="btn g s" ${selSellers.length>1?'disabled title="Pilih faktur satu penjual saja"':''} onclick="payCommModal('${selSellers[0]}',${JSON.stringify(selRows.filter(r=>r.rem>0).map(r=>r.v.id)).replace(/"/g,"'")})">Bayar komisi yang dipilih${selSellers.length>1?' (1 penjual saja)':''}</button>`:''}<button class="btn q s" onclick="cmSel={};nav()">Batal pilih</button></div>`:''}
 ${cmTab==='hist'?`<div class="card flush"><div class="tw"><table><thead><tr><th>Tanggal</th><th>Penjual</th><th>Referensi</th><th>Alokasi ke faktur</th><th class="num">Nominal</th><th></th></tr></thead><tbody>${S.commPayments.length?S.commPayments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${dstr(p.date)}</td><td>${se(p.seller).name}</td><td>${esc(p.ref||'')}</td><td style="white-space:normal">${p.alloc&&p.alloc.length?p.alloc.map(a=>`<a href="#invoice/${a.inv}" class="mono">${(S.invoices.find(v=>v.id===a.inv)||{}).no||'?'}</a> ${fmtS(a.amt)}`).join(' · '):'<span class="muted">otomatis (FIFO faktur terlama)</span>'}</td><td class="num">${fmt(p.amount)}</td><td class="right">${can('pay')?`${p.status==='void'?'<span class="st r">Dibatalkan</span>':`<button class="btn q s d" onclick="voidCommPay('${p.id}')">Batalkan</button>`}`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada pembayaran komisi</td></tr>'}</tbody></table></div></div>`:
 `<div class="card flush"><div class="tw"><table><thead><tr><th style="width:30px"><input type="checkbox" ${tabRows.length&&tabRows.every(r=>cmSel[r.v.id])?'checked':''} onchange="${JSON.stringify(tabRows.map(r=>r.v.id)).replace(/"/g,"'")}.forEach(id=>cmSel[id]=this.checked);nav()"></th><th>Faktur</th><th>Tanggal</th><th>Pelanggan</th><th>Penjual</th><th class="num">Basis</th><th>Hitung</th><th class="num">Komisi</th><th>Klien bayar</th><th>Persetujuan</th><th class="num">Dibayar</th><th class="num">Sisa</th><th>Status</th><th></th></tr></thead><tbody>${tabRows.length?tabRows.map(r=>{const v=r.v;return`<tr><td><input type="checkbox" ${cmSel[v.id]?'checked':''} onchange="cmSel['${v.id}']=this.checked;nav()"></td><td class="mono"><a href="#invoice/${v.id}">${v.no}</a></td><td>${dstr(v.date)}</td><td>${cu(v.cust).name}</td><td>${se(v.seller).name} <span class="tag">${se(v.seller).type}</span></td><td class="num">${fmt(r.c.total)}</td><td class="muted small">${r.c.comm.desc}</td><td class="num" style="font-weight:500">${fmt(r.amt)}</td><td>${r.cl>=1?'<span class="chip g">Lunas</span>':r.cl>0?`<span class="chip a">${pct(r.cl)}</span>`:'<span class="chip r">Belum</span>'}</td><td>${v.comm.approved?'<span class="st g">Disetujui</span>':'<span class="st a">Menunggu</span>'}</td><td class="num">${r.paid?fmt(r.paid):'—'}</td><td class="num" style="color:${r.rem>0?'var(--red)':'inherit'}">${v.comm.approved?fmt(r.rem):'—'}</td><td>${{pending:'<span class="st a">Menunggu</span>',unpaid:'<span class="st r">Belum dibayar</span>',partial:'<span class="st a">Sebagian</span>',paid:'<span class="st g">Dibayar</span>'}[r.st]}</td><td class="right" style="white-space:nowrap">${r.st==='pending'&&can('pay')?`<button class="btn s" onclick="approveComm('${v.id}')">Setujui</button>`:''}${r.rem>0&&can('pay')?`<button class="btn s g" onclick="payCommModal('${v.seller}',['${v.id}'])">Bayar</button>`:''}</td></tr>`}).join(''):'<tr><td colspan="14" class="empty">Kosong</td></tr>'}</tbody></table></div></div>`}`};
function selRowsApprove(){let n=0;Object.keys(cmSel).filter(k=>cmSel[k]).forEach(id=>{const v=S.invoices.find(x=>x.id===id);if(v&&!v.comm.approved){v.comm.approved=true;logIt('invoice',id,'Komisi disetujui');n++}});save();toast(n+' komisi disetujui');nav()}
function payCommModal(sellerId,preIds){const s=se(sellerId);const rows=commRows().filter(r=>r.v.seller===sellerId&&r.v.comm.approved&&r.rem>0).sort((a,b)=>a.v.date.localeCompare(b.v.date));if(!rows.length){toast('Tidak ada piutang komisi untuk '+s.name);return}const pre=preIds.length?preIds:rows.map(r=>r.v.id);
 modal(`<h2>Bayar komisi · ${esc(s.name)} <span class="tag">${s.type}</span></h2><p class="small muted" style="margin:0 0 12px">Piutang komisi ${fmt(rows.reduce((a,r)=>a+r.rem,0))} dari ${rows.length} faktur. Centang faktur yang dibayar; nominal bisa diubah untuk bayar sebagian.</p><div class="grid g3"><div class="field"><label class="f">Tanggal bayar</label><input type="date" id="cpD" value="${iso(TODAY)}"></div><div class="field"><label class="f">Bank / kas</label><select id="cpB">${S.banks.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label class="f">Referensi</label><input id="cpR" placeholder="mis. Komisi ${mlong(ym(iso(TODAY)))}"></div></div><div class="tw"><table class="grid-items"><thead><tr><th style="width:30px"></th><th>Faktur</th><th>Pelanggan</th><th>Klien bayar</th><th class="num">Sisa komisi</th><th class="num" style="width:150px">Bayar</th></tr></thead><tbody>${rows.map(r=>`<tr><td><input type="checkbox" class="cpC" data-inv="${r.v.id}" ${pre.includes(r.v.id)?'checked':''} onchange="cpTot()"></td><td class="mono" style="padding-top:11px">${r.v.no}</td><td style="padding-top:11px">${cu(r.v.cust).name}</td><td style="padding-top:11px">${r.cl>=1?'<span class="chip g">Lunas</span>':`<span class="chip a">${pct(r.cl)} · belum lunas</span>`}</td><td class="num" style="padding-top:11px">${fmt(r.rem)}</td><td><input type="number" class="cpA" data-inv="${r.v.id}" value="${r.rem}" max="${r.rem}" oninput="cpTot()"></td></tr>`).join('')}</tbody></table></div><div class="flex mt" style="justify-content:flex-end;gap:14px;font-size:14px"><span class="muted">Total dibayar</span><b id="cpT">${fmt(rows.filter(r=>pre.includes(r.v.id)).reduce((a,r)=>a+r.rem,0))}</b></div><div class="mfoot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn g" onclick="payCommSave('${sellerId}')">Simpan pembayaran</button></div>`,true)}
function cpTot(){let t=0;document.querySelectorAll('.cpC:checked').forEach(c=>{const a=document.querySelector('.cpA[data-inv="'+c.dataset.inv+'"]');t+=+a.value||0});document.getElementById('cpT').textContent=fmt(t)}
function payCommSave(sellerId){const alloc=[];let warn=false;document.querySelectorAll('.cpC:checked').forEach(c=>{const a=document.querySelector('.cpA[data-inv="'+c.dataset.inv+'"]');const amt=Math.round(+a.value||0);if(amt>0){if(amt>+a.max+0.5){toast('Nominal melebihi sisa komisi');throw new Error('over')}alloc.push({inv:c.dataset.inv,amt});const v=S.invoices.find(x=>x.id===c.dataset.inv);if(calc(v).rem>0)warn=true}});if(!alloc.length){toast('Pilih minimal satu faktur');return}if(warn&&!confirm('Ada faktur yang klien belum lunas. Tetap bayar komisinya?'))return;const amount=alloc.reduce((s,a)=>s+a.amt,0);S.commPayments.push({id:'cp'+Date.now(),date:document.getElementById('cpD').value,seller:sellerId,amount,ref:document.getElementById('cpR').value,bankId:document.getElementById('cpB').value,bank:document.getElementById('cpB').selectedOptions[0].textContent,alloc});alloc.forEach(a=>logIt('invoice',a.inv,'Komisi dibayar '+fmt(a.amt)+' ke '+se(sellerId).name));logIt('commission',sellerId,'Bayar komisi '+fmt(amount));save();closeModal();cmSel={};toast('Komisi '+fmt(amount)+' dibayar ke '+se(sellerId).name);nav()}
routes.commpay=function(){setTimeout(()=>payCommModal((S.sellers.find(s=>s.active)||S.sellers[0]).id,[]),0);return routes.commissions()};

/* ---------- PENAGIHAN PIUTANG (Finance) ---------- */
let colTab='all';
routes.collections=function(){const open=S.invoices.filter(v=>v.status==='issued'&&calc(v).rem>0).map(v=>{const c=calc(v);const f=(v.followups||[]).slice(-1)[0];return{v,c,d:Math.max(0,Math.round((TODAY-D(v.due))/864e5)),f}}).sort((a,b)=>b.d-a.d);const rows=colTab==='all'?open:colTab==='od'?open.filter(x=>x.d>0):colTab==='promise'?open.filter(x=>x.v.collStatus==='promise'):colTab==='none'?open.filter(x=>!x.v.collStatus||x.v.collStatus==='none'):colTab==='dispute'?open.filter(x=>x.v.collStatus==='dispute'):open.filter(x=>x.v.hold);const tot=open.reduce((s,x)=>s+x.c.rem,0),od=open.filter(x=>x.d>0),late=open.filter(x=>x.v.collStatus==='promise'&&x.v.promise&&x.v.promise<iso(TODAY));
 return`<div class="top"><div><h1>Penagihan Piutang</h1><p>Daftar kerja Finance: siapa ditagih hari ini, apa yang sudah dilakukan, kapan dijanjikan</p></div></div>

function cashProj(from,to,tiers){tiers=tiers||{received:true,issued:true,draft:true};const out=[];if(tiers.received)S.receipts.filter(r=>r.status!=='void').forEach(r=>r.lines.forEach(l=>{const v=S.invoices.find(x=>x.id===l.inv);out.push({tier:'received',date:r.date,amount:(+l.cash||0),label:r.no+' · '+((v||{}).no||''),who:cu(r.cust).name,id:v?v.id:null,rid:r.id})}));S.invoices.forEach(v=>{if(v.status==='issued'&&tiers.issued){const c=calc(v);if(c.rem<=0||v.hold)return;const d=D(v.expect||v.due);out.push({tier:'issued',date:iso(d<TODAY?addDays(TODAY,7):d),amount:c.rem*(1-tx(cu(v.cust).pph).rate),label:v.no,who:cu(v.cust).name,id:v.id})}else if(v.status==='draft'&&tiers.draft){const c=calc(v);const d=D(v.due);out.push({tier:'draft',date:iso(d<TODAY?addDays(TODAY,7):d),amount:c.total*(1-tx(v.pph).rate),label:'Proyeksi · '+mlabel(ym(v.date)),who:cu(v.cust).name,id:v.id})}});return out.filter(p=>p.date>=from&&p.date<=to).sort((a,b)=>a.date.localeCompare(b.date))}
function buckets(o){const ks=[];if(o.gran==='month'){let d=D(o.from.slice(0,7)+'-01');const end=D(o.to);while(d<=end){ks.push(ym(iso(d)));d=new Date(d.getFullYear(),d.getMonth()+1,1)}}else if(o.gran==='week'){let d=D(o.from);d.setDate(d.getDate()-((d.getDay()+6)%7));const end=D(o.to);while(d<=end){ks.push(iso(d));d=addDays(d,7)}}else{let d=D(o.from);const end=D(o.to);while(d<=end){ks.push(iso(d));d=addDays(d,1)}}return ks}
function keyOf(date,o){if(o.gran==='month')return ym(date);if(o.gran==='week'){const d=D(date);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}return date}

const TIER={received:['Sudah masuk (kas diterima)','var(--green)'],issued:['Belum lunas (piutang, jatuh tempo)','var(--bar1)'],draft:['Belum terbit (faktur berulang)','var(--bar2)']};
function cashSummary(from,to,t){const d=cashProj(from,to,t);const sum=k=>d.filter(p=>p.tier===k).reduce((s,p)=>s+p.amount,0);return`<div class="kpi3">${['received','issued','draft'].map(k=>`<div class="card"><p class="lbl"><i style="background:${TIER[k][1]}"></i>${TIER[k][0]}</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('${TIER[k][0]} · ${dstr(from)} – ${dstr(to)}',cashProj('${from}','${to}').filter(p=>p.tier==='${k}').map(p=>({no:p.label,who:p.who,date:p.date,amt:p.amount,href:p.tier==='received'?'receipt/'+p.rid:'invoice/'+p.id})),'Nominal')">${fmtS(sum(k))}</a></div><div class="d">${d.filter(p=>p.tier===k).length} transaksi</div></div>`).join('')}</div>`}
function chart(o){const ks=buckets(o),data=cashProj(o.from,o.to,o.tiers||tiers),by={};ks.forEach(k=>by[k]={received:0,issued:0,draft:0,items:[]});data.forEach(p=>{const k=keyOf(p.date,o);if(by[k]){by[k][p.tier]+=p.amount;by[k].items.push(p)}});chartData=by;const max=Math.max(1,...ks.map(k=>by[k].received+by[k].issued+by[k].draft));const W=o.compact?640:900,H=o.compact?210:300,L=64,B=26,T=16,pw=W-L-16,ph=H-T-B,n=ks.length,slot=pw/n,bw=Math.max(2,Math.min(28,slot*.62));let g='';for(let k=0;k<=3;k++){const y=T+ph-ph*k/3;g+=`<line class="grid" x1="${L}" x2="${W-16}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmtS(max*k/3)}</text>`}let bars='';const every=n>40?Math.ceil(n/12):n>14?Math.ceil(n/8):1;ks.forEach((k,i)=>{const x=L+slot*i+(slot-bw)/2;let y=T+ph;[['received',TIER.received[1]],['issued',TIER.issued[1]],['draft',TIER.draft[1]]].forEach(([t,col])=>{const v=by[k][t];if(!v)return;const h=ph*v/max;y-=h;bars+=`<rect class="bar ${selKey===k?'sel':''}" x="${x}" y="${y+1}" width="${bw}" height="${Math.max(0,h-2)}" rx="${Math.min(4,bw/2)}" fill="${col}" onmousemove="showTip(event,'${k}','${o.gran}')" onmouseleave="hideTip()" onclick="barClick('${k}','${o.gran}')"/>`});bars+=`<rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ph}" fill="transparent" onmousemove="showTip(event,'${k}','${o.gran}')" onmouseleave="hideTip()" onclick="barClick('${k}','${o.gran}')" style="cursor:pointer"/>`;const tot=by[k].received+by[k].issued+by[k].draft;if(tot&&(n<=14||slot>40))bars+=`<text class="lbl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtS(tot)}</text>`;if(i%every===0)bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${o.gran==='month'?mlabel(k):D(k).toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</text>`});return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${bars}</svg><div class="legend mt">${['received','issued','draft'].map(k=>`<span><i style="background:${TIER[k][1]}"></i>${TIER[k][0]}</span>`).join('')}</div>`}
function showTip(e,k,gran){const b=chartData[k];if(!b||!b.items.length){hideTip();return}const t=document.getElementById('tip');t.innerHTML=`<b>${gran==='month'?mlong(k):dstr(k)}</b>${['received','issued','draft'].filter(x=>b[x]).map(x=>`<div class="r"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${TIER[x][1]};margin-right:6px"></i>${TIER[x][0].split(' (')[0]}</span><span>${fmtS(b[x])}</span></div>`).join('')}<div class="r" style="border-top:1px solid var(--hair);margin-top:4px;padding-top:4px"><span class="muted">Rincian</span><span></span></div>${b.items.slice(0,6).map(p=>`<div class="r"><span class="muted">${p.who} · ${p.label}</span><span>${fmtS(p.amount)}</span></div>`).join('')}${b.items.length>6?`<div class="r muted"><span>+${b.items.length-6} lagi</span><span></span></div>`:''}<div class="r t"><span>Total</span><span>${fmt(b.received+b.issued+b.draft)}</span></div>`;t.style.display='block';t.style.left=Math.min(e.clientX+14,window.innerWidth-260)+'px';t.style.top=Math.min(e.clientY+14,window.innerHeight-160)+'px'}
function barClick(k,gran){const b=chartData[k];const rows=(b?b.items:[]).map(p=>({no:p.label,who:p.who,date:p.date,amt:p.amount,href:p.tier==='received'?'receipt/'+p.rid:'invoice/'+p.id}));if(location.hash==='#report/cashproj'){selKey=k;nav()}drill((gran==='month'?mlong(k):dstr(k))+' · sumber proyeksi kas',rows,'Nominal')}

function commRulesHtml(){return `<div class="card flush" style="max-width:860px"><div class="tw"><table><thead><tr><th>Tipe penjual</th><th>Berlaku untuk</th><th>Cara</th><th class="num">Besaran</th><th>Sejak</th><th>Catatan</th><th></th></tr></thead><tbody>${S.commRules.map(r=>`<tr><td><span class="tag">${r.seller}</span></td><td>${r.seq==='1'?'Faktur ke-1 pelanggan':r.seq==='2+'?'Faktur ke-2 dst':'Semua faktur'}</td><td>${r.mode==='pct'?'% dari total faktur':'Nominal tetap'}</td><td class="num">${r.mode==='pct'?r.value+'%':fmt(r.value)}</td><td>${dstr(r.effective)}</td><td class="muted">${esc(r.note)}</td><td class="right"><button class="btn q s d" onclick="S.commRules=S.commRules.filter(x=>x.id!=='${r.id}');save();nav()">Hapus</button></td></tr>`).join('')}</tbody></table></div></div><div class="card mt" style="max-width:860px"><h2>Tambah aturan</h2><div class="grid g4"><div class="field"><label class="f">Tipe penjual</label><select id="crS"><option>BD</option><option>AM</option></select></div><div class="field"><label class="f">Berlaku untuk</label><select id="crQ"><option value="1">Faktur ke-1</option><option value="2+">Faktur ke-2 dst</option><option value="all">Semua</option></select></div><div class="field"><label class="f">Cara</label><select id="crM"><option value="pct">% dari total</option><option value="fixed">Nominal tetap</option></select></div><div class="field"><label class="f">Besaran</label><input type="number" id="crV" step="any" placeholder="1 = 1%"></div></div><div class="grid g2"><div class="field"><label class="f">Berlaku sejak</label><input type="date" id="crE" value="${iso(TODAY)}"></div><div class="field"><label class="f">Catatan</label><input id="crN"></div></div><button class="btn p" onclick="const v=+document.getElementById('crV').value;if(!v){toast('Besaran wajib');return}S.commRules.push({id:'r'+Date.now(),seller:document.getElementById('crS').value,seq:document.getElementById('crQ').value,mode:document.getElementById('crM').value,value:v,base:'net',effective:document.getElementById('crE').value,note:document.getElementById('crN').value});save();toast('Aturan disimpan');nav()">Simpan aturan</button><p class="small muted mt8">Aturan terbaru yang cocok dipakai. Faktur yang sudah terbit tidak berubah. Per faktur tetap bisa pakai % / Rp custom.</p></div>`}
/* ---------- PDF (A4, jsPDF) ---------- */
function pdfNotes(v,tot){const t=tx(v.pph||'none');if(!t.rate)return'';const w=Math.round(tot*t.rate);const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');return(v.pph==='pph_final'?S.company.pphNoteFinal:S.company.pphNote23).replace('{pph}',rp(w)).replace('{net}',rp(tot-w))}
function buildPdf(kind,d){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,M=16;let y=18;const c=d.cust?cu(d.cust):{name:d.custName||'',legal:''};const sub=d.lines.reduce((s,l)=>s+lineAmt(l),0),tot=Math.max(0,sub+(+d.addon||0)-(+d.disc||0));const money=n=>'Rp'+Math.round(n).toLocaleString('en-US')+'.00';const long=s=>s?D(s).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'-';
 doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(30);doc.text('UPSCALE',M,y+8);doc.setTextColor(240,118,61);doc.text('HOUSE',M+19,y+8);doc.setTextColor(30);doc.text('PROJECT',M,y+13);
 doc.setFont('helvetica','normal');doc.setFontSize(30);doc.text(kind.toUpperCase(),W-M,y+4,{align:'right'});doc.setFontSize(9.5);doc.setFont('helvetica','bold');doc.text(S.company.name,W-M,y+14,{align:'right'});doc.setFont('helvetica','normal');S.company.addr.split('\n').forEach((ln,i)=>doc.text(ln,W-M,y+19+i*4.5,{align:'right'}));y+=42;doc.setDrawColor(225);doc.line(M,y,W-M,y);y+=8;
 doc.setFontSize(8.5);doc.setTextColor(150);doc.text('BILL TO',M,y);doc.setTextColor(30);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text(c.legal||c.name,M,y+5);doc.setFont('helvetica','normal');if(c.legal)doc.text(c.name,M,y+10);
 const kv=[[kind==='Invoice'?'Invoice Number:':'Quotation Number:',d.no||'-'],[kind==='Invoice'?'Invoice Date:':'Date:',long(d.date)],[kind==='Invoice'?'Payment Due:':'Valid Until:',long(kind==='Invoice'?d.due:d.valid)]];if(d.po)kv.push(['P.O. Number:',d.po]);kv.forEach((r,i)=>{doc.setFont('helvetica','bold');doc.text(r[0],W-M-55,y+i*5.5,{align:'right'});doc.setFont('helvetica','normal');doc.text(String(r[1]),W-M,y+i*5.5,{align:'right'})});const ay=y+kv.length*5.5+1;doc.setFillColor(242);doc.rect(W-M-88,ay-4,88,7,'F');doc.setFont('helvetica','bold');doc.text('Amount Due (IDR):',W-M-55,ay+1,{align:'right'});doc.text(money(tot),W-M,ay+1,{align:'right'});y=ay+16;
 doc.setFillColor(240,118,61);doc.rect(M,y-5,W-2*M,8,'F');doc.setTextColor(30);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Items',M+2,y);doc.text('Quantity',M+112,y,{align:'right'});doc.text('Price',M+145,y,{align:'right'});doc.text('Amount',W-M-2,y,{align:'right'});y+=9;doc.setFont('helvetica','normal');
 d.lines.forEach(l=>{doc.setFont('helvetica','bold');doc.text(l.name||'-',M+2,y);doc.setFont('helvetica','normal');doc.text(String(l.qty),M+112,y,{align:'right'});doc.text(money(l.price),M+145,y,{align:'right'});doc.text(money(lineAmt(l)),W-M-2,y,{align:'right'});let yy=y+4.5;if(l.desc){const lines=doc.splitTextToSize(l.desc,92);doc.setFontSize(8.5);lines.forEach(t=>{doc.text(t,M+2,yy);yy+=4});doc.setFontSize(9)}y=yy+4;if(y>250){doc.addPage();y=20}});
 doc.setDrawColor(30);doc.setLineWidth(.6);doc.line(M,y-2,W-M,y-2);y+=8;const tr=(k,v,bold)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.text(k,W-M-55,y,{align:'right'});doc.text(v,W-M,y,{align:'right'});y+=6};if(d.addon||d.disc){tr('Subtotal:',money(sub));if(d.addon)tr('Add on:',money(d.addon));if(d.disc)tr('Discount:','-'+money(d.disc))}tr('Total:',money(tot),true);doc.setDrawColor(200);doc.setLineWidth(.3);doc.line(W-M-88,y-3,W-M,y-3);y+=2;tr('Amount Due (IDR):',money(tot),true);y+=8;
 doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.text('Notes / Terms',M,y);y+=5;doc.setFont('helvetica','normal');doc.setFontSize(8.8);doc.setTextColor(70);const notes=(d.notes??S.company.notes)+(kind==='Invoice'&&pdfNotes(d,tot)?'\n\n'+pdfNotes(d,tot):'');doc.splitTextToSize(notes,W-2*M).forEach(t=>{if(y>280){doc.addPage();y=20}doc.text(t,M,y);y+=4.2});return doc}
function showPdf(kind,d){try{const doc=buildPdf(kind,d);const url=doc.output('bloburl');const fn=(d.no||kind+'-draft').replace(/[^\w.-]/g,'_')+'.pdf';lastPdf={doc,fn,url};modal(`<div class="flex" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">${kind} · A4 <span class="muted" style="font-weight:400;font-size:13px" id="pdfpg"></span></h2><div class="flex"><button class="btn p" onclick="downloadPdf()">Unduh PDF</button><button class="btn" onclick="closeModal()">Tutup</button></div></div><div id="pdfcv" style="background:#525659;border-radius:10px;padding:14px;max-height:72vh;overflow:auto;text-align:center"><span class="small" style="color:#ccc">Merender…</span></div>`,true);renderPdf(doc.output('arraybuffer'))}catch(e){toast('PDF gagal: '+e.message)}}
let lastPdf=null;
async function downloadPdf(){if(!lastPdf)return;const {doc,fn,url}=lastPdf;try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data:doc.output('blob')});toast('PDF disimpan');return}}catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'){toast('Gagal menyimpan: '+e.message);return}}
 const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove()}
async function renderPdf(buf){const box=document.getElementById('pdfcv');try{const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await lib.getDocument({data:buf}).promise;box.innerHTML='';const w=Math.min(760,box.clientWidth-28);for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const vp0=page.getViewport({scale:1});const scale=w/vp0.width;const vp=page.getViewport({scale:scale*2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;cv.style.width=w+'px';cv.style.background='#fff';cv.style.boxShadow='0 4px 20px rgba(0,0,0,.4)';cv.style.marginBottom='14px';box.appendChild(cv);await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}const pg=document.getElementById('pdfpg');if(pg)pg.textContent='· '+pdf.numPages+' halaman · 210 × 297 mm'}catch(e){box.innerHTML='<p class="small" style="color:#fff">Pratinjau tidak tersedia di penampil ini — gunakan Unduh PDF. ('+esc(e.message)+')</p>'}}

 T('Evangeline: 6×4.500.000 + 12.195.000 = 39.195.000',()=>{const c=calc(S.invoices.find(v=>v.id==='v3'));return c.total===39195000||c.total});
 T('Diskon Kopi Tuku: 40.500.000 − 10.150.754 = 30.349.246',()=>{const c=calc(S.invoices.find(v=>v.id==='v2'));return c.total===30349246||c.total});

 T('Komisi AM 0,5% faktur lanjutan (Evangeline ke-25): 195.975',()=>{const c=calc(S.invoices.find(v=>v.id==='v3'));return(c.comm.amount===195975&&c.comm.rule.seller==='AM')||c.comm.amount});

 T('Lempar faktur ke bulan pilihan: nomor periode & tanggal bergeser, bulan yang sudah ada dilewati',()=>{const v=S.invoices.find(x=>x.id==='v3');const before=S.invoices.length;const n=throwInvoice(v,[1,3]);const made=S.invoices.slice(before);S.invoices.length=before;return(n===1&&made[0].date==='2026-12-08'&&made[0].seq===28&&/Periode 28/.test(made[0].lines[0].desc)&&made[0].lines[0].defer.s==='2026-12')||JSON.stringify(made.map(x=>[x.date,x.seq,x.lines[0].desc.slice(-60)]))});

/* ---------- grafik batang generik: klik batang → sumber data ---------- */
function miniChart(keys,series,labelFn){const W=900,H=220,L=64,B=26,T=16,pw=W-L-16,ph=H-T-B,n=keys.length,slot=pw/n,bw=Math.max(2,Math.min(34,slot*.62));const tot=k=>series.reduce((s,sr)=>s+(sr.v[k]||0),0);const max=Math.max(1,...keys.map(tot));let g='';for(let i=0;i<=3;i++){const y=T+ph-ph*i/3;g+=`<line class="grid" x1="${L}" x2="${W-16}" y1="${y}" y2="${y}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${fmtS(max*i/3)}</text>`}let bars='';keys.forEach((k,i)=>{const x=L+slot*i+(slot-bw)/2;let y=T+ph;series.forEach(sr=>{const v=sr.v[k]||0;if(!v)return;const h=ph*v/max;y-=h;bars+=`<rect class="bar" x="${x}" y="${y+1}" width="${bw}" height="${Math.max(0,h-2)}" rx="4" fill="${sr.color}" onclick="${sr.click.replace('{k}',k)}"><title>${esc(sr.name)} · ${labelFn(k)} · ${fmt(v)} — klik untuk rincian</title></rect>`});if(tot(k))bars+=`<text class="lbl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtS(tot(k))}</text>`;bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${labelFn(k)}</text>`});return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}${bars}</svg><div class="legend mt">${series.map(sr=>`<span><i style="background:${sr.color}"></i>${sr.name}</span>`).join('')}<span class="muted">· klik batang untuk melihat sumber data</span></div>`}

routes.projection=function(){const months=pjMonths();const custs=S.customers.filter(c=>!pjF.cust||c.id===pjF.cust);const cell=(c,m)=>S.invoices.filter(v=>v.cust===c.id&&ym(v.date)===m&&alive(v));const sum=(m,st)=>S.invoices.filter(v=>ym(v.date)===m&&v.status===st&&(!pjF.cust||v.cust===pjF.cust)).reduce((s,v)=>s+calc(v).total,0);const drafts=S.invoices.filter(v=>v.status==='draft');const late=drafts.filter(v=>D(v.date)<TODAY);
 const acc=pjF.basis==='akrual';const vI={},vD={};months.forEach(m=>{vI[m]=0;vD[m]=0});if(acc){S.invoices.filter(v=>(v.status==='issued'||v.status==='draft')&&(!pjF.cust||v.cust===pjF.cust)).forEach(v=>{const o=accByMonth(v);months.forEach(m=>{if(o[m])(v.status==='issued'?vI:vD)[m]+=o[m]})})}else months.forEach(m=>{vI[m]=sum(m,'issued');vD[m]=sum(m,'draft')});
 return`<div class="top"><div><h1>Proyeksi Revenue</h1><p>Faktur yang <b>dilempar</b> ke bulan depan menjadi proyeksi. Proyeksi bisa <b>digeser</b> antar bulan, <b>diedit</b>, <b>dibatalkan</b>, atau <b>diterbitkan</b> jadi faktur asli saat permintaan datang. Bukan faktur berulang otomatis.</p></div><div class="flex"><a class="btn g" href="#projwiz">Susun proyeksi bulan ini</a><a class="btn" href="#report/recurring">Laporan proyeksi</a><a class="btn" href="#cashin">Proyeksi cash in</a></div></div>
 <div class="grid g4 mb"><div class="card kpi"><p class="lbl">Proyeksi ${mlong(months[0])}</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();pjDrill('${months[0]}','draft')">${fmtS(vD[months[0]])}</a></div><div class="d">+ terbit ${fmtS(vI[months[0]])}</div></div><div class="card kpi"><p class="lbl">Proyeksi ${months.length} bulan</p><div class="v"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('Proyeksi ${mlong(months[0])} – ${mlong(months[months.length-1])}',S.invoices.filter(v=>v.status==='draft'&&${JSON.stringify(months).replace(/"/g,"'")}.includes(ym(v.date))).map(invRow))">${fmtS(months.reduce((s,m)=>s+vD[m],0))}</a></div><div class="d">${drafts.filter(v=>months.includes(ym(v.date))).length} proyeksi</div></div><div class="card kpi"><p class="lbl">Lewat tanggal, belum terbit</p><div class="v" style="color:var(--red)"><a href="#" style="color:inherit" onclick="event.preventDefault();drill('Proyeksi lewat tanggal',S.invoices.filter(v=>v.status==='draft'&&D(v.date)<TODAY).map(invRow))">${late.length}</a></div><div class="d">${fmtS(late.reduce((s,v)=>s+calc(v).total,0))} · terbitkan atau geser</div></div><div class="card kpi"><p class="lbl">Pelanggan tanpa proyeksi bulan depan</p><div class="v" style="color:var(--amber)">${S.customers.filter(c=>S.invoices.some(v=>v.cust===c.id&&v.status==='issued'&&v.recurring)&&!S.invoices.some(v=>v.cust===c.id&&ym(v.date)===ym(iso(addMonths(TODAY,1)))&&alive(v))).length}</a></div><div class="d">retainer yang belum dilempar</div></div></div>

n></a>`:`<div class="pj drf"><b><a href="#invoice/${v.id}" style="color:inherit">${fmtS(amt)}</a></b><span>proyeksi${D(v.date)<TODAY?' · <em style="color:var(--red)">lewat</em>':''}</span><span class="acts"><button title="Geser ke bulan sebelumnya" onclick="shiftDraftBy('${v.id}',-1)">◀</button><button title="Geser ke bulan berikutnya" onclick="shiftDraftBy('${v.id}',1)">▶</button><a title="Edit proyeksi" href="#invoice/${v.id}">✎</a><button title="Lempar ke bulan berikutnya" onclick="throwNext('${v.id}')">⇢</button><a title="Terbitkan" href="#invoice/${v.id}" style="color:var(--green)">✓</a><button title="Batalkan lemparan" class="d" onclick="delDraft('${v.id}')">✕</button></span></div>`}).join('')}</td>`}).join('')}<td class="num" style="font-weight:500">${fmt(months.reduce((s,m)=>s+cell(c,m).filter(v=>v.status==='draft').reduce((a,v)=>a+calc(v).total,0),0))}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total proyeksi</td>${months.map(m=>dcell(fmtS(vD[m]),`pjDrill('${m}','draft')`)).join('')}<td class="num">${fmt(months.reduce((s,m)=>s+vD[m],0))}</td></tr><tr><td>Total terbit</td>${months.map(m=>dcell(fmtS(vI[m]),`pjDrill('${m}','issued')`)).join('')}<td class="num">${fmt(months.reduce((s,m)=>s+vI[m],0))}</td></tr></tfoot></table></div></div>

lc(v).total)}</td><td>${dstr(v.cancelAt)} · ${esc(v.cancelBy||'')}</td><td>${esc(v.cancelReason||'')}</td><td class="right"><a class="btn q s" href="#invoice/${v.id}">Lihat</a> <button class="btn s" onclick="restoreDraft('${v.id}')">Pulihkan</button></td></tr>`).join('')}</tbody></table></div></div>`:''})()}`};
function shiftDraftBy(id,k){const v=S.invoices.find(x=>x.id===id);const to=ym(iso(addMonths(D(v.date),k)));if(S.invoices.some(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===to&&alive(x))){toast(mlong(to)+' sudah ada faktur/proyeksi untuk '+cu(v.cust).name);return}const terms=Math.round((D(v.due)-D(v.date))/864e5);const from=v.date;v.date=iso(addMonths(D(v.date),k));v.due=iso(addDays(D(v.date),terms));v.lines.forEach(l=>{if(l.defer&&l.defer.m)l.defer.s=ym(iso(addMonths(D(dmonth(l,{date:from})+'-01'),k)));l.desc=(l.desc||'').replace(/\(Periode (\d+) : [^)]*\)/,(m,p)=>`(Periode ${+p+k} : ${dfull(v.date)} - ${dfull(iso(addDays(addMonths(D(v.date),1),-1)))})`)});logIt('invoice',id,'Proyeksi digeser '+mlong(ym(from))+' → '+mlong(ym(v.date)));save();if(dD&&dD.id===id)dD=null;toast('Digeser ke '+mlong(ym(v.date)));nav()}
function delDraft(id){const v=S.invoices.find(x=>x.id===id);const r=prompt('Batalkan proyeksi '+cu(v.cust).name+' '+mlong(ym(v.date))+'? Alasan (mis. klien tidak lanjut):','');if(r===null)return;if(!r.trim()){toast('Alasan wajib');return}v.status='pcancel';v.cancelReason=r;v.cancelBy=me.name;v.cancelAt=iso(TODAY);delete tabState['invoice/'+id];logIt('invoice',id,'Proyeksi dibatalkan · '+cu(v.cust).name+' '+mlong(ym(v.date))+' · '+r);save();if(dD&&dD.id===id)dD=null;toast('Proyeksi dibatalkan — bisa dipulihkan dari Proyeksi Revenue → Dibatalkan');if(location.hash==='#invoice/'+id)go('projection');else nav()}
function restoreDraft(id){const v=S.invoices.find(x=>x.id===id);if(S.invoices.some(x=>x.cust===v.cust&&x.id!==v.id&&ym(x.date)===ym(v.date)&&alive(x))){toast(mlong(ym(v.date))+' sudah terisi — geser dulu yang ada, atau biarkan');return}v.status='draft';logIt('invoice',id,'Proyeksi dipulihkan');save();toast('Dipulihkan');nav()}

/* ---------- PEMBATALAN TRANSAKSI (dengan alasan, jejak audit, cek periode) ---------- */
function voidReceipt(id){const r=S.receipts.find(x=>x.id===id);if(S.periods[ym(r.date)]==='locked'){toast('Periode '+mlong(ym(r.date))+' terkunci');return}const why=prompt('Batalkan penerimaan '+r.no+'? Faktur terkait kembali terhutang. Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan wajib');return}r.status='void';r.voidReason=why;r.voidBy=me.name;r.voidAt=iso(TODAY);r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' dibatalkan · '+why));logIt('receipt',id,'Dibatalkan · '+why);save();dD=null;toast(r.no+' dibatalkan');nav()}
function unvoidReceipt(id){const r=S.receipts.find(x=>x.id===id);const dead=r.lines.map(l=>S.invoices.find(v=>v.id===l.inv)).filter(v=>!v||v.status!=='issued');if(dead.length){toast('Faktur '+dead.map(v=>v?v.no:'?').join(', ')+' tidak aktif — aktifkan fakturnya dulu');return}if(S.periods[ym(r.date)]==='locked'){toast('Periode terkunci');return}if(!confirm('Aktifkan kembali '+r.no+'?'))return;r.status='active';logIt('receipt',id,'Diaktifkan kembali');r.lines.forEach(l=>logIt('invoice',l.inv,'Penerimaan '+r.no+' diaktifkan kembali'));save();dD=null;nav()}
function voidCN(id){const n=S.creditNotes.find(x=>x.id===id);const why=prompt('Batalkan nota kredit '+n.no+'? Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan wajib');return}n.status='void';n.voidReason=why;logIt('invoice',n.inv,'Nota kredit '+n.no+' dibatalkan · '+why);save();dD=null;nav()}
function voidCommPay(id){const p=S.commPayments.find(x=>x.id===id);const why=prompt('Batalkan pembayaran komisi '+fmt(p.amount)+' ke '+se(p.seller).name+'? Alasan:','');if(why===null)return;if(!why.trim()){toast('Alasan wajib');return}p.status='void';p.voidReason=why;(p.alloc||[]).forEach(a=>logIt('invoice',a.inv,'Pembayaran komisi '+fmt(a.amt)+' dibatalkan · '+why));logIt('commission',p.seller,'Pembayaran komisi dibatalkan · '+why);save();nav()}
function unvoidCommPay(id){const p=S.commPayments.find(x=>x.id===id);if(!confirm('Aktifkan kembali pembayaran komisi '+fmt(p.amount)+'?'))return;p.status='active';logIt('commission',p.seller,'Pembayaran komisi diaktifkan kembali');save();nav()}
function unvoidCN(id){const n=S.creditNotes.find(x=>x.id===id);if(!confirm('Aktifkan kembali '+n.no+'?'))return;n.status='active';logIt('invoice',n.inv,'Nota kredit '+n.no+' diaktifkan kembali');save();dD=null;nav()}
function uncancelInvoice(id){const v=S.invoices.find(x=>x.id===id);if(!confirm('Aktifkan kembali '+v.no+'?'))return;v.status='issued';v.comm.on=true;logIt('invoice',id,'Diaktifkan kembali');save();dD=null;nav()}
routes.receipts=function(){const f=listFilter;const all=S.receipts.slice().sort((a,b)=>b.date.localeCompare(a.date));const rows=all.filter(r=>(!f.q||r.no.toLowerCase().includes(f.q)||cu(r.cust).name.toLowerCase().includes(f.q))&&(!f.c||r.cust===f.c)&&(f.s==='void'?r.status==='void':f.s==='active'?r.status!=='void':true));return`<div class="top"><div><h1>Penerimaan Penjualan</h1><p>Pembayaran dari pelanggan — kas, potongan PPh, diskon, uang muka · ${all.filter(r=>r.status==='void').length} dibatalkan</p></div><a class="btn g" href="#receipt/new">+ Penerimaan baru</a></div>${filterBar([`<select onchange="listFilter.c=this.value;nav()"><option value="">Pelanggan: semua</option>${S.customers.map(c=>`<option value="${c.id}" ${f.c===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`,`<select onchange="listFilter.s=this.value;nav()"><option value="">Status: semua</option><option value="active" ${f.s==='active'?'selected':''}>Aktif</option><option value="void" ${f.s==='void'?'selected':''}>Dibatalkan</option></select>`,`<input placeholder="Cari no. bukti / pelanggan" value="${esc(f.q||'')}" oninput="listFilter.q=this.value.toLowerCase();nav()">`,`<span class="sp"></span><span class="cnt">${rows.length} dari ${all.length}</span>`])}<div class="card flush"><div class="tw"><table><thead><tr><th>No. bukti</th><th>Tgl bayar</th><th>Terima dari</th><th>Bank</th><th>Cara bayar</th><th>Ref</th><th>Faktur</th><th class="num">Kas</th><th class="num">PPh</th><th class="num">Total pelunasan</th><th>Status</th></tr></thead><tbody>${rows.map(r=>{const cash=r.lines.reduce((s,l)=>s+(+l.cash||0),0),pph=r.lines.reduce((s,l)=>s+(+l.pph||0),0),disc=r.lines.reduce((s,l)=>s+(+l.disc||0),0),cr=r.lines.reduce((s,l)=>s+(+l.credit||0),0);const vd=r.status==='void';return`<tr class="row" style="${vd?'opacity:.55':''}" onclick="go('receipt/${r.id}')"><td class="mono">${r.no}</td><td>${dstr(r.date)}</td><td>${cu(r.cust).name}</td><td>${r.bank==='PT'?'Rek. PT':'Rek. pribadi'}</td><td>${esc(r.method||'')}</td><td class="muted">${esc(r.ref)}</td><td class="mono">${r.lines.map(l=>(S.invoices.find(v=>v.id===l.inv)||{}).no||'?').join(', ')}</td><td class="num">${fmt(cash)}</td><td class="num">${fmt(pph)}${r.lines.some(l=>(+l.pph||0)>0&&!(l.bukti||'').trim())?' <span class="chip a" title="Bukti potong belum diterima">BP?</span>':''}</td><td class="num">${fmt(cash+pph+disc+cr)}</td><td>${vd?`<span class="st r">Dibatalkan</span>`:'<span class="st g">Aktif</span>'}</td></tr>`}).join('')}</tbody></table></div></div>`};

 return`<div class="top"><div><h1>Buku Bank</h1><p>Saldo dan mutasi kas & bank dari transaksi sistem: kas masuk (penerimaan) dan kas keluar (pembayaran komisi). Modul biaya/AP menyusul di sistem cost control.</p></div><div class="flex"><a class="btn" href="#report/cashproj">Proyeksi kas</a><button class="btn" onclick="editBanks()">Saldo awal</button></div></div>

 ${filterBar([`<select onchange="bkF.acc=this.value;nav()"><option value="">Rekening: semua</option>${S.banks.map(b=>`<option value="${b.id}" ${bkF.acc===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`,`<select onchange="bkF.m=this.value;nav()"><option value="">Bulan: semua</option>${months.map(m=>`<option value="${m}" ${bkF.m===m?'selected':''}>${mlong(m)}</option>`).join('')}</select>`,`<span class="sp"></span><button class="btn s" onclick="exportTable(document.querySelector('table.bank'),'buku-bank.csv')">Ekspor CSV</button>`])}
